/* ═══════════ первый запуск ═══════════ */
/* ═══════════ LIFE_PLANNER_INIT v1 ═══════════ */
/* отдельный слой первоначальной сборки: собирает НОВЫЙ планер из пакета распаковки.
   Не путать с LIFE_PLANNER_UPDATE (меняет существующий) и с копией JSON (восстанавливает точное состояние). */
const INIT_LIMITS={spheres:20,goals:40,results:10,metrics:20,milestones:50,hyps:100,steps:50,tasks:30};
const INIT_PALETTE=["#E2A33C","#E1705B","#5B8DEF","#3FB183","#41B8CD","#DE7CAA","#A585E8","#7B8CA6","#C98A5B","#6FB86B"];
const R_TYPES=["current_state","cumulative_period","period_value"];
const R_RULES=["higher_better","lower_better","target_value","range"];
const ACC=["week","month","goal_period"];
const FREQ=["weekly","monthly","manual"];
const IMPORTANCE={normal:{imp:false,challenge:false,xp:1},important:{imp:true,challenge:false,xp:3},challenge:{imp:false,challenge:true,xp:5}};

function checkInit(p){
 const W=[], fail=m=>({fatal:m,warns:W});
 const isObj=o=>o&&typeof o==="object"&&!Array.isArray(o);
 const arr=a=>Array.isArray(a)?a:[];
 const num=v=>typeof v==="number"&&isFinite(v);
 const str=v=>typeof v==="string"?v.trim():"";
 if(!isObj(p)) return fail("Не вижу пакета. Вставь ответ целиком — я найду нужную часть.");
 if(p.type!=="LIFE_PLANNER_INIT") return fail(p.type==="LIFE_PLANNER_UPDATE"
   ? "Это пакет изменений LIFE_PLANNER_UPDATE, а не первоначальный план. Примени его через «Применить изменения из ИИ»."
   : "Это не пакет LIFE_PLANNER_INIT.");
 if(Number(p.version)!==1) return fail(`Версия пакета ${p.version} пока не поддерживается. Нужна версия 1.`);
 /* ——— период ——— */
 const per=isObj(p.period)?p.period:null;
 if(!per||!isDate(per.start)||!isDate(per.end)) return fail("В пакете нет корректного периода: нужны даты начала и конца в формате ГГГГ-ММ-ДД.");
 if(per.start>=per.end) return fail("Початок періоду должно быть раньше конца.");
 const months=buildMonths(per.start,per.end);
 if(!months.length) return fail("Из этого периода не получается ни одного месяца.");
 const monthByKey={}; months.forEach(m=>monthByKey[m.id.slice(2,6)+"-"+m.id.slice(6)]=m);
 const emptyPlan=()=>{const o={};months.forEach(m=>o[m.id]=0);return o;};
 /* ——— сферы ——— */
 const rawSph=arr(p.spheres).filter(isObj);
 if(rawSph.length>INIT_LIMITS.spheres) return fail(`Слишком много сфер: ${rawSph.length}. Максимум ${INIT_LIMITS.spheres}.`);
 const sphMap={}, spheres=[];
 rawSph.forEach((s,i)=>{
  const key=str(s.key)||str(s.name)||("sphere"+i);
  if(sphMap[key]) return W.push(`Сфера «${key}» встречается дважды — оставляю первую.`);
  const id="s_"+uid();
  sphMap[key]={id};
  spheres.push({id,name:str(s.name)||key,emoji:str(s.emoji)||"🎯",color:INIT_PALETTE[spheres.length%INIT_PALETTE.length]});
 });
 if(!spheres.length){ const id="s_"+uid(); sphMap.__default={id}; spheres.push({id,name:"Мои цели",emoji:"🎯",color:INIT_PALETTE[0]}); }
 const defSphere=spheres[0].id;
 /* ——— цели ——— */
 const rawGoals=arr(p.goals).filter(isObj);
 if(arr(p.goals).length!==rawGoals.length) W.push("В списке целей были повреждённые записи — пропускаю их.");
 if(rawGoals.length>INIT_LIMITS.goals) return fail(`Слишком много целей: ${rawGoals.length}. Максимум ${INIT_LIMITS.goals}.`);
 const goalMap={}, goals=[], journal=[];
 for(let gi=0;gi<rawGoals.length;gi++){
  const g=rawGoals[gi];
  const gkey=str(g.key)||str(g.name)||("goal"+gi);
  const nm=str(g.name);
  if(!nm) return fail(`У цели «${gkey}» нет названия.`);
  if(goalMap[gkey]) return fail(`Ключ цели «${gkey}» встречается дважды. Ключи должны быть уникальными.`);
  const type=str(g.type)||"result";
  if(!["result","count","project"].includes(type)) return fail(`У цели «${nm}» неизвестный тип «${type}». Допустимы result, count и project.`);
  const rawRes=arr(g.resultMetrics).filter(isObj), rawAct=arr(g.actionMetrics).filter(isObj), rawMs=arr(g.milestones).filter(isObj);
  if(type==="result"&&!rawRes.length) return fail(`Цель «${nm}» — result, но у неё нет показателя результата. Добавь показатель или поменяй тип цели.`);
  if(type!=="result"&&rawRes.length) return fail(`У цели «${nm}» тип ${type}, но указан показатель результата. Раздели цель или поменяй её тип.`);
  if(type==="count"&&!rawAct.length) return fail(`Цель «${nm}» — count, но у неё нет метрики действия. Количество нельзя считать без метрики действия.`);
  if(type!=="project"&&rawMs.length) return fail(`У цели «${nm}» тип ${type}, но указаны этапы. Этапы бывают только у проекта — раздели цель или поменяй её тип.`);
  if(type==="project"&&!rawMs.length) W.push(`У проекта «${nm}» пока нет этапов — прогресс будет считать не по чему. Их можно добавить позже.`);
  if(rawRes.length>INIT_LIMITS.results) return fail(`У цели «${nm}» слишком много показателей результата: ${rawRes.length}. Максимум ${INIT_LIMITS.results}.`);
  if(rawAct.length>INIT_LIMITS.metrics) return fail(`У цели «${nm}» слишком много метрик действий: ${rawAct.length}. Максимум ${INIT_LIMITS.metrics}.`);
  if(rawMs.length>INIT_LIMITS.milestones) return fail(`У проекта «${nm}» слишком много этапов: ${rawMs.length}. Максимум ${INIT_LIMITS.milestones}.`);
  const skey=str(g.sphereKey);
  if(skey&&!sphMap[skey]) W.push(`Цель «${nm}»: сфера «${skey}» не найдена — кладу в «${spheres[0].name}».`);
  let prio=Number(g.priority); if(![1,2,3].includes(prio)){ if(g.priority!=null) W.push(`У цели «${nm}» приоритет «${g.priority}» не распознан — ставлю «важная».`); prio=2; }
  let status=str(g.status)||"active";
  if(!["active","paused"].includes(status)){ W.push(`У цели «${nm}» статус «${status}» не подходит для нового планера — ставлю «активная».`); status="active"; }
  let deadline=isDate(g.deadline)?g.deadline:per.end;
  if(g.deadline&&!isDate(g.deadline)) W.push(`У цели «${nm}» непонятный срок — беру конец периода.`);
  if(deadline<per.start){ W.push(`У цели «${nm}» срок ${dfull(deadline)} раньше начала периода.`); }
  const goal={id:"g_"+uid(),emoji:str(g.emoji)||"🎯",name:nm,sphereId:(skey&&sphMap[skey]?sphMap[skey].id:defSphere),
   type,priority:prio,status,deadline,results:[],metrics:[],milestones:[],
   hypothesis:str(g.hypothesis),full:str(g.full),easy:str(g.easy),note:str(g.note),
   result:{from:0,to:0,current:0,unit:""}};
  goalMap[gkey]={goal,results:{},metrics:{},milestones:{}};
  /* показатели результата */
  const rkeys={};
  rawRes.forEach((r,ri)=>{
   const rkey=str(r.key)||str(r.name)||("result"+ri);
   if(rkeys[rkey]){ W.push(`Цель «${nm}»: показатель «${rkey}» повторяется — оставляю первый.`); return; }
   rkeys[rkey]=1;
   const rtype=str(r.type)||"current_state";
   if(!R_TYPES.includes(rtype)) throw {initFatal:`Цель «${nm}»: у показателя «${str(r.name)||rkey}» неизвестный тип «${rtype}».`};
   const rule=str(r.successRule)||"higher_better";
   if(!R_RULES.includes(rule)) throw {initFatal:`Цель «${nm}»: у показателя «${str(r.name)||rkey}» неизвестное правило успеха «${rule}».`};
   const baseline=num(r.baseline)?r.baseline:0, target=num(r.target)?r.target:0;
   const rmin=num(r.rangeMin)?r.rangeMin:0, rmax=num(r.rangeMax)?r.rangeMax:0;
   if(rule==="range"&&rmin>rmax) throw {initFatal:`Цель «${nm}»: у показателя «${str(r.name)||rkey}» нижняя граница больше верхней.`};
   if(rule==="range"&&rmin===0&&rmax===0) W.push(`Цель «${nm}»: у диапазона не заданы границы.`);
   let acc=str(r.accumulationPeriod)||"month"; if(!ACC.includes(acc)){ W.push(`Цель «${nm}»: период накопления «${acc}» не распознан — беру месяц.`); acc="month"; }
   let freq=str(r.checkFrequency)||"weekly"; if(!FREQ.includes(freq)){ W.push(`Цель «${nm}»: частота проверки «${freq}» не распознана — беру раз в неделю.`); freq="weekly"; }
   const rm=resultMetric({name:str(r.name)||"Результат",emoji:str(r.emoji)||"🎯",unit:str(r.unit),type:rtype,successRule:rule,
    baseline,target,rangeMin:rmin,rangeMax:rmax,accumulationPeriod:acc,checkFrequency:freq,
    status:str(r.status)==="paused"?"paused":"active",primary:!!r.primary});
   goal.results.push(rm); goalMap[gkey].results[rkey]=rm;
   /* реально известные измерения */
   const seen={}, mine=[];
   arr(r.initialEntries).filter(isObj).forEach(e=>{
    const v=Number(e.value);
    if(!isFinite(v)) throw {initFatal:`Цель «${nm}»: у показателя «${rm.name}» есть запись без числового значения.`};
    /* дату фактического измерения не подставляем: нет корректной даты — записи не будет */
    if(!isDate(e.date)){ W.push(`Цель «${nm}», показатель «${rm.name}»: измерение без корректной даты пропущено. Дату факта автоматически не подставляю.`); return; }
    const dt=e.date;
    if(dt>today()) throw {initFatal:`Цель «${nm}»: запись показателя «${rm.name}» датирована будущим (${dfull(dt)}). Факты из будущего не записываю.`};
    const sig=dt+"|"+v;
    if(seen[sig]){ W.push(`Цель «${nm}»: одинаковая запись показателя «${rm.name}» за ${dfull(dt)} повторяется — оставляю одну.`); return; }
    seen[sig]=1;
    const mo=months.find(m=>dt>=m.start&&dt<=m.end);
    mine.push({date:dt,value:v});
    journal.push({id:uid(),date:dt,kind:"result",goalId:goal.id,resultId:rm.id,value:v,unit:rm.unit||"",
     bucket:"",sourceType:"init",note:str(e.note),seq:journal.length,cancelled:false,monthId:mo?mo.id:"",
     title:`${rm.name}: ${vfmt(v)}${rm.unit?" "+rm.unit:""}`,goalName:goal.name,goalEmoji:goal.emoji,metricName:rm.name});
   });
   /* накопление внутри одного периода не может уменьшаться */
   if(rtype==="cumulative_period"&&mine.length>1){
    const bucket=dt=>{
     if(acc==="week") return "w:"+mondayOf(dt);
     if(acc==="goal_period") return "p";
     const mo=months.find(m=>dt>=m.start&&dt<=m.end);
     return "m:"+(mo?mo.id:dt.slice(0,7));
    };
    const last={};
    mine.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(x=>{
     const k=bucket(x.date);
     if(last[k]!=null&&x.value<last[k])
      throw {initFatal:`Цель «${nm}»: у накопительного показателя «${rm.name}» значение ${vfmt(x.value)} за ${dfull(x.date)} меньше предыдущего ${vfmt(last[k])} внутри того же периода. Накопление не может уменьшаться.`};
     last[k]=x.value;
    });
   }
  });
  const act=goal.results.filter(r=>r.status==="active");
  if(act.length){
   const prim=act.filter(r=>r.primary);
   if(!prim.length){ act[0].primary=true; W.push(`Цель «${nm}»: основной показатель не отмечен — беру «${act[0].name}».`); }
   else if(prim.length>1){ prim.slice(1).forEach(r=>r.primary=false); W.push(`Цель «${nm}»: основных показателей несколько — оставляю «${prim[0].name}».`); }
  }
  /* метрики действий */
  const mkeys={};
  rawAct.forEach((m,mi)=>{
   const mkey=str(m.key)||str(m.name)||("metric"+mi);
   if(mkeys[mkey]) throw {initFatal:`Цель «${nm}»: ключ метрики «${mkey}» встречается дважды.`};
   mkeys[mkey]=1;
   const vt=str(m.valueType)==="volume"?"volume":"count";
   if(m.valueType&&!["count","volume"].includes(str(m.valueType))) W.push(`Цель «${nm}»: у метрики «${str(m.name)||mkey}» тип значения «${m.valueType}» не распознан — считаю штуками.`);
   const mm={id:"me_"+uid(),name:str(m.name)||"Дія",emoji:str(m.emoji)||"✅",unit:str(m.unit),
    total:num(m.total)&&m.total>=0?Math.round(m.total):0,plan:emptyPlan(),valueType:vt,
    regular:!!m.regular,perWeek:Number(m.perWeek)||0,easyWeek:Number(m.easyWeek)||0};
   if(mm.regular&&!(mm.perWeek>0)) throw {initFatal:`Цель «${nm}»: метрика «${mm.name}» отмечена как регулярная, но недельный ритм не задан.`};
   if(mm.easyWeek>mm.perWeek){ W.push(`Цель «${nm}»: у метрики «${mm.name}» лёгкая версия больше обычной — выравниваю.`); mm.easyWeek=mm.perWeek; }
   let sum=0;
   const mp=isObj(m.monthPlans)?m.monthPlans:{};
   Object.keys(mp).forEach(k=>{
    const v=Number(mp[k]);
    if(!isFinite(v)||v<0) throw {initFatal:`Цель «${nm}»: у метрики «${mm.name}» план месяца ${k} задан неверно.`};
    const mo=monthByKey[k];
    if(!mo){ W.push(`Цель «${nm}»: месяц ${k} вне периода — план этого месяца пропускаю.`); return; }
    mm.plan[mo.id]=Math.round(v); sum+=Math.round(v);
   });
   if(sum&&mm.total&&sum!==mm.total) W.push(`У метрики «${mm.name}» общий план ${nfmt(mm.total)}, а по месяцам распределено ${nfmt(sum)}.`);
   if(!mm.total&&sum) mm.total=sum;
   goal.metrics.push(mm); goalMap[gkey].metrics[mkey]=mm;
  });
  /* этапы проекта */
  const mskeys={};
  rawMs.forEach((ms,si)=>{
   const key=str(ms.key)||str(ms.title)||("ms"+si);
   if(mskeys[key]){ W.push(`Проект «${nm}»: этап «${key}» повторяется — оставляю первый.`); return; }
   mskeys[key]=1;
   const o={id:uid(),title:str(ms.title)||key,done:false};
   goal.milestones.push(o); goalMap[gkey].milestones[key]=o;
  });
  goals.push(goal);
 }
 /* ——— гипотезы ——— */
 const rawHyps=arr(p.hypotheses).filter(isObj);
 if(rawHyps.length>INIT_LIMITS.hyps) return fail(`Слишком много гипотез: ${rawHyps.length}. Максимум ${INIT_LIMITS.hyps}.`);
 const hyps=[], primByGoal={};
 rawHyps.forEach((h,hi)=>{
  const gk=str(h.goalKey);
  if(gk&&!goalMap[gk]) throw {initFatal:`Гипотеза «${str(h.name)||hi}» ссылается на неизвестную цель «${gk}».`};
  let stt=str(h.status)||"testing";
  if(!["testing","works","change","drop"].includes(stt)){ W.push(`У гипотезы «${str(h.name)||hi}» статус «${stt}» не распознан — ставлю «проверяю».`); stt="testing"; }
  const hp={id:"h_"+uid(),goalId:gk?goalMap[gk].goal.id:"",name:str(h.name)||"Гипотеза",
   start:isDate(h.start)?h.start:per.start,assume:str(h.assume),test:str(h.test),
   result:str(h.result),conclusion:str(h.conclusion),nextTest:str(h.nextTest),status:stt,hist:[]};
  hyps.push(hp);
  if(h.primary&&gk){
   if(primByGoal[gk]) W.push(`У цели «${goalMap[gk].goal.name}» несколько главных гипотез — главной оставляю первую.`);
   else { primByGoal[gk]=1; if(hp.assume) goalMap[gk].goal.hypothesis=hp.assume; }
  }
 });
 /* ——— содержимое месяцев ——— */
 const monthData={}; months.forEach(m=>monthData[m.id]={theme:"",outcome:"",review:"",steps:[]});
 const stepIndex={};
 arr(p.months).filter(isObj).forEach(mo=>{
  const key=str(mo.month), target=monthByKey[key];
  if(!target){ W.push(`Месяц ${key||"без названия"} вне периода — его план пропускаю.`); return; }
  const md=monthData[target.id];
  md.theme=str(mo.theme); md.outcome=str(mo.outcome);
  const steps=arr(mo.steps).filter(isObj);
  if(steps.length>INIT_LIMITS.steps) throw {initFatal:`В месяце ${key} слишком много пунктов: ${steps.length}. Максимум ${INIT_LIMITS.steps}.`};
  steps.forEach((s,si)=>{
   const gk=str(s.goalKey);
   if(gk&&!goalMap[gk]){ W.push(`Пункт «${str(s.title)||si}» в месяце ${key}: цель «${gk}» не найдена — оставляю без цели.`); }
   const imp=IMPORTANCE[str(s.importance)]||IMPORTANCE.normal;
   const st={id:uid(),goalId:gk&&goalMap[gk]?goalMap[gk].goal.id:"",title:str(s.title)||"Пункт",
    done:false,imp:imp.imp,challenge:imp.challenge,xp:imp.xp,xpGiven:false};
   md.steps.push(st);
   stepIndex[key+"|"+(str(s.key)||str(s.title)||si)]={step:st,monthId:target.id};
  });
 });
 /* ——— первая неделя ——— */
 let week=null;
 if(isObj(p.week)){
  const wk=p.week;
  const tasksRaw=arr(wk.tasks).filter(isObj);
  if(tasksRaw.length>INIT_LIMITS.tasks) return fail(`В первой неделе слишком много задач: ${tasksRaw.length}. Максимум ${INIT_LIMITS.tasks}.`);
  const start=isDate(wk.start)?mondayOf(wk.start):mondayOf(today());
  if(wk.start&&!isDate(wk.start)) W.push("У первой недели непонятная дата начала — беру текущую неделю.");
  const tasks=[];
  for(let ti=0;ti<tasksRaw.length;ti++){
   const t=tasksRaw[ti];
   const title=str(t.title); if(!title){ W.push("В первой неделе была задача без названия — пропускаю."); continue; }
   const gk=str(t.goalKey);
   if(gk&&!goalMap[gk]) return fail(`Задача недели «${title}» ссылается на неизвестную цель «${gk}».`);
   const gEntry=gk?goalMap[gk]:null;
   const mk=str(t.metricKey);
   let met=null;
   if(mk){
    if(!gEntry) return fail(`Задача недели «${title}» указывает метрику «${mk}», но не указывает цель.`);
    met=gEntry.metrics[mk];
    if(!met) return fail(`Задача недели «${title}»: метрика «${mk}» не найдена у цели «${gEntry.goal.name}».`);
   }
   let type=str(t.type)||"binary";
   if(!["binary","count","volume"].includes(type)){ W.push(`Задача «${title}»: тип «${type}» не распознан — считаю одним действием.`); type="binary"; }
   if(type==="volume"&&!met) return fail(`Задача недели «${title}» объёмная, но не связана с метрикой действия. Объём считается только по метрике.`);
   if(met){
    const want=met.valueType==="volume"?"volume":"count";
    if(type!==want){ W.push(`Задача «${title}»: тип приведён к типу метрики «${met.name}».`); type=want; }
   }
   let planned=Number(t.planned);
   if(type==="binary") planned=1;
   else if(!isFinite(planned)||planned<=0) return fail(`Задача недели «${title}»: план должен быть положительным числом.`);
   else planned=Math.round(planned);
   let source={kind:met?"metric":"manual",id:met?met.id:"",goalId:gEntry?gEntry.goal.id:""};
   let ownerId=gEntry?gEntry.goal.id:"";
   const sr=isObj(t.sourceRef)?t.sourceRef:null;
   if(sr){
    const kind=str(sr.kind);
    if(kind==="monthStep"){
     const hit=stepIndex[str(sr.month)+"|"+str(sr.stepKey)];
     if(!hit) return fail(`Задача недели «${title}» ссылается на пункт месяца, которого нет в пакете.`);
     const stepGoal=hit.step.goalId||"";
     /* задача не может писать факт одной цели и закрывать пункт другой */
     if(stepGoal&&ownerId&&stepGoal!==ownerId)
      return fail(`Задача недели «${title}» относится к одной цели, а закрывает пункт месяца другой. Свяжи её с одной целью.`);
     if(!ownerId&&stepGoal) ownerId=stepGoal;
     source={kind:"monthStep",id:hit.step.id,monthId:hit.monthId,goalId:stepGoal||ownerId};
    }else if(kind==="milestone"){
     const og=goalMap[str(sr.goalKey)];
     const ms=og?og.milestones[str(sr.milestoneKey)]:null;
     if(!ms) return fail(`Задача недели «${title}» ссылается на этап, которого нет в пакете.`);
     if(ownerId&&og.goal.id!==ownerId)
      return fail(`Задача недели «${title}» относится к одной цели, а закрывает этап другой. Свяжи её с одной целью.`);
     if(!ownerId) ownerId=og.goal.id;
     source={kind:"milestone",id:ms.id,goalId:og.goal.id};
    }else W.push(`Задача «${title}»: связь «${kind}» не распознана — оставляю обычной задачей.`);
   }
   /* метрика всегда принадлежит той же цели, что и сама задача */
   if(met&&gEntry&&ownerId&&gEntry.goal.id!==ownerId)
    return fail(`Задача недели «${title}»: метрика принадлежит одной цели, а связь ведёт к другой.`);
   tasks.push({id:uid(),goalId:ownerId,metricId:met?met.id:"",title,
    type,planned,completed:0,done:false,imp:!!t.important,challenge:!!t.challenge,
    easy:str(t.easy),day:"",note:"",carried:0,reason:"",reasons:[],xpGiven:false,source});
  }
  week={start,focus:str(wk.focus),challenge:str(wk.challenge),
   mode:str(wk.mode)==="easy"?"easy":"normal",review:{a1:"",a2:"",a3:""},tasks};
 }
 /* ——— собираем новый планер с нуля ——— */
 const st=emptySeed();
 st.name=str((isObj(p.profile)?p.profile.name:""))||"друг";
 const wn=str(isObj(p.profile)?p.profile.workNote:""); if(wn) st.workNote=wn;
 st.period={start:per.start,end:per.end};
 st.months=months.map(m=>({...m}));
 st.monthData=monthData;
 st.spheres=spheres;
 st.goals=goals;
 st.hyps=hyps;
 st.journal=journal;
 st.week=week||{start:mondayOf(today()),focus:"",challenge:"",mode:"normal",review:{a1:"",a2:"",a3:""},tasks:[]};
 st.xp=0; st.seenAch=[]; st.weekArchive=[]; st.weekReviews=[]; st.monthReviews={};
 st.appliedPackets=[]; st.monthQueue=[]; st.skipped={}; st.skippedM={};
 st.lastSeenMonth=""; st.lastAcknowledgedMonth=""; st.newWeekPending=false; st.monthPending="";
 st.catchUp=false; st.firstWeek=true; st.calendarUpgrade=true; st.journalUpgrade=true; st.resultUpgrade=true; st.regUpgrade=true;
 st.initApplied=new Date().toISOString();
 const summary={name:st.name,period:st.period,months,spheres,goals,hyps,monthData,week:week,journalCount:journal.length};
 return {fatal:null,warns:W,candidate:st,summary};
}
/* обёртка: превращает внутренние throw в понятный fatal */
function checkInitSafe(p){
 try{ return checkInit(p); }
 catch(e){ if(e&&e.initFatal) return {fatal:e.initFatal,warns:[]}; return {fatal:"Пакет не удалось разобрать: "+((e&&e.message)||"неизвестная ошибка"),warns:[]}; }
}

function goalNameById(st,id){ const g=(st.goals||[]).find(x=>x.id===id); return g?g.emoji+" "+g.name:""; }
/* применение: активное состояние заменяется только после проверки и копии */
function applyInitState(candidate){
 let st=null;
 try{ st=normalize(JSON.parse(JSON.stringify(candidate))); }catch(e){ return {ok:false,error:"Планер не собрался — ничего не менял"}; }
 const v=validateState(st);
 if(!v.ok) return {ok:false,error:"Планер не прошёл проверку: "+v.error};
 const keep=S, keepTab=TAB, keepSel=MSEL;
 try{
  S=st; MSEL=null;
  ["notebook","home","week","goals","path","wrev","mrev","ach","hyp","hist"].forEach(t=>{TAB=t;viewFor(t)();});
 }catch(e){ S=keep; TAB=keepTab; MSEL=keepSel; return {ok:false,error:"Планер не строится — ничего не менял"}; }
 S=keep; TAB=keepTab; MSEL=keepSel;
 if(meaningfulState(S)){
  const bk=writePreImportBackup();
  if(!bk.ok) return {ok:false,error:"Не удалось создать резервную копию текущего планера. Создание отменено."};
 }
 S=st; window.__draft=null; window.__fillWeek=null; MSEL=null; TAB="notebook";
 checkPeriods(); save(); render();
 return {ok:true};
}

function runInit(text){

  if(raw&&!raw.type&&Array.isArray(raw.goals)){ toast("Похоже, это резервная копия Life Planner. Её нужно загрузить через «Загрузить копию JSON»"); return; }
  toast("Не нашла LIFE_PLANNER_INIT в этом тексте"); return; }
 if(!p.type&&Array.isArray(p.goals)){ toast("Похоже, это резервная копия Life Planner. Её нужно загрузить через «Загрузить копию JSON»"); return; }
 if(p.type==="LIFE_PLANNER_UPDATE"){ toast("Это пакет изменений LIFE_PLANNER_UPDATE — его применяют через «Применить изменения из ИИ»"); return; }
 if(p.type!=="LIFE_PLANNER_INIT"){ toast("Это не LIFE_PLANNER_INIT"); return; }

}

  modal({title:"✅ З яких етапів складається ціль",body:`
   <div class="sub" style="margin-bottom:16px">Проєкт «${esc(draft.goal.name)}» вимірюється етапами. Можна додати 1–5 зараз або пропустити і дописати пізніше.</div>
   <label class="f"><span>Етапи — кожен з нового рядка</span><textarea id="obMS" style="min-height:120px" placeholder="Наприклад:&#10;Документи&#10;Квитки&#10;Житло"></textarea></label>`,
   actions:[{t:"Пропустити",c:"o",fn:()=>{ closeModal(); setTimeout(()=>onboarding(4,draft),60); }},
    {t:"Далі",fn:()=>{ draft.milestones=val("obMS").split("\n").map(x=>x.trim()).filter(Boolean).slice(0,5);
     closeModal(); setTimeout(()=>onboarding(4,draft),60);}}]});
  return;
 }
 modal({title:"⚡ Що будеш робити",body:`
  <div class="sub" style="margin-bottom:16px">Дія, яку ти контролюєш. Наприклад: ролики, тренування, листи.</div>
  <label class="f"><span>Назва дії</span><input type="text" id="obMN" placeholder="Наприклад: ролики"></label>
  <div class="g3">
   <label class="f"><span>Всього за період</span><input type="number" id="obMT" value="12"></label>
   <label class="f"><span>Одиниця</span><input type="text" id="obMU" value="шт"></label>
   <label class="f"><span>Щотижня</span><input type="number" id="obMW" value="1" min="0"></label>
  </div>
  <div class="hint">Якщо поставити тижневий ритм, дія сама повертатиметься в кожен новий тиждень.</div>`,
  actions:[].concat(draft.goal&&draft.goal.type==="count"?[]:[{t:"Пропустити",c:"o",fn:()=>{ applyOnboarding(draft,false); finish(); }}],
   [{t:"Готово",fn:()=>{
    const nm=val("obMN").trim();
    if(draft.goal&&draft.goal.type==="count"&&!nm){ toast("Для цілі-кількості потрібно назвати, що саме рахуємо"); return; }
    draft.metric={name:nm,total:Number(val("obMT"))||0,unit:val("obMU")||"шт",perWeek:Number(val("obMW"))||0};
    applyOnboarding(draft,false); finish();}}])});
}
function applyOnboarding(draft,skipAll){
 S.name=draft.name||"друже";
 rebuildMonths(draft.start,draft.end);
 S.week={start:mondayOf(today()),focus:"",challenge:"",mode:"normal",review:{a1:"",a2:"",a3:""},tasks:[]};
 S.lastSeenMonth=curMonthId(); S.monthQueue=[]; S.monthPending="";
 if(!skipAll&&draft.goal){
  const g={id:"g_"+uid(),emoji:draft.goal.emoji,name:draft.goal.name,sphereId:draft.goal.sphereId,type:draft.goal.type,
   priority:3,status:"active",deadline:S.period.end,results:[],metrics:[],milestones:[],
   hypothesis:"",full:"",easy:"",note:""};
  S.goals.push(g);
  if(draft.result&&draft.goal.type==="result"){
   const rm=resultMetric({name:draft.result.name,emoji:draft.goal.emoji,unit:draft.result.unit,type:draft.result.type,
    successRule:draft.result.successRule,baseline:draft.result.baseline,target:draft.result.target,primary:true});
   g.results.push(rm); rAdd(g,rm,rm.baseline,today(),"manual","точка відліку");
  }
  if(draft.milestones&&draft.milestones.length) g.milestones=draft.milestones.map(t=>({id:uid(),title:t,done:false}));
  if(draft.metric&&draft.metric.name){
   const m=metric(draft.metric.name,"✅",draft.metric.unit,draft.metric.total,[],
    draft.metric.perWeek>0,draft.metric.perWeek,0,"count");
   m.plan=planFor(draft.metric.total);
   g.metrics.push(m);
  }
 }
 checkPeriods(); save();
 setTimeout(()=>toast(skipAll?"Порожній планер готовий — додавай цілі, коли будеш готова":"Готово! Можна зібрати перший тиждень"),300);
}

/* ═══════════ старт ═══════════ */
S=load();
const FIRST_RUN=!S;
if(FIRST_RUN) S=seed({empty:true});
if(!S.seenAch.length) S.seenAch=achList().filter(a=>a.on).map(a=>a.id);
checkPeriods(); save(); render();
if(FIRST_RUN) setTimeout(()=>autoGithubPullFirstRun().then(ok=>{ if(!ok) startChoice(); }),150);
else if(S.migratedFrom){ const k=S.migratedFrom; delete S.migratedFrom; save();
 setTimeout(()=>toast("Дані перенесено в загальне сховище застосунку"),400); }
/* если вкладка была открыта через полночь — пересчитываем календарь при возврате */
/* календарь живой: сверяем дату и текущий месяц, а не только флаги */
let __lastDay=today(), __lastMonth=curMonthId();
function refreshCalendar(){
 const day=today(), mo=curMonthId();
 const w=S.newWeekPending, m=S.monthPending, q=(S.monthQueue||[]).join(",");
 checkPeriods();
 const changed = day!==__lastDay || mo!==__lastMonth
   || w!==S.newWeekPending || m!==S.monthPending || q!==(S.monthQueue||[]).join(",");
 __lastDay=day; __lastMonth=mo;
 if(changed){ save(); render(); }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshCalendar(); });
window.addEventListener("focus",refreshCalendar);
setInterval(()=>{ if(today()!==__lastDay) refreshCalendar(); },60000);   // тихая проверка смены суток
</script>
