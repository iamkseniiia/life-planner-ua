<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мій план життя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,500;9..144,560;9..144,650&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --soft:#F2F2F7;
  --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#75757A;
  --line:#E5E5EA;
  --acc:#0071E3; --acc-soft:#EAF3FF;
  --ok:#2FA84F; --ok-soft:#E7F6EA;
  --warn:#C77700; --warn-soft:#FFF3E0;
  --bad:#D70015;
  --missed-bg:#F1E8FF; --missed-fg:#7A3FB0;
  /* сенйор-дизайн-ревізія: раніше --r=28px давало на мобільних картках непропорційно круглі кути,
     а --sh/--line були надто важкими (жорсткий бордер + важка тінь одночасно) — «грязнить» інтерфейс.
     Знижуємо радіуси до spacing-скейлу 20/14/10 і полегшуємо тінь+лінію, щоб глибина йшла переважно
     від тіні, а не від контрастного бордера. */
  --r:20px; --r2:14px; --r3:10px;
  --sh:0 1px 2px rgba(0,0,0,.04), 0 14px 28px -18px rgba(0,0,0,.10);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* раніше тут був окремий серифний Fraunces для заголовків («Ритм тижня» тощо) — саме він, а не «12 тижнів»,
     виглядав чужорідно на власних скрінах користувачки, тож за її явним проханням прибираємо серифну пару
     й рендеримо всі заголовки тим самим системним sans-serif, що й решту інтерфейсу (і це ж відповідає
     Apple-inspired stack з її власного ТЗ, де serif ніде не згадувався). */
  --fd:var(--f);
}
[data-t="dark"]{
  --bg:#000000; --card:#1C1C1E; --soft:#2C2C2E;
  --ink:#F5F5F7; --ink2:#AEAEB2; --ink3:#8E8E93;
  --line:#3A3A3C; --acc:#0A84FF; --acc-soft:#152230;
  --ok:#30D158; --ok-soft:#13291A; --warn:#FF9F0A; --warn-soft:#332711; --bad:#FF453A;
  --missed-bg:#2A2140; --missed-fg:#C9A6F0;
  --sh:0 1px 2px rgba(0,0,0,.35), 0 16px 32px -16px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-style:normal!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;font-family:var(--fd)}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px 140px}

/* header */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.top-in{max-width:1360px;margin:0 auto;padding:16px 20px 12px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:600;font-family:var(--fd);letter-spacing:-.01em}
.sp{flex:1}
.rbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;height:42px;min-width:42px;padding:0 15px;cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;font-size:15px;transition:border-color .15s ease,color .15s ease}
.rbtn:hover{color:var(--ink);border-color:var(--ink3)}
.tabs{max-width:1360px;margin:0 auto;padding:2px 20px 14px;display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:transparent;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--ink2);white-space:nowrap;font-size:15px;position:relative;transition:color .15s ease,background .15s ease}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--acc);font-weight:600;background:var(--acc-soft)}
@media(max-width:760px){.tabs{display:none}}

/* bottom nav (mobile) */
.bnav{display:none}
@media(max-width:760px){
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;
   background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);
   padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav button{background:none;border:0;padding:8px 2px;cursor:pointer;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;border-radius:12px}
 .bnav button.on{color:var(--acc)}
 .bnav .e{font-size:21px;line-height:1}
 .wrap{padding-bottom:100px}
}

/* предупреждение о том, что запись на устройство не проходит: в потоке страницы, ничего не перекрывает */
.swarn:empty{display:none}
.swarn-in{max-width:1100px;margin:14px auto 0;padding:16px 20px;border-radius:var(--r2);
  background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.swarn-t{font-size:15.5px;font-weight:600;color:var(--ink)}
.swarn-s{font-size:13.5px;line-height:1.6;color:var(--ink2);margin-top:4px}
.swarn-in .btn{flex:none}
@media(max-width:760px){.swarn-in{margin:12px 14px 0}.swarn-in .btn{width:100%}}

/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:26px}
.card+.card{margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.h-sec{font-family:var(--fd);font-size:20px;font-weight:600;letter-spacing:-.01em;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.h-page{font-family:var(--fd);font-size:32px;font-weight:600;letter-spacing:-.02em;margin:6px 0 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sub{color:var(--ink2);font-size:15px}
.small{font-size:14px;color:var(--ink2)}
.num{font-size:15px;font-weight:600;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:12px}
.rowj{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wr{flex-wrap:wrap}
.bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .4s ease}
.bar.thin{height:6px}
/* max-width:100%+overflow-x:auto — на вузьких екранах 5 підвкладок («Тиждень…Мій шлях») не влазять в один
   ряд і раніше вилазили за межі картки, розтягуючи всю сторінку в горизонтальний скрол; тепер сегмент
   прокручується сам у себе, як .tabs вище, а сторінка більше не їде вбік */
.seg{display:inline-flex;gap:2px;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:16px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-size:14.5px;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:0 0 auto}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
/* ——— 12-тижневий блокнот: таби тижнів + ритм-таблиця ——— */
.nbtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.nbtabs::-webkit-scrollbar{display:none}
.nbtab{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:14.5px;font-weight:600;cursor:pointer;position:relative;transition:background .15s ease,color .15s ease}
.nbtab:hover{border-color:var(--ink3)}
.nbtab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.nbtab.cur::after{content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:5px;height:5px;border-radius:99px;background:var(--acc)}
.nbtab.on.cur::after{display:none}
.rtable-wrap{overflow-x:auto;margin:0 -10px;padding:0 10px}
/* width:auto (не 100%) — щоб 7 колонок днів не розтягувались на всю ширину картки, а трималися
   компактно біля своїх чекбоксів; зайве місце в рядку йде на розклад дня праворуч, а не на порожні
   проміжки між днями */
.rtable{border-collapse:collapse;width:auto;min-width:620px}
.rtable th{padding:2px 2px 6px;text-align:center}
/* заголовок дня — «сьогодні» позначено маленькою крапкою під числом */
.rdaylbl{display:block;width:100%;border-radius:10px;padding:5px 4px 7px;
 font:inherit;font-size:12px;color:var(--ink3);font-weight:500;line-height:1.3;position:relative}
.rdaylbl span{display:block;font-size:14.5px;color:var(--ink2);margin-top:1px}
.rdaylbl.cur{color:var(--acc)}
.rdaylbl.cur span{color:var(--acc)}
.rdaylbl.cur::after{content:"";position:absolute;left:50%;bottom:1px;transform:translateX(-50%);width:4px;height:4px;border-radius:99px;background:var(--acc)}
.rtable .rrow-h{position:sticky;left:0;background:var(--card);text-align:left;font-size:14.5px;padding:0 10px 0 0;white-space:nowrap;z-index:1;width:1%;height:44px}
/* justify-content:space-between так, щоб олівець завжди стояв у тій самій колонці незалежно від довжини
   назви звички — інакше «Правильне харчування» (найдовша назва) відсуває свій олівець далеко праворуч,
   і рядки виглядають «кривими» одне відносно одного */
.rrow-h-in{display:flex;align-items:center;justify-content:space-between;gap:10px;height:44px;width:100%}
.rrow-h-name{display:flex;align-items:center;gap:2px}
.ridea-toggle{font-size:13px;padding:4px 6px;transition:transform .15s ease}
.ridea-toggle.open{transform:rotate(180deg)}
tr.ridea-row td{padding:0 8px 10px;height:auto;text-align:left}
.ridea-list{background:var(--soft);border-radius:var(--r2);padding:10px 14px;margin:0 0 4px}
.ridea-item{font-size:13.5px;line-height:1.6;color:var(--ink2);padding:3px 0}
.ridea-item:not(:last-child){border-bottom:1px dashed var(--line)}
.rtable td{text-align:center;padding:3px 8px;height:44px}
.rtable td.rtoday{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.rcell{width:36px;height:36px;min-width:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink3);font-size:15px;cursor:pointer;transition:transform .15s ease}
.rcell:active{transform:scale(.92)}
.rcell.done{background:var(--completed,var(--acc));border-color:transparent;color:#fff;font-weight:700}
.rcell.missed{background:var(--missed-bg);border-color:transparent;color:var(--missed-fg)}
.rcell.none{background:var(--soft);border-color:transparent;color:var(--ink3)}
.rsum-h,.rsum{font-size:13px;color:var(--ink2);white-space:nowrap;padding:0 10px}
/* компактна смуга «12 тижнів» + week tabs в один рядок (desktop); на вузьких екранах підпис лишається зверху */
.nbbar{display:flex;align-items:center;gap:14px;margin:2px 0 16px;flex-wrap:wrap}
.nbbar-label{font-size:19px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.nbbar .nbtabs{margin:0;padding:3px 2px;flex:1;min-width:120px}
/* status-popover ритм-клітинки: явні 4 варіанти замість сліпого циклічного перемикання */
.rpop-ovl{position:fixed;inset:0;z-index:60;background:transparent}
.rpop{position:absolute;z-index:61;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:220px}
.rpop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:9px;padding:9px 10px;cursor:pointer;font-size:14.5px;color:var(--ink)}
.rpop button:hover,.rpop button:focus-visible{background:var(--soft);outline:none}
.rpop button.cur{font-weight:600}
.rpop .rpi{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.rpop .rpi.planned{background:var(--card);border:1.5px solid var(--line);color:var(--ink3)}
.rpop .rpi.done{background:var(--completed,var(--acc));color:#fff}
.rpop .rpi.missed{background:var(--missed-bg);color:var(--missed-fg)}
.rpop .rpi.none{background:var(--soft);color:var(--ink3)}
.rpop .rpt{flex:1;min-width:0}
.rpop .rps{display:block;font-size:12px;color:var(--ink3);margin-top:1px}
.rpop .rpmark{font-size:12px;color:var(--acc);flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;background:var(--soft);color:var(--ink2);font-size:13.5px;white-space:nowrap}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:13px 22px;cursor:pointer;font-size:15px;font-weight:500;transition:transform .15s ease,filter .15s ease}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.g{background:var(--soft);color:var(--ink)}
.btn.o{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.o:hover{color:var(--ink);background:var(--soft);border-color:var(--ink3)}
.btn.red{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.s{padding:10px 16px;font-size:14.5px;border-radius:999px}
.btn.wide{width:100%;justify-content:center;display:flex;align-items:center;gap:8px}
.big{font-family:var(--fd);font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.mid{font-family:var(--fd);font-size:23px;font-weight:600;letter-spacing:-.01em}
.hint{background:var(--soft);border-radius:var(--r2);padding:16px 18px;font-size:15px;line-height:1.55}
.hint.acc{background:var(--acc-soft)}
.hint.warn{background:var(--warn-soft)}
.hint.ok{background:var(--ok-soft)}
.emptyb{padding:30px;text-align:center;color:var(--ink3);background:var(--soft);border-radius:var(--r2);font-size:15px}
.divider{height:1px;background:var(--line);margin:18px 0}

/* forms */
label.f{display:block;margin-bottom:16px}
label.f>span{display:block;font-size:14.5px;color:var(--ink2);margin-bottom:7px}
input[type=text],input[type=number],input[type=date],select,textarea{
 width:100%;background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:var(--card)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.chk{appearance:none;width:26px;height:26px;min-width:26px;border:2px solid var(--line);border-radius:9px;cursor:pointer;position:relative;background:var(--card)}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.emo{display:flex;gap:8px;flex-wrap:wrap}
.emo button{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:21px;cursor:pointer}
.emo button.on{border-color:var(--acc);background:var(--acc-soft)}

/* goal cards — горизонтальна вітрина-полиця, а не сітка, що ламається на новий рядок.
   Праве поле збільшено, щоб наступна картка завжди трохи "виглядала" з-за краю —
   інакше користувачка не розуміє, що список можна прогорнути, і сприймає це як обрізання. */
.gwrap{display:flex;gap:18px;overflow-x:auto;padding:6px 56px 20px 4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.gwrap::-webkit-scrollbar{height:7px}
.gwrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.gwrap::-webkit-scrollbar-track{background:transparent}
.gcard{flex:0 0 auto;width:min(360px,80vw);scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:24px;display:flex;flex-direction:column;gap:16px;transition:transform .25s ease,box-shadow .25s ease}
@media(hover:hover){.gcard:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(40,32,20,.06),0 32px 56px -22px rgba(40,32,20,.3)}}
.gdots{display:flex;gap:6px;justify-content:center;margin-top:-8px}
.gdots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:background .2s ease,width .2s ease}
.gdots i.on{background:var(--acc);width:16px}
.ghead{display:flex;gap:14px;align-items:flex-start}
.gemo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:25px;flex:none}
/* метрика тепер займає два рядки: назва (може загортатись) зверху, шкала на всю ширину знизу —
   так довгі назви дій ніколи не "обрізаються" трьома крапками */
.mrow{padding:9px 0}
.mrow-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.mrow .mn{flex:1;min-width:0;font-size:15px;line-height:1.35}
.mrow .mv{font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;flex:none}
.mrow .mb{width:100px;flex:none}
@media(max-width:420px){.mrow .mb{width:64px}}

/* week */
.task{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.task.done{background:var(--soft);box-shadow:none;border-color:transparent}
.task .tb{flex:1;min-width:0}
.task .tt{font-size:16px;line-height:1.4}
.task.done .tt{color:var(--ink3);text-decoration:line-through}
.tmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.counter{display:flex;align-items:center;gap:12px;margin-top:12px}
.cbtn{width:42px;height:42px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font-size:21px;cursor:pointer;color:var(--ink);line-height:1}
.cbtn:active{background:var(--soft)}
.cval{font-size:17px;font-weight:600;min-width:74px;text-align:center}
.ico{background:none;border:0;cursor:pointer;color:var(--ink3);font-size:17px;padding:6px 8px;border-radius:10px}
.ico:hover{background:var(--soft);color:var(--ink)}

/* path matrix */
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
.mx th{font-weight:600;color:var(--ink2);padding:12px 8px;text-align:center;font-size:13.5px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.mx th.l{text-align:left;padding-left:4px}
.mx td{padding:8px;text-align:center;border-top:1px solid var(--line)}
.mx td.l{text-align:left;padding-left:4px}
.cell{width:100%;min-width:56px;border:0;background:var(--soft);border-radius:12px;padding:9px 4px;cursor:pointer;font-size:15px;color:var(--ink);line-height:1.25}
.cell:hover{background:var(--acc-soft);color:var(--acc)}
.cell .fx{display:block;font-size:13.5px;color:var(--ink3)}
.cell.cur{outline:2px solid var(--acc);outline-offset:-2px}
.mxwrap{overflow-x:auto;margin:0 -6px}
.mx-mob{display:none}
.mline{border-top:1px solid var(--line);padding:14px 0}
.mstrip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none}

function validateState(c){

 const allObj=a=>Array.isArray(a)&&a.every(x=>isObj(x));
 if(!isObj(c)) return {ok:false,error:"файл не похож на планер"};
 if(!Array.isArray(c.goals)) return {ok:false,error:"нет списка целей"};
 if(!allObj(c.goals)) return {ok:false,error:"в списке целей есть повреждённые записи"};
 if(!Array.isArray(c.journal)||!allObj(c.journal)) return {ok:false,error:"повреждён журнал событий"};
 if(!Array.isArray(c.months)||!allObj(c.months)) return {ok:false,error:"повреждён список месяцев"};
 if(!c.months.every(m=>typeof m.id==="string"&&m.id&&/^\d{4}-\d{2}-\d{2}$/.test(m.start||"")&&/^\d{4}-\d{2}-\d{2}$/.test(m.end||"")&&m.start<=m.end))
  return {ok:false,error:"у месяцев неверные даты"};
 if(!isObj(c.monthData)) return {ok:false,error:"повреждены данные месяцев"};
 if(!isObj(c.week)) return {ok:false,error:"повреждена текущая неделя"};
 if(!Array.isArray(c.week.tasks)||!allObj(c.week.tasks)) return {ok:false,error:"повреждены задачи недели"};
 if(!Array.isArray(c.weekArchive)||!allObj(c.weekArchive)) return {ok:false,error:"повреждён архив недель"};
 if(!isObj(c.monthReviews)) return {ok:false,error:"повреждены итоги месяцев"};
 if(!Array.isArray(c.hyps)||!allObj(c.hyps)) return {ok:false,error:"повреждён список гипотез"};
 if(!isObj(c.period)||!c.period.start||!c.period.end) return {ok:false,error:"не задан период"};
 for(const g of c.goals){
  if(!Array.isArray(g.metrics)||!allObj(g.metrics)) return {ok:false,error:`повреждены метрики цели «${g.name||g.id||"без имени"}»`};
  if(!Array.isArray(g.results)||!allObj(g.results)) return {ok:false,error:`повреждены показатели цели «${g.name||g.id||"без имени"}»`};

 }
 return {ok:true};
}

async function ghContent(c){

 const mo=D(m.start).getMonth();
 return MPREP[mo]||m.label;
}
function buildMonths(start,end){
 const MSHORT=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
 const MFULL=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
 const out=[]; let cur=start, i=0;
 while(cur<=end&&i<120){
  const d=D(cur), y=d.getFullYear(), mo=d.getMonth();
  const monthEnd=iso(new Date(y,mo+1,0));            // последний день этого календарного месяца
  const last=monthEnd>end?end:monthEnd;
  const partial=(d.getDate()!==1)||(last!==monthEnd);
  out.push({id:"m_"+y+String(mo+1).padStart(2,"0"),
   label:partial?`${+cur.split("-")[2]}–${+last.split("-")[2]} ${MGEN[mo]} ${y}`:`${MFULL[mo]} ${y}`,
   short:MSHORT[mo],start:cur,end:last});
  cur=addDays(last,1); i++;
 }
 return out;
}
/* что произойдёт при смене периода: какие месяцы выпадают, сколько планов и фактов затронуто */
function periodImpact(newStart,newEnd){
 const fresh=buildMonths(newStart,newEnd);
 const lost=[]; let lostPlan=0;
 S.months.forEach(om=>{
  const keep=fresh.some(x=>om.start>=x.start&&om.start<=x.end)||fresh.some(x=>x.start>=om.start&&x.start<=om.end);
  if(keep) return;
  let pl=0; S.goals.forEach(g=>g.metrics.forEach(m=>pl+=Number(m.plan[om.id])||0));
  const steps=(S.monthData[om.id]||{steps:[]}).steps.length;
  lost.push({label:om.label,plan:pl,steps}); lostPlan+=pl;
 });
 const outside=S.journal.filter(e=>e.kind==="fact"&&!e.cancelled&&!(e.date>=newStart&&e.date<=newEnd));
 const outQty=outside.reduce((n,e)=>n+(Number(e.qty)||0),0);
 return {fresh,lost,lostPlan,outside:outside.length,outQty};
}
/* перестройка месяцев с сохранением планов: план переносится в месяц, который содержит старую дату старта */
function rebuildMonths(newStart,newEnd){
 const oldMonths=S.months.slice();
 const fresh=buildMonths(newStart,newEnd);
 const map={};
 oldMonths.forEach(om=>{ const nm=fresh.find(x=>om.start>=x.start&&om.start<=x.end)||fresh.find(x=>x.start>=om.start&&x.start<=om.end); if(nm) map[om.id]=nm.id; });
 const newData={};
 fresh.forEach(m=>newData[m.id]={theme:"",outcome:"",review:"",steps:[]});
 oldMonths.forEach(om=>{ const to=map[om.id]; const od=S.monthData[om.id]; if(!to||!od) return;
  const nd=newData[to];
  nd.theme=nd.theme||od.theme; nd.outcome=nd.outcome||od.outcome; nd.review=nd.review||od.review;
  nd.steps=nd.steps.concat(od.steps||[]); });
 S.goals.forEach(g=>g.metrics.forEach(m=>{
  const np={}; fresh.forEach(x=>np[x.id]=0);
  oldMonths.forEach(om=>{ const to=map[om.id]; if(to) np[to]=(np[to]||0)+(Number(m.plan[om.id])||0); });
  m.plan=np; }));
 S.journal.forEach(e=>{ const byDate=fresh.find(x=>e.date>=x.start&&e.date<=x.end);
  e.monthId = byDate ? byDate.id : (map[e.monthId] && fresh.some(x=>x.id===map[e.monthId]) && !e.date ? map[e.monthId] : ""); }); jTouch();
 Object.keys(S.monthReviews||{}).forEach(k=>{ if(map[k]&&map[k]!==k){ S.monthReviews[map[k]]=S.monthReviews[k]; delete S.monthReviews[k]; } });
 S.months=fresh; S.monthData=newData;
 S.period={start:newStart,end:newEnd};
 jTouch();
 if(map[S.lastSeenMonth]) S.lastSeenMonth=map[S.lastSeenMonth];
 if(!S.months.some(m=>m.id===S.lastSeenMonth)) S.lastSeenMonth=curMonthId();
 S.monthQueue=(S.monthQueue||[]).map(x=>map[x]||x).filter(x=>S.months.some(m=>m.id===x));
 S.monthPending=map[S.monthPending]||"";
}
function monthMeta(id){ return S.months.find(m=>m.id===(id||curMonthId())); }
function daysLeftInMonth(){ const m=monthMeta(); return Math.max(0,daysBetween(today(),m.end)+1); }
function weeksLeftInMonth(){ return Math.max(1,daysLeftInMonth()/7); }
function weeksInMonth(id){ const m=monthMeta(id); return Math.max(1,(daysBetween(m.start,m.end)+1)/7); }
/* обычный недельный темп по метрике в текущем месяце */
function weekPace(m,mid){ mid=mid||curMonthId(); return (Number(m.plan[mid])||0)/weeksInMonth(mid); }
const leftInMonth=(m,mid)=>Math.max(0,(Number(m.plan[mid])||0)-fMonth(m,mid));
/* сколько предложить на неделю: без «долга», не выше ~125% обычного темпа */
function suggestQty(m,mid,catchUp){
 mid=mid||curMonthId();
 const left=leftInMonth(m,mid);
 if(left<=0) return 0;
 const even=Math.ceil(left/weeksLeftInMonth());
 const pace=weekPace(m,mid);
 if(catchUp) return even;
 const cap=Math.max(1,Math.round(pace*1.25));
 return Math.max(1,Math.min(even,cap));
}
/* план месяца стал нереалистичным? */
function monthStrain(){
 const mid=curMonthId(); const hard=[];
 S.goals.filter(g=>g.status==="active").forEach(g=>g.metrics.forEach(m=>{
  const left=leftInMonth(m,mid);
  if(left<=0) return;
  const even=left/weeksLeftInMonth(), pace=weekPace(m,mid);
  if(pace>0&&even>pace*1.4) hard.push({g,m,even:Math.ceil(even),pace:Math.round(pace*10)/10,left});
 }));
 return hard;
}
/* сколько предложить по регулярной метрике: базовый ритм, без долга */
const metricPlanned=m=>S.months.some(x=>(Number(m.plan[x.id])||0)>0);
function regularQty(m,mid,catchUp){
 mid=mid||curMonthId();
 const base=Math.max(1,Number(m.perWeek)||1);
 const plan=Number(m.plan[mid])||0, left=leftInMonth(m,mid);
 if(plan<=0) return metricPlanned(m)?-1:base;   // −1: в этом месяце метрика не запланирована
 if(left<=0) return 0;                           // план месяца закрыт — объём не выдумываем
 let q=Math.min(base,left);                      // остаток меньше ритма — берём остаток
 if(catchUp) q=Math.max(q,Math.min(Math.ceil(left/weeksLeftInMonth()),Math.round(base*1.5)));
 return q;
}
/* предложение плана недели: регулярное + месячный план + шаги.
   Ограничения: не больше LIMITS.plan позиций из месячного плана и LIMITS.step шагов,
   чтобы автоматика не создавала перегруз. */
const LIMITS={plan:3,step:2,week:9};
function suggestWeek(catchUp,easy){
 if(periodState()!=="active") return [];
 const mid=curMonthId(), reg=[], planned=[], steps=[];
 const act=S.goals.filter(g=>g.status==="active");
 act.forEach(g=>g.metrics.forEach(m=>{
  const pl=Number(m.plan[mid])||0, left=leftInMonth(m,mid);
  const base={goalId:g.id,metricId:m.id,emoji:m.emoji||g.emoji,title:m.name,unit:m.unit||"",
   goalName:g.name,gemoji:g.emoji,left,prio:g.priority,
   kind:(m.valueType==="volume"?"volume":"count"),source:{kind:"metric",id:m.id,goalId:g.id}};
  if(m.regular){
   let q=regularQty(m,mid,catchUp);
   if(easy&&q>0&&Number(m.easyWeek)>0) q=Math.min(q,Number(m.easyWeek));
   if(q>0) reg.push({...base,group:"reg",planned:q,per:Math.max(1,Number(m.perWeek)||1),easyWeek:m.easyWeek||0});
   else if(q===0) reg.push({...base,group:"reg",planned:0,per:Math.max(1,Number(m.perWeek)||1),full:true});
  }else{
   const q=suggestQty(m,mid,catchUp);
   if(q>0) planned.push({...base,group:"plan",planned:q});
  }
 }));
 /* ближайшие этапы проектов — те, что ещё не взяты в работу */
 act.filter(g=>g.type==="project").forEach(g=>{
  g.milestones.filter(ms=>!ms.done&&!isDeclined("milestone",ms.id)&&!sourceBusy("milestone",ms.id)&&!sourceDone("milestone",ms.id)).slice(0,2)
   .forEach(ms=>steps.push({goalId:g.id,metricId:"",emoji:"✅",title:ms.title,goalName:g.name,gemoji:g.emoji,
    planned:1,kind:"binary",group:"step",prio:g.priority,imp:true,source:{kind:"milestone",id:ms.id,goalId:g.id}}));
 });
 /* невыполненные пункты плана месяца — тоже без повторов */
 (S.monthData[mid]?S.monthData[mid].steps:[]).filter(x=>!x.done&&!isDeclined("monthStep",x.id)&&!sourceBusy("monthStep",x.id)&&!sourceDone("monthStep",x.id)).forEach(x=>{
  const g=goalOf(x.goalId);
  if(g&&g.status!=="active") return;                 // цель на паузе или завершена — пункт не предлагаем
  steps.push({goalId:x.goalId,metricId:"",emoji:x.challenge?"🔥":"📝",title:x.title,goalName:g?g.name:"",gemoji:g?g.emoji:"📝",
   planned:1,kind:"binary",group:"step",prio:g?g.priority:1,imp:x.imp,challenge:x.challenge,
   source:{kind:"monthStep",id:x.id,monthId:mid,goalId:x.goalId}});
 });
 planned.sort((a,b)=>(b.prio-a.prio)||(b.left-a.left));
 steps.sort((a,b)=>((b.challenge?1:0)-(a.challenge?1:0))||(b.prio-a.prio));
 /* отмечаем галочкой только разумный минимум */
 reg.forEach(x=>x.pick=!x.full);
 planned.forEach((x,i)=>x.pick=i<(easy?1:LIMITS.plan));
 steps.forEach((x,i)=>x.pick=i<(easy?1:LIMITS.step));
 const all=reg.concat(planned,steps);
 /* общий потолок: сначала снимаем шаги, потом позиции месячного плана */
 const cap=easy?5:8;
 let picked=all.filter(x=>x.pick).length;
 for(let i=steps.length-1;i>=0&&picked>cap;i--){ if(steps[i].pick){steps[i].pick=false;picked--;} }
 for(let i=planned.length-1;i>=0&&picked>cap;i--){ if(planned[i].pick){planned[i].pick=false;picked--;} }
 return all;
}
/* проверка календаря при открытии */
function checkPeriods(){
 const st=periodState();
 const cm=curMonthId();
 S.monthQueue=S.monthQueue||[];
 if(!S.lastSeenMonth) S.lastSeenMonth=cm;
 else if(S.lastSeenMonth!==cm){
  const from=S.months.findIndex(m=>m.id===S.lastSeenMonth), to=S.months.findIndex(m=>m.id===cm);
  if(from>=0&&to>from){ for(let i=from;i<to;i++){ const id=S.months[i].id;
    const rv=S.monthReviews[id];
    if(rv&&(rv.status==="done"||rv.status==="skipped")) continue;
    if(!S.monthQueue.includes(id)) S.monthQueue.push(id); } }
  else if(from<0) S.lastSeenMonth=cm;
 }
 /* период закончился — последний месяц тоже нужно разобрать: он не сменится на следующий */
 if(st==="finished"&&S.months.length){
  const last=S.months[S.months.length-1].id, rv=S.monthReviews[last];
  if(!(rv&&(rv.status==="done"||rv.status==="skipped"))&&!S.monthQueue.includes(last)) S.monthQueue.push(last);
 }
 S.monthQueue=S.monthQueue.filter(id=>{ const rv=S.monthReviews[id]; return !(rv&&(rv.status==="done"||rv.status==="skipped")); });
 S.monthPending=S.monthQueue[0]||"";
 const nowW=mondayOf(today()), myW=mondayOf(S.week.start||today());
 S.newWeekPending = (st==="active") && nowW!==myW;
 S.missedWeeks = (st==="active"&&nowW>myW) ? Math.max(0,Math.round(daysBetween(myW,nowW)/7)-1) : 0;
}

/* сколько действий человек реально довёл до конца: задача недели = одно действие, каким бы ни был объём */
function completedActionCount(){
 const ids=new Set();
 (S.week.tasks||[]).forEach(t=>{ if(t&&t.done&&t.id) ids.add(t.id); });
 (S.weekArchive||[]).forEach(w=>(w.tasks||[]).forEach(t=>{ if(t&&t.done&&t.id) ids.add(t.id); }));
 /* ручные записи «Записать сделанное» — по одному действию за запись, независимо от количества */
 const manual=new Set();
 (S.journal||[]).forEach(e=>{
  if(!e||e.cancelled) return;
  if(e.kind==="result") return;                       // измерения результата — не действия
  if(e.sourceType!=="manual") return;                 // факты задач уже посчитаны по самим задачам
  if(e.id) manual.add(e.id);
 });
 return ids.size+manual.size;
}

 A.push({id:"lv5",e:"⭐",n:"П'ятий рівень",d:"Пройдено п'ять рівнів",on:S.xp>=500});
 A.push({id:"gh",e:"🧪",n:"Дослідниця",d:"3 гіпотези з висновком",on:S.hyps.filter(h=>h.conclusion).length>=3});
 A.push({id:"rev",e:"💭",n:"Ритм розборів",d:"4 тижневих підсумки",on:S.weekReviews.length>=4});
 S.goals.filter(g=>g.status!=="paused").forEach(g=>{
  A.push({id:"half_"+g.id,e:"✨",n:`Половина цілі: ${g.name}`,d:"50% результату",on:resultPct(g)>=50});
  A.push({id:"done_"+g.id,e:"🏆",n:`Ціль досягнуто: ${g.name}`,d:"100% результату",on:g.status==="done"||resultPct(g)>=100});
  g.metrics.forEach(m=>{
   const f=mFact(m), tot=Number(m.total)||0;
   if(m.valueType==="volume"){
    /* обсяг: пороги у штуках безглузді — рахуємо частку власного плану */
    if(tot>0){

     A.push({id:"mv25_"+m.id,e:"🌱",n:`25% плану: ${m.name}`,d:g.name,on:pct>=25});
     A.push({id:"mv50_"+m.id,e:"✨",n:`Половина плану: ${m.name}`,d:g.name,on:pct>=50});
     A.push({id:"mv100_"+m.id,e:"🏆",n:`План виконано: ${m.name}`,d:g.name,on:pct>=100});
    }
   }else{
    [10,25,50].forEach(k=>{ if(tot>=k) A.push({id:`m${k}_`+m.id,e:m.emoji||"✅",n:`${k} · ${m.name.toLowerCase()}`,d:g.name,on:f>=k}); });
   }
  });
 });
 return A;

/* 5 розділів верхнього рівня замість 9: споріднені екрани згруповані, перемикаються сегментним контролом усередині сторінки */
/* за явним запитом користувачки глобальна навігація звужена до 3 пунктів: 12 тижнів / Цілі / Прогрес.
   «Сьогодні» і старий «Тиждень»-візард більше не є окремими вкладками — їхній функціонал переїхав
   у сторінку «12 тижнів» (системні картки-нагадування) або лишився доступним по прямому посиланню
   (керування завданнями тижня). «Мій шлях» (місячна матриця метрик) переїхав під-вкладкою в «Прогрес» —
   дані нікуди не зникли, просто більше не займає окремий глобальний таб. */
const NAVG=[
 {k:"notebook",e:"📓",l:"12 тижнів",tabs:["notebook"]},
 {k:"goals",e:"🎯",l:"Цілі",tabs:["goals"]},
 {k:"progress",e:"🔎",l:"Прогрес",tabs:["wrev","mrev","hyp","hist","path"]}
];
/* реальна довжина періоду замість зашитого «90 днів» — цикл може бути будь-якої довжини */
function periodLenLabel(){ const d=daysBetween(S.period.start,S.period.end)+1; return `${d} дн. циклу`; }
const SUBLBL={week:"Тиждень",wrev:"Тиждень",mrev:"Місяць",hyp:"Гіпотези",hist:"Історія",path:"Мій шлях"};
function groupOf(tab){ return NAVG.find(g=>g.tabs.includes(tab))||NAVG[0]; }
function renderNav(){
 const cur=groupOf(TAB).k;
 const html=NAVG.map(g=>`<button class="${cur===g.k?"on":""}" data-nav="${g.k}"><span class="e">${g.e}</span> ${g.l}</button>`).join("");
 $("#tabs").innerHTML=html;
 $("#bnav").innerHTML=NAVG.map(g=>`<button class="${cur===g.k?"on":""}" data-nav="${g.k}"><span class="e">${g.e}</span>${g.l}</button>`).join("");
 document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{
  const g=NAVG.find(x=>x.k===b.dataset.nav);
  /* важливо: перевіряємо, чи TAB справді входить у tabs цієї групи, а не покладаємось на groupOf() —
     для «сирітських» табів (напр. «week», куди веде посилання «Керувати завданнями тижня», але яких
     більше немає в жодній групі NAVG) groupOf() підставляє групу-заглушку notebook, і порівняння ключів
     групи хибно вважало б, що ми «вже тут», через що клік по пілюлі нічого не робив і застрягав */
  TAB=g.tabs.includes(TAB)?TAB:g.tabs[0];
  render(); window.scrollTo({top:0});
 });
}

/* спокійний спарклайн: тренд, а не аналітика */
function sparkHTML(vals,color,rule){
 if(!vals||vals.length<2) return "";
 const w=110,h=28,mn=Math.min(...vals),mx=Math.max(...vals),d=(mx-mn)||1;
 const pts=vals.map((v,i)=>[6+i*((w-12)/(vals.length-1)),h-4-((v-mn)/d)*(h-10)]);
 const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
 const last=pts[pts.length-1];
 return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
  <path d="${path}" fill="none" stroke="${color||"var(--acc)"}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>
  <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${color||"var(--acc)"}"/></svg>`;
}
function rTrendHTML(g,rm,color){

 let vals=[];
 if(rm.type==="current_state") vals=e.map(x=>Number(x.value));
 else vals=rBuckets(rm).map(b=>rBucketValue(rm,b)).filter(v=>v!=null);
 return sparkHTML(vals.slice(-8),color,rm.successRule);

function rDeltaHTML(rm){

 });

 const body=rows.map(({g,m})=>{
  const s=sphereOf(g.sphereId);
  return `<tr>
   <td class="l"><div style="font-size:15px">${m.emoji||"✅"} ${esc(m.name)}</div>
     <div class="small" style="color:${s.color}">${g.emoji} ${esc(g.name)}</div></td>
   <td><button class="cell" data-a="mtotal" data-g="${g.id}" data-m="${m.id}" ${mPlanSum(m)!==m.total?`title="По місяцях розподілено ${aFmt(mPlanSum(m),m.unit)}"`:""}>${aFmt(m.total,m.unit)}${mPlanSum(m)!==m.total?" ⚠️":""}<span class="fx">${aFmt(mFact(m),m.unit)} факт</span></button></td>
   ${S.months.map(x=>`<td><button class="cell ${x.id===cm?"cur":""}" data-a="cell" data-g="${g.id}" data-m="${m.id}" data-mo="${x.id}">${aFmt(m.plan[x.id]||0,m.unit)}<span class="fx">${aFmt(fMonth(m,x.id),m.unit)}</span></button></td>`).join("")}
  </tr>`;
 }).join("");
 const proj=S.goals.filter(g=>g.type==="project");
 /* завершені місяці в цю сітку не виводимо — вони більше не потребують уваги тут, підсумок по них є в «Підсумках місяця» */
 const mcards=S.months.filter(x=>x.id===cm||today()<=x.end).map(x=>{

 }).join("");
 return `

 ${(function(){const out=S.journal.filter(e=>e.kind==="fact"&&!e.cancelled&&!e.monthId);
  if(!out.length) return "";
  const q=out.reduce((n,e)=>n+(Number(e.qty)||0),0);

 ${(function(){const bad=[];S.goals.forEach(g=>g.metrics.forEach(m=>{if(m.total&&mPlanSum(m)!==m.total)bad.push(`${m.emoji||"✅"} ${esc(m.name)}: по місяцях ${aFmt(mPlanSum(m),m.unit)} з ${aFmt(m.total,m.unit)}`);}));

  <div class="mx-desk"><div class="mxwrap"><table class="mx">${head}${body||`<tr><td colspan="9"><div class="emptyb">Додай метрики в цілях, і вони з'являться тут</div></td></tr>`}</table></div></div>
  <div class="mx-mob">${rows.length?rows.map(({g,m})=>{
    const sp=sphereOf(g.sphereId);

     <div class="small" style="color:${sp.color};margin-top:2px">${g.emoji} ${esc(g.name)}</div>
     <div class="mstrip">${S.months.map(x=>`<button class="mcell ${x.id===cm?"cur":""}" data-a="cell" data-g="${g.id}" data-m="${m.id}" data-mo="${x.id}">
       <div class="mo">${esc(x.short)}</div><div class="pf">${aFmt(fMonth(m,x.id),m.unit)} / ${aFmt(m.plan[x.id]||0,m.unit)}</div></button>`).join("")}</div>
    </div>`;}).join(""):`<div class="emptyb">Додай метрики в цілях, і вони з'являться тут</div>`}</div>
 </div>
 ${proj.length?`<div class="card">
   <div class="h-sec">✅ Проєкти за етапами</div>
   ${proj.map(g=>`<div style="margin-bottom:16px">
     <div class="rowj"><span style="font-size:16px">${g.emoji} ${esc(g.name)}</span><span class="num">${g.milestones.filter(x=>x.done).length} / ${g.milestones.length}</span></div>
     <div style="margin-top:9px">${barHTML(resultPct(g),sphereOf(g.sphereId).color)}</div>
     <div style="margin-top:10px">${g.milestones.map(ms=>`<div class="rowj" style="padding:6px 0"><span style="font-size:15px;color:${ms.done?"var(--ink3)":"var(--ink)"}">${ms.done?"✅":"⬜"} ${esc(ms.title)}${isDeclined("milestone",ms.id)?` <span class="small">відкладено</span>`:""}</span>
       <span class="row" style="gap:4px">${isDeclined("milestone",ms.id)?`<button class="ico" data-a="msback" data-id="${g.id}" data-ms="${ms.id}" title="Повернути в планування">↩︎</button>`:""}<button class="ico" data-a="mstoggle" data-id="${g.id}" data-ms="${ms.id}">${ms.done?"↩":"✓"}</button></span></div>`).join("")}</div>
   </div>`).join("")}
  </div>`:""}
 <div class="card">

  <div class="mcards">${mcards}</div>
 </div>
 <div class="card">
  <div class="h-sec">🕰 Про навантаження</div>
  <div class="sub" style="white-space:pre-line">${esc(S.workNote)}</div>
  <button class="btn o s" style="margin-top:14px" data-a="editwork">Змінити</button>
 </div>`;
}

function vGoals(){

     const pr=primaryResult(g), others=act.filter(r=>r!==pr);

       <div class="small">${pr.emoji} ${esc(rLabel(g,pr))}</div>

       ${rDeltaBlock(pr)}
       ${(function(){const sp=rTrendHTML(g,pr,s.color); return sp?`<div style="margin-top:10px">${sp}</div>`:"";})()}
       <div class="small" style="margin-top:8px">${esc(rLastCheck(pr))}</div>
     </div>`;
     const rest=others.length?`<div style="padding:10px 0;border-top:1px solid var(--line)">
       <div class="small" style="margin-bottom:4px">Додаткові показники</div>
       ${others.map(r=>{const c2=rCurrent(r);
         return `<div class="rowj" style="padding:5px 0"><span style="font-size:15px">${r.emoji} ${esc(rLabel(g,r))}</span>

      ${g.type!=="count"?`<span class="small">${ap}% плану дій</span>`:""}</div>
     ${g.metrics.map(m=>{const f=mFact(m),p=m.total?clamp(Math.round(f/m.total*100),0,100):0;

         <span class="mv">${aFmt(f,m.unit)} / ${aFmt(m.total,m.unit)}</span></div>
        ${barHTML(p,s.color,true)}</div>`;}).join("")}

   ${g.type==="project"&&!g.milestones.length?`<div class="hint">Етапи ще не додані — саме за ними рахується прогрес проєкту.

     <div class="small" style="margin-bottom:4px">Етапи</div>
     ${g.milestones.map(ms=>`<div class="rowj" style="padding:5px 0"><span style="font-size:15px;color:${ms.done?"var(--ink3)":"var(--ink)"}">${ms.done?"✅":"⬜"} ${esc(ms.title)}${isDeclined("milestone",ms.id)?` <span class="small">відкладено</span>`:""}</span>

   ${goalOverdue(g)?`<div class="hint warn">⏰ Термін цілі минув ${dfull(g.deadline)}. Підведи підсумок і виріши, що далі — продовжити, чи закрити ціль.
     <div class="gdeadline-actions">

      <button class="btn o s" data-a="gpause" data-id="${g.id}">⏸ На паузу</button>
     </div></div>`:goalDeadlineSoon(g)?`<div class="hint">🗓 Термін добігає кінця — ${dfull(g.deadline)}. Можна вже зараз продовжити або підвести підсумок.
     <div class="gdeadline-actions">
      <button class="btn o s" data-a="gextend" data-id="${g.id}" data-n="1">➕ Продовжити на місяць</button>
      <button class="btn o s" data-a="gfinish" data-id="${g.id}">🏆 Завершити ціль</button>
     </div></div>`:""}
   ${g.status!=="active"?`<div class="row wr" style="gap:8px;align-items:center">
     <span class="pill">${g.status==="done"?"🏆 завершена":"⏸ на паузі"}</span>

     ${g.status==="done"?`<button class="btn o s" data-a="gextend" data-id="${g.id}" data-n="1">➕ Продовжити ще на місяць</button>`:""}

   <div class="row wr" style="gap:8px">

    <button class="btn o s" data-a="gaction" data-id="${g.id}">➕ Дія</button>
   </div>
   <details class="dd"><summary>Детальніше<span>▾</span></summary><div>
    <div class="row wr" style="gap:8px;margin-bottom:12px">
     <button class="btn o s" data-a="gres" data-id="${g.id}">⚡ Скоригувати факт дій</button>

 return `<div class="h-page">🎯 Цілі <span class="pill">${S.goals.filter(g=>g.status==="active").length} активних</span></div>

/* ═══════════ выполнение недели и месяца: единый расчёт ═══════════ */
/* каждая задача — отдельное обязательство; разные единицы никогда не складываются */
function taskCompletion(t){
 if(!t) return null;
 if(t.type==="binary") return t.done?100:0;
 const p=Number(t.planned)||0; if(!(p>0)) return null;
 return Math.min(100,(Number(t.completed)||0)/p*100);
}
function weekCompletion(tasks){
 const v=(tasks||[]).map(taskCompletion).filter(x=>x!=null);
 return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0;
}
function weekGoalCompletion(tasks,goalId){
 return weekCompletion((tasks||[]).filter(t=>(t.goalId||"none")===(goalId||"none")));
}
/* понятная сводка недели для записи в итоги: проценты и счёт задач, без сложения разных единиц */
function weekSummary(tasks){
 const c=weekTaskCounts(tasks);
 return {completionPct:weekCompletion(tasks),tasksTotal:c.total,tasksDone:c.full,tasksPartial:c.part};
}
/* сколько задач закрыто целиком и сколько частично */
function weekTaskCounts(tasks){
 const list=(tasks||[]).filter(t=>taskCompletion(t)!=null);
 const full=list.filter(t=>taskCompletion(t)>=100).length;
 const part=list.filter(t=>{const c=taskCompletion(t);return c>0&&c<100;}).length;
 return {full,part,total:list.length};
}
/* выполнение плана действий за конкретный месяц — среднее процентов по метрикам */
function monthActionPct(g,mid){
 const v=[];
 (g.metrics||[]).forEach(m=>{const p=Number((m.plan||{})[mid])||0; if(p>0) v.push(Math.min(100,fMonth(m,mid)/p*100));});
 return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;
}

/* ═══════════ status-popover ритм-клітинки ═══════════
   Клік по клітинці ритм-таблиці більше не перемикає стан по колу — відкриває невеликий anchored
   popover із чотирма явними варіантами (Заплановано/Виконано/Не виконано/Не заплановано), як просить
   останній промпт (розділ 0.5). Повторний клік по клітинці знову відкриває меню, а не перемикає наосліп. */
let rpopKeyHandler=null;
function closeCellPopover(){
 const o=document.getElementById("rpopRoot"); if(o) o.remove();
 if(rpopKeyHandler){ document.removeEventListener("keydown",rpopKeyHandler,true); rpopKeyHandler=null; }
}
function openCellPopover(triggerEl,hid,dateStr){
 closeCellPopover();
 const h=(S.habits||[]).find(x=>x.id===hid); if(!h) return;
 const cur=cellState(h,dateStr);
 const OPTS=[
  {k:"planned",icon:"",label:"Заплановано",sub:"Ще попереду, не позначено"},
  {k:"done",icon:"✓",label:"Виконано",sub:"Зараховано в підсумок тижня"},
  {k:"missed",icon:"×",label:"Не виконано",sub:"Планувалось, але не зроблено"},
  {k:"none",icon:"–",label:"Не заплановано",sub:"Не враховується в підсумку"}
 ];
 const rect=triggerEl.getBoundingClientRect();
 const root=document.createElement("div");
 root.id="rpopRoot";
 root.innerHTML=`<div class="rpop-ovl" id="rpopOvl"></div>
  <div class="rpop" id="rpopBody" role="menu" aria-label="Статус: ${esc(h.name)}, ${esc(dowOf(dateStr))} ${esc(dfmt(dateStr))}">
   ${OPTS.map(o=>`<button type="button" role="menuitemradio" aria-checked="${o.k===cur}" class="${o.k===cur?"cur":""}" data-k="${o.k}">
     <span class="rpi ${o.k}">${o.icon}</span><span class="rpt">${o.label}<span class="rps">${esc(o.sub)}</span></span>${o.k===cur?'<span class="rpmark">✓</span>':""}
    </button>`).join("")}
  </div>`;
 document.body.appendChild(root);
 const pop=root.querySelector("#rpopBody");
 const pw=pop.offsetWidth||220, ph=pop.offsetHeight||190;
 let top=rect.bottom+window.scrollY+6, left=rect.left+window.scrollX;
 if(top-window.scrollY+ph>window.innerHeight) top=rect.top+window.scrollY-ph-6;
 if(left-window.scrollX+pw>window.innerWidth-8) left=window.scrollX+window.innerWidth-pw-8;
 if(left<window.scrollX+8) left=window.scrollX+8;
 pop.style.top=top+"px"; pop.style.left=left+"px";
 const btns=Array.from(pop.querySelectorAll("button[data-k]"));
 btns.forEach(b=>{ b.onclick=()=>{ setCellState(hid,dateStr,b.dataset.k); closeCellPopover(); triggerEl.focus(); commit(); }; });
 root.querySelector("#rpopOvl").onclick=()=>{ closeCellPopover(); };
 const curIdx=Math.max(0,btns.findIndex(b=>b.dataset.k===cur));
 (btns[curIdx]||btns[0]).focus();
 rpopKeyHandler=(e)=>{
  if(e.key==="Escape"){ e.preventDefault(); closeCellPopover(); triggerEl.focus(); return; }
  const i=btns.indexOf(document.activeElement);
  if(e.key==="ArrowDown"){ e.preventDefault(); btns[(i+1+btns.length)%btns.length].focus(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); btns[(i-1+btns.length)%btns.length].focus(); }
 };
 document.addEventListener("keydown",rpopKeyHandler,true);
}

/* ═══════════ привязка ═══════════ */
function bind(root){
 if(!root) return;
 root.querySelectorAll("[data-a]").forEach(el=>{
  if(el.type==="checkbox") el.onchange=()=>act(el.dataset.a,el);
  else el.onclick=e=>{e.stopPropagation();act(el.dataset.a,el);};
 });
 const ms=root.querySelector("#msel"); if(ms) ms.onchange=()=>{MSEL=ms.value;render();};
 root.querySelectorAll(".emo button").forEach(b=>b.onclick=()=>{
  b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
 });
 /* дот-індикатор під каруселлю цілей — щоб було видно, що праворуч є ще картки */
 const ggwrap=root.querySelector("#ggwrap");
 if(ggwrap){
  const dots=root.querySelectorAll("#ggdots i");
  if(dots.length){
   const upd=()=>{
    const cards=ggwrap.querySelectorAll(".gcard");
    if(!cards.length) return;
    const step=cards[1]?cards[1].offsetLeft-cards[0].offsetLeft:cards[0].offsetWidth;
    const idx=Math.max(0,Math.min(dots.length-1,Math.round(ggwrap.scrollLeft/(step||1))));
    dots.forEach((d,i)=>d.classList.toggle("on",i===idx));
   };
   ggwrap.onscroll=upd; upd();
  }
 }
}

function collectWeek(sug){

   carried.push({...t,id:uid(),done:false,doneLevel:"",completed:0,planned:left,xpGiven:false,carried:(t.carried||0)+1});
  }

/* все JSON-объекты верхнего уровня из текста: учитываем вложенность, строки и экранирование */
function scanJSONObjects(text){
 const out=[], t=String(text||"");
 for(let i=0;i<t.length;i++){
  if(t[i]!=="{") continue;
  let depth=0, inStr=false, esc=false;
  for(let j=i;j<t.length;j++){
   const c=t[j];
   if(inStr){ if(esc) esc=false; else if(c==="\\") esc=true; else if(c==='"') inStr=false; continue; }
   if(c==='"'){ inStr=true; continue; }
   if(c==="{") depth++;
   else if(c==="}"){ depth--;
    if(depth===0){ const chunk=t.slice(i,j+1);
     try{ const o=JSON.parse(chunk); if(o&&typeof o==="object") out.push(o); }catch(e){}
     i=j; break; } }
  }
 }
 return out;
}
/* можно вставлять весь ответ модели: ищем нужный пакет среди всех блоков и объектов */
function extractJSON(txt,expectedType){
 if(!txt) return null;
 const t=String(txt);
 const cand=[];
 /* сначала блоки в тройных кавычках, затем весь текст целиком */
 const fences=t.match(/```[a-zA-Z]*\s*[\s\S]*?```/g)||[];
 fences.forEach(f=>{ const body=f.replace(/^```[a-zA-Z]*\s*/,"").replace(/```$/,"");
  try{ const o=JSON.parse(body.trim()); if(o&&typeof o==="object") cand.push(o); }catch(e){}
  scanJSONObjects(body).forEach(o=>cand.push(o));
 });
 scanJSONObjects(t.replace(/```[a-zA-Z]*\s*[\s\S]*?```/g,"")).forEach(o=>cand.push(o));
 if(!expectedType) return cand[0]||null;
 const hit=cand.find(o=>o&&o.type===expectedType);
 if(hit) return hit;
 const other=cand.find(o=>o&&typeof o.type==="string"&&o.type!==expectedType);
 return other?{__wrongType:other.type}:null;
}

 const m=g&&t.metricId?(g.metrics||[]).find(x=>x.id===t.metricId):null;
 return m?(m.unit||""):"";
}

/* детерминированный хеш всей строки пакета: разные пакеты не получают одинаковый ключ */
function strHash(str){
 let h1=0x811c9dc5, h2=0x01000193;
 for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i);
  h1=(h1^c)>>>0; h1=(h1*0x01000193)>>>0;
  h2=(h2+c*(i%31+1))>>>0; h2=((h2<<5)|(h2>>>27))>>>0; }
 return h1.toString(36)+h2.toString(36);
}
/* строгая дата: 2026-02-31 и 2026-02-29 не проходят — календарь не нормализуем */
function isDate(s){
 if(typeof s!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
 const y=+s.slice(0,4), m=+s.slice(5,7), d=+s.slice(8,10);
 if(m<1||m>12||d<1||d>31) return false;
 const dt=new Date(Date.UTC(y,m-1,d));
 return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d;
}
/* разбор метрики действия из пакета: общий для top-level newMetrics и вложенных newGoals[].metrics.

function parseUpdateMetric(u,where,warns){
 const name=String((u&&u.name)||"").trim();
 if(!name){ warns.push(`⚠️ ${where}: метрика без названия — пропускаю`); return null; }
 const plans={};
 if(u.monthPlans&&typeof u.monthPlans==="object") Object.keys(u.monthPlans).forEach(k=>{
  if(S.months.some(m=>m.id===k)){ const v=Math.round(Number(u.monthPlans[k])); if(v>=0) plans[k]=v; }
  else warns.push(`⚠️ ${where}: метрика «${name}» — месяц «${k}» не найден, план этого месяца пропущен`);
 });
 let regular=!!u.regular;
 const perWeek=Math.max(0,Math.round(Number(u.perWeek)||0));
 /* регулярность без ритма не превращаем молча в «раз в неделю»: метрику создаём, регулярность выключаем */
 if(regular&&!(perWeek>0)){
  warns.push(`⚠️ ${where}: у метрики «${name}» включена регулярность, но недельный ритм не задан — создам её как обычную, без ритма`);
  regular=false;
 }
 return {name,emoji:String(u.emoji||"✅"),unit:String(u.unit||"шт"),
  valueType:u.valueType==="volume"?"volume":"count",
  total:Math.max(0,Math.round(Number(u.total)||0)),regular,perWeek,
  easyWeek:Math.max(0,Math.round(Number(u.easyWeek)||0)),plans};
}
/* задан ли для новой метрики месячный план: явные monthPlans или общий объём, который раскладывается по месяцам */
const newMetricHasMonthlyPlan=o=>Object.keys((o&&o.plans)||{}).length>0||(Number(o&&o.total)||0)>0;
/* ЕДИНСТВЕННЫЙ алгоритм месячных планов новой метрики — им пользуются и предпросмотр, и создание.
   Состояние не меняется, возвращается новый объект {monthId: число}. */
function buildNewMetricPlans(o,months){
 const out={}; (months||[]).forEach(m=>out[m.id]=0);
 const plans=(o&&o.plans)||{};
 if(Object.keys(plans).length){                       /* планы заданы явно — берём как есть, остаток не раскидываем */
  Object.keys(plans).forEach(k=>{ if(k in out) out[k]=Number(plans[k])||0; });
  return out;
 }
 const total=Math.max(0,Math.round(Number(o&&o.total)||0)), n=(months||[]).length;
 if(!total||!n) return out;                           /* объёма нет — месячных планов тоже, ничего не выдумываем */
 const base=Math.floor(total/n), rest=total-base*n;   /* сумма по месяцам в точности равна total */
 months.forEach((m,i)=>out[m.id]=base+(i<rest?1:0));
 return out;
}

function resultEntryModal(g,rm,opts){
 opts=opts||{};
 const cur=rCurrent(rm), e=rEntries(rm.id), last=e.length?e[e.length-1]:null;
 const bucket=bucketOf(rm,today());
 const prompt=rm.type==="cumulative_period"
  ? `З початку періоду «${bucketLabel(rm,bucket)}» накопичено`
  : rm.type==="period_value" ? `Значення за «${bucketLabel(rm,bucket)}»` : "Зараз";
 modal({title:`${rm.emoji} ${rm.name}`,body:`
  <div class="sub" style="margin-bottom:14px">${g.emoji} ${esc(g.name)}</div>
  ${last?`<div class="small" style="margin-bottom:10px">${rm.type==="cumulative_period"?"На минулій перевірці":"Попереднє значення"}: ${vfmt(last.value)}${rm.unit?" "+esc(rm.unit):""} · ${dfull(last.date)}</div>`:""}
  <label class="f"><span>${esc(prompt)}${rm.unit?" ("+esc(rm.unit)+")":""}</span><input type="number" id="reV" value="${cur==null?"":cur}"></label>
  <label class="f"><span>Дата</span><input type="date" id="reD" value="${today()}"></label>
  <label class="f"><span>Коментар</span><input type="text" id="reN" placeholder="необов'язково"></label>
  ${rm.type==="cumulative_period"?`<div class="hint">Це накопичення всередині періоду, а не загальний підсумок: з початком нового періоду рахунок піде заново, а завершений період збережеться.</div>`:""}`,
  actions:[{t:"Скасувати",c:"o",fn:opts.back||closeModal},{t:"Записати",fn:()=>{
   const v=Number(val("reV")); if(isNaN(v)){ toast("Потрібно число"); return; }
   const d=val("reD")||today();
   const apply=()=>{ rAdd(g,rm,v,d,opts.source||"manual",val("reN"));
    refreshAutoDone(g,true);                       /* статус цілі рахує лише загальний помічник */
    if(opts.back){ closeModal(); opts.back(); } else { closeModal(); commit("Результат записано"); } };
   futureGuard(d,()=>outOfPeriodGuard(d,()=>cumulativeGuard(g,rm,v,d,apply)),()=>resultEntryModal(g,rm,opts));
  }}]});
}
/* фактический результат нельзя записать будущей датой */
function futureGuard(date,onOk,onFix){
 if(date<=today()){ onOk(); return; }
 modal({title:"Дата ще не настала",body:`<div class="sub">${dfull(date)} — це майбутнє. Показник результату фіксує те, що вже виміряно, тому такий запис зберегти не можна.</div>
  <div class="hint" style="margin-top:14px">Постав сьогоднішню дату або дату, коли вимірювання справді було.</div>`,
  actions:[{t:"Скасувати",c:"o",fn:closeModal},{t:"Змінити дату",fn:()=>{ closeModal(); if(onFix) setTimeout(onFix,60); }}]});
}
/* зменшення накопиченого всередині одного періоду — майже завжди помилка вводу */
function cumulativeGuard(g,rm,value,date,onOk){
 if(rm.type!=="cumulative_period"){ onOk(); return; }
 const b=bucketOf(rm,date);
 const inB=rEntries(rm.id).filter(x=>eBucket(rm,x)===b&&x.date<=date);
 if(!inB.length){ onOk(); return; }
 const prev=Number(inB[inB.length-1].value);
 if(value>=prev){ onOk(); return; }
 modal({title:"Значення менше за попереднє",body:`
  <div class="sub">У періоді «${esc(bucketLabel(rm,b))}» вже записано ${vfmt(prev)}${rm.unit?" "+esc(rm.unit):""}, а зараз введено ${vfmt(value)}${rm.unit?" "+esc(rm.unit):""}.</div>
  <div class="hint" style="margin-top:14px">Для накопичувального показника вводиться загальна сума з початку періоду, а не надбавка. Що це?</div>`,
  actions:[
   {t:"Скасувати",c:"o",fn:closeModal},
   {t:"Це надбавка",c:"o",fn:()=>{ closeModal(); rAdd(g,rm,prev+value,date,"manual","введено надбавку "+vfmt(value)); commit(`Записано ${vfmt(prev+value)}`); }},
   {t:"Виправити минулий запис",c:"o",fn:()=>{ const i=S.journal.findIndex(x=>x.id===inB[inB.length-1].id);
     if(i>=0) S.journal.splice(i,1); jTouch(); closeModal(); rAdd(g,rm,value,date,"manual","виправлення минулого запису"); commit("Запис виправлено"); }},
   {t:"Так, накопичено стільки",fn:()=>{ closeModal(); onOk(); }}]});
}
/* дата поза періодом: запитати, а не мовчки прийняти */
function outOfPeriodGuard(date,onOk){
 if(date>=S.period.start&&date<=S.period.end){ onOk(); return; }
 modal({title:"Дата поза періодом",body:`<div class="sub">${dfull(date)} перебуває за межами періоду ${dfull(S.period.start)} — ${dfull(S.period.end)}.</div>
  <div class="hint" style="margin-top:14px">Такий запис не потрапить у жоден місяць і не буде видно в помісячній таблиці.</div>`,
  actions:[{t:"Скасувати",c:"o",fn:closeModal},
   {t:"Розширити період",c:"o",fn:()=>{
    const a=date<S.period.start?date:S.period.start, b=date>S.period.end?date:S.period.end;
    rebuildMonths(a,b); checkPeriods(); closeModal(); onOk(); toast("Період розширено");}},
   {t:"Все одно записати",fn:()=>{ closeModal(); onOk(); }}]});
}

/* ═══════════ объёмная метрика: ввод значения ═══════════ */
function volumeModal(t){
 const g=goalOf(t.goalId), m=g&&g.metrics.find(x=>x.id===t.metricId);
 if(!m){ toast("У цієї дії немає метрики"); return; }
 modal({title:`${m.emoji||"💸"} ${m.name}`,body:`
  <div class="sub" style="margin-bottom:14px">${esc(t.title)} · записано ${isMinUnit(m.unit)?`${formatMinutes(t.completed)} з ${formatMinutes(t.planned)}`:`${nfmt(t.completed)} з ${nfmt(t.planned)} ${esc(m.unit||"")}`}</div>
  <label class="f"><span>Записати значення${m.unit?" ("+esc(m.unit)+")":""}</span><input type="number" id="vQ" value="${Math.max(0,t.planned-t.completed)}"></label>
  <div class="hint">Значення додасться до факту метрики за поточний місяць і з'явиться в історії.</div>`,
  actions:[{t:"Скасувати",c:"o",fn:closeModal},{t:"Записати",fn:()=>{
   const q=Number(val("vQ"))||0;
   if(q<0){ toast("Значення має бути більше нуля. Зменшити факт можна в «Мій шлях»"); return; }
   if(!q){ closeModal(); return; }
   const ev=factAdd(t.goalId,t.metricId,q,{type:"task",id:t.id});
   t.completed+=q;
   if(t.completed>=t.planned&&!t.done){ t.done=true; if(!t.xpGiven){const xp=t.challenge?5:t.imp?3:1;addXP(xp);t.xpGiven=true;if(ev)ev.xp=xp;} closeSource(t,true); }
   closeModal(); commit(`Записано ${aFmtU(q,m.unit)}`);}}]});
}

 const tyEl=$("#tTy"), qEl=$("#tQ"), qL=$("#tQL");
 const qH=$("#tQH");
 const syncQty=()=>{ if(!tyEl||!qEl) return;
  const ty=tyEl.value;
  if(qL) qL.textContent=ty==="volume"?"Який обсяг":"Скільки разів";
  if(qH) qH.textContent=ty==="binary"?"Постав більше одиниці — дія сама стане лічильною":"";
  if(ty==="binary") qEl.value=1;
  else if(Number(qEl.value)<1) qEl.value=1;
 };
 if(tyEl) tyEl.onchange=syncQty;
 if(qEl) qEl.oninput=()=>{ if(tyEl&&tyEl.value==="binary"&&Number(qEl.value)>1){ tyEl.value="count"; syncQty(); } };
 syncQty();
}

function goalResult(g){
 modal({title:`⚡ Скоригувати факт дій`,body:`
  <div class="sub" style="margin-bottom:18px">${esc(g.name)}</div>
  ${g.type==="result"&&(g.results||[]).length?`<div class="hint" style="margin-bottom:16px">Результат записується окремо — кнопкою «✍️ Записати результат» на картці цілі, щоб зберігалася історія змін.</div>`:""}
  ${g.metrics.length?`<div style="margin-top:18px"><div class="small" style="margin-bottom:10px">Факт по метриках за ${esc(S.months.find(m=>m.id===curMonthId()).label)}</div>

  <div class="small">Термін і пріоритет змінюються в «✏️ Змінити».</div>`,
  actions:[{t:"Скасувати",c:"o",fn:closeModal},{t:"Зберегти",fn:()=>{
   g.metrics.forEach(m=>{const e=$("#uf_"+m.id); if(!e) return;
    const was=fMonth(m,curMonthId()), now=Math.max(0,Number(e.value)||0);
    if(now!==was) jAdd({kind:"fact",goalId:g.id,metricId:m.id,monthId:curMonthId(),qty:now-was,unit:m.unit||"",
     sourceType:"adjust",title:`Коригування факту: ${m.name} — було ${nfmt(was)}, стало ${nfmt(now)}`});});
   refreshAutoDone(g,true);                        /* правка факту дій сама по собі ціль не закриває */

  }
 });

function dl(name,content,type){

}
