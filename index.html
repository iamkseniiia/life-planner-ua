/* ═══════════ первый запуск ═══════════ */
/* ═══════════ LIFE_PLANNER_INIT v1 ═══════════ */
/* отдельный слой первоначальной сборки: собирает НОВЫЙ планер из пакета распаковки.
   Не путать с LIFE_PLANNER_UPDATE (меняет существующий) и с копией JSON (восстанавливает точное состояние). */
const INIT_LIMITS={spheres:20,goals:40,results:10,metrics:20,milestones:50,hyps:100,steps:50,tasks:30};
const INIT_PALETTE=["#E2A33C","#E1705B","#5B8DEF","#3FB183","#41B8CD","#DE7CAA","#A585E8","#7B8CA6","#C98A5B","#6FB86B"];
const R_TYPES=["current_state","cumulative_period","period_value"];
const R_RULES=["higher_better","lower_better","target_value","range"];
const ACC=["week","month","goal_period"];
const FREQ=["weekly","monthly","manual"];
const IMPORTANCE={normal:{imp:false,challenge:false,xp:1},important:{imp:true,challenge:false,xp:3},challenge:{imp:false,challenge:true,xp:5}};

function checkInit(p){
 const W=[], fail=m=>({fatal:m,warns:W});
 const isObj=o=>o&&typeof o==="object"&&!Array.isArray(o);
 const arr=a=>Array.isArray(a)?a:[];
 const num=v=>typeof v==="number"&&isFinite(v);
 const str=v=>typeof v==="string"?v.trim():"";
 if(!isObj(p)) return fail("Не вижу пакета. Вставь ответ целиком — я найду нужную часть.");
 if(p.type!=="LIFE_PLANNER_INIT") return fail(p.type==="LIFE_PLANNER_UPDATE"
   ? "Это пакет изменений LIFE_PLANNER_UPDATE, а не первоначальный план. Примени его через «Применить изменения из ИИ»."
   : "Это не пакет LIFE_PLANNER_INIT.");
 if(Number(p.version)!==1) return fail(`Версия пакета ${p.version} пока не поддерживается. Нужна версия 1.`);
 /* ——— период ——— */
 const per=isObj(p.period)?p.period:null;
 if(!per||!isDate(per.start)||!isDate(per.end)) return fail("В пакете нет корректного периода: нужны даты начала и конца в формате ГГГГ-ММ-ДД.");
 if(per.start>=per.end) return fail("Початок періоду должно быть раньше конца.");
 const months=buildMonths(per.start,per.end);
 if(!months.length) return fail("Из этого периода не получается ни одного месяца.");
 const monthByKey={}; months.forEach(m=>monthByKey[m.id.slice(2,6)+"-"+m.id.slice(6)]=m);
 const emptyPlan=()=>{const o={};months.forEach(m=>o[m.id]=0);return o;};
 /* ——— сферы ——— */
 const rawSph=arr(p.spheres).filter(isObj);
 if(rawSph.length>INIT_LIMITS.spheres) return fail(`Слишком много сфер: ${rawSph.length}. Максимум ${INIT_LIMITS.spheres}.`);
 const sphMap={}, spheres=[];
 rawSph.forEach((s,i)=>{
  const key=str(s.key)||str(s.name)||("sphere"+i);
  if(sphMap[key]) return W.push(`Сфера «${key}» встречается дважды — оставляю первую.`);
  const id="s_"+uid();
  sphMap[key]={id};
  spheres.push({id,name:str(s.name)||key,emoji:str(s.emoji)||"🎯",color:INIT_PALETTE[spheres.length%INIT_PALETTE.length]});
 });
 if(!spheres.length){ const id="s_"+uid(); sphMap.__default={id}; spheres.push({id,name:"Мои цели",emoji:"🎯",color:INIT_PALETTE[0]}); }
 const defSphere=spheres[0].id;
 /* ——— цели ——— */
 const rawGoals=arr(p.goals).filter(isObj);
 if(arr(p.goals).length!==rawGoals.length) W.push("В списке целей были повреждённые записи — пропускаю их.");
 if(rawGoals.length>INIT_LIMITS.goals) return fail(`Слишком много целей: ${rawGoals.length}. Максимум ${INIT_LIMITS.goals}.`);
 const goalMap={}, goals=[], journal=[];
 for(let gi=0;gi<rawGoals.length;gi++){
  const g=rawGoals[gi];
  const gkey=str(g.key)||str(g.name)||("goal"+gi);
  const nm=str(g.name);
  if(!nm) return fail(`У цели «${gkey}» нет названия.`);
  if(goalMap[gkey]) return fail(`Ключ цели «${gkey}» встречается дважды. Ключи должны быть уникальными.`);
  const type=str(g.type)||"result";
  if(!["result","count","project"].includes(type)) return fail(`У цели «${nm}» неизвестный тип «${type}». Допустимы result, count и project.`);
  const rawRes=arr(g.resultMetrics).filter(isObj), rawAct=arr(g.actionMetrics).filter(isObj), rawMs=arr(g.milestones).filter(isObj);
  if(type==="result"&&!rawRes.length) return fail(`Цель «${nm}» — result, но у неё нет показателя результата. Добавь показатель или поменяй тип цели.`);
  if(type!=="result"&&rawRes.length) return fail(`У цели «${nm}» тип ${type}, но указан показатель результата. Раздели цель или поменяй её тип.`);
  if(type==="count"&&!rawAct.length) return fail(`Цель «${nm}» — count, но у неё нет метрики действия. Количество нельзя считать без метрики действия.`);
  if(type!=="project"&&rawMs.length) return fail(`У цели «${nm}» тип ${type}, но указаны этапы. Этапы бывают только у проекта — раздели цель или поменяй её тип.`);
  if(type==="project"&&!rawMs.length) W.push(`У проекта «${nm}» пока нет этапов — прогресс будет считать не по чему. Их можно добавить позже.`);
  if(rawRes.length>INIT_LIMITS.results) return fail(`У цели «${nm}» слишком много показателей результата: ${rawRes.length}. Максимум ${INIT_LIMITS.results}.`);
  if(rawAct.length>INIT_LIMITS.metrics) return fail(`У цели «${nm}» слишком много метрик действий: ${rawAct.length}. Максимум ${INIT_LIMITS.metrics}.`);
  if(rawMs.length>INIT_LIMITS.milestones) return fail(`У проекта «${nm}» слишком много этапов: ${rawMs.length}. Максимум ${INIT_LIMITS.milestones}.`);

 const hypRows=c.hyps.length?`<div class="card"><div class="h-sec">🧪 Гипотезы</div>
   ${c.hyps.map(h=>`<div class="rowj" style="padding:5px 0"><span class="small">${esc(h.name)}</span>
     <span class="small">${esc((goalNameById(c,h.goalId))||"без цели")}</span></div>`).join("")}</div>`:"";
 const danger=meaningfulState(S)?`<div class="hint warn" style="margin-bottom:14px">Зараз в планере ${S.goals.length} ${S.goals.length===1?"цель":"целей"} и своя история. Новый план заменит текущий планер целиком — история старого не переносится. Копия текущего состояния сохранится, вернуться можно будет в настройках.</div>`:"";
 modal({title:"✨ Новый Life Planner",wide:true,body:`
  ${danger}
  <div class="card">
   <div class="rowj"><span class="mid">${esc(c.name)}</span><span class="small">${c.goals.length} ${c.goals.length===1?"цель":"целей"}</span></div>
   <div class="small" style="margin-top:6px">Период: ${dfull(c.period.start)} — ${dfull(c.period.end)} · ${c.months.length} мес.</div>
   <div class="small" style="margin-top:4px">Сферы: ${c.spheres.map(x=>x.emoji+" "+esc(x.name)).join(" · ")}</div>
   ${c.journal.length?`<div class="small" style="margin-top:4px">Начальных измерений: ${c.journal.length}</div>`:""}
  </div>
  <div class="card"><div class="h-sec">🎯 Цели</div>${goalRows}</div>
  ${monthRows?`<div class="card"><div class="h-sec">🗺 План по месяцам</div>${monthRows}</div>`:""}
  ${hypRows}
  ${wk}
  ${r.warns.length?`<div class="card" style="background:var(--warn-soft)"><div class="h-sec">⚠️ Что стоит проверить</div>
    ${r.warns.map(w=>`<div class="small" style="margin-bottom:6px">${esc(w)}</div>`).join("")}</div>`:""}`,
  actions:[{t:"Скасувати",c:"o",fn:closeModal},{t:"✅ Создать этот планер",fn:()=>{
   const res=applyInitState(r.candidate);
   if(!res.ok){ toast(res.error||"Не получилось создать планер"); return; }
   closeModal(); toast("✨ Новый планер готов");
  }}]});
}
function goalNameById(st,id){ const g=(st.goals||[]).find(x=>x.id===id); return g?g.emoji+" "+g.name:""; }
/* применение: активное состояние заменяется только после проверки и копии */
function applyInitState(candidate){
 let st=null;
 try{ st=normalize(JSON.parse(JSON.stringify(candidate))); }catch(e){ return {ok:false,error:"Планер не собрался — ничего не менял"}; }
 const v=validateState(st);
 if(!v.ok) return {ok:false,error:"Планер не прошёл проверку: "+v.error};
 const keep=S, keepTab=TAB, keepSel=MSEL;
 try{
  S=st; MSEL=null;
  ["home","week","goals","path","wrev","mrev","ach","hyp","hist"].forEach(t=>{TAB=t;viewFor(t)();});
 }catch(e){ S=keep; TAB=keepTab; MSEL=keepSel; return {ok:false,error:"Планер не строится — ничего не менял"}; }
 S=keep; TAB=keepTab; MSEL=keepSel;
 if(meaningfulState(S)){
  const bk=writePreImportBackup();
  if(!bk.ok) return {ok:false,error:"Не удалось создать резервную копию текущего планера. Создание отменено."};
 }
 S=st; window.__draft=null; window.__fillWeek=null; MSEL=null; TAB="home";
 checkPeriods(); save(); render();
 return {ok:true};
}
/* один вход: вставить текст или выбрать файл — оба пути дают один и тот же пакет */
function initImportModal(){
 modal({title:"✨ Создать план из распаковки",wide:true,body:`
  <div class="sub" style="margin-bottom:14px">Вставь сюда ответ с блоком LIFE_PLANNER_INIT — можно целиком, я найду нужную часть. Или загрузи файл, если ответ сохранён отдельно.</div>
  <textarea id="initT" style="min-height:240px;font-size:15px" placeholder='{ "type": "LIFE_PLANNER_INIT", "version": 1, ... }'></textarea>
  <div class="row wr" style="gap:8px;margin-top:12px">
   <button class="btn o s" id="initFileBtn">📄 Загрузить файлом</button>
   <input type="file" id="initFile" accept=".json,.txt" style="display:none">
  </div>
  <div class="small" style="margin-top:12px">Ничего не создастся сразу — сначала покажу, что получится.</div>`,
  actions:[{t:"Скасувати",c:"o",fn:closeModal},{t:"Проверить план",fn:()=>runInit(val("initT"))}]});
 const fb=$("#initFileBtn"), fi=$("#initFile");
 if(fb&&fi){ fb.onclick=()=>fi.click();
  fi.onchange=e=>{const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
   rd.onload=()=>{ const ta=$("#initT"); if(ta) ta.value=String(rd.result||""); runInit(String(rd.result||"")); };
   rd.readAsText(f);};}
}
function runInit(text){
 const p=extractJSON(text,"LIFE_PLANNER_INIT");
 if(p&&p.__wrongType){ toast(p.__wrongType==="LIFE_PLANNER_UPDATE"?"Это пакет изменений LIFE_PLANNER_UPDATE — его применяют через «Применить изменения из ИИ»":"Это не LIFE_PLANNER_INIT"); return; }
 if(!p){ const raw=extractJSON(text);
  if(raw&&!raw.type&&Array.isArray(raw.goals)){ toast("Похоже, это резервная копия Life Planner. Её нужно загрузить через «Загрузить копию JSON»"); return; }
  toast("Не нашла LIFE_PLANNER_INIT в этом тексте"); return; }
 if(!p.type&&Array.isArray(p.goals)){ toast("Похоже, это резервная копия Life Planner. Её нужно загрузить через «Загрузить копию JSON»"); return; }
 if(p.type==="LIFE_PLANNER_UPDATE"){ toast("Это пакет изменений LIFE_PLANNER_UPDATE — его применяют через «Применить изменения из ИИ»"); return; }
 if(p.type!=="LIFE_PLANNER_INIT"){ toast("Это не LIFE_PLANNER_INIT"); return; }
 const r=checkInitSafe(p);
 if(r.fatal){ toast("⚠️ "+r.fatal); return; }
 closeModal(); setTimeout(()=>previewInit(r),80);
}
/* первый запуск: три независимых пути */
function startChoice(){
 modal({title:"👋 Привіт!",body:`
  <div class="sub" style="margin-bottom:18px">Это планер на один цикл жизни: цели, помесячный план, недели и то, что реально изменилось. С чего начнём?</div>
  <div class="hint" style="margin-bottom:12px">
   <div style="font-size:15.5px">✨ Создать из распаковки</div>
   <div class="small" style="margin-top:4px">Если ты уже разобрала цели с ChatGPT или Claude — загрузи готовый план.</div>
   <button class="btn s" style="margin-top:10px" data-a="startInit">Создать из распаковки</button></div>
  <div class="hint" style="margin-bottom:12px">
   <div style="font-size:15.5px">✏️ Заполнить самостоятельно</div>
   <div class="small" style="margin-top:4px">Настроить период и первую цель вручную.</div>
   <button class="btn o s" style="margin-top:10px" data-a="startManual">Заполнить самостоятельно</button></div>
  <div class="hint">
   <div style="font-size:15.5px">♻️ Восстановить резервную копию</div>
   <div class="small" style="margin-top:4px">Если Life Planner у тебя уже был и есть файл с данными.</div>
   <button class="btn o s" style="margin-top:10px" data-a="startRestore">Восстановить копию</button></div>
  <div class="small" style="text-align:center;margin-top:18px;color:var(--ink3);line-height:1.7">
   <div>Life Planner от ${esc(AUTHOR.nameOf||AUTHOR.name)}</div>
   ${authorLinks().length?`<div style="margin-top:4px">${authorLinksHTML()}</div>`:""}</div>`,
  actions:[]});
}

function onboarding(step,draft){
 step=step||1; draft=draft||{name:"",start:today(),end:addDays(today(),180),goal:null};
 const finish=()=>{ save(); closeModal(); render(); };
 if(step===1){
  modal({title:"👋 Привіт!",body:`
   <div class="sub" style="margin-bottom:16px">Это планер на один цикл жизни: цели, помесячный план, недели и то, что реально изменилось. Настроим за минуту, остальное добавишь по ходу.</div>
   <label class="f"><span>Как тебя зовут?</span><input type="text" id="obName" value="${esc(draft.name)}" placeholder="Имя"></label>
   <div class="g2">
    <label class="f"><span>Период планирования с</span><input type="date" id="obA" value="${esc(draft.start)}"></label>
    <label class="f"><span>по</span><input type="date" id="obB" value="${esc(draft.end)}"></label>
   </div>
   <div class="hint">Обычно удобно брать 3–6 месяцев. Даты потом можно поменять.</div>`,
   actions:[{t:"Начать с пустого планера",c:"o",fn:()=>{
     draft.name=val("obName")||"друже"; applyOnboarding(draft,true); finish();}},
    {t:"Далі",fn:()=>{
     const a=val("obA"),b=val("obB");
     if(!a||!b||a>=b){ toast("Перевір дати періоду"); return; }
     draft.name=val("obName")||"друже"; draft.start=a; draft.end=b;
     closeModal(); setTimeout(()=>onboarding(2,draft),60);}}]});
  return;
 }
 if(step===2){
  modal({title:"🎯 Первая цель",body:`
   <div class="sub" style="margin-bottom:16px">Достаточно одной. Остальные добавишь, когда захочешь.</div>
   <label class="f"><span>Что за цель</span><input type="text" id="obG" placeholder="Например: вырастить канал"></label>
   <label class="f"><span>Эмодзи</span>${emoPicker("obE","🎯",EMOS)}</label>
   <label class="f"><span>Сфера</span><select id="obS">${S.spheres.map(x=>`<option value="${x.id}">${x.emoji} ${esc(x.name)}</option>`).join("")}</select></label>
   <label class="f"><span>Тип цели</span><select id="obT">
     <option value="result">🎯 Результат — есть число, которое должно измениться</option>
     <option value="count">🔁 Количество — важно число действий</option>
     <option value="project">✅ Проект — состоит из этапов</option></select></label>`,
   actions:[{t:"Пропустити",c:"o",fn:()=>{ applyOnboarding(draft,true); finish(); }},
    {t:"Далі",fn:()=>{
     const nm=val("obG").trim(); if(!nm){ toast("Напиши название цели"); return; }
     draft.goal={name:nm,emoji:pickedEmo("#obE"),sphereId:val("obS"),type:val("obT")};
     closeModal(); setTimeout(()=>onboarding(draft.goal.type==="result"?3:(draft.goal.type==="project"?35:4),draft),60);}}]});
  return;
 }
 if(step===3){
  modal({title:"📍 Как измерить результат",body:`
   <div class="sub" style="margin-bottom:16px">По каким данным будет видно, что цель «${esc(draft.goal.name)}» сдвинулась?</div>
   <label class="f"><span>Что измеряем</span><input type="text" id="obRN" placeholder="Например: подписчики, доход, вес"></label>
   <div class="g2">
    <label class="f"><span>Сейчас</span><input type="number" id="obRB" value="0"></label>
    <label class="f"><span>Цель</span><input type="number" id="obRT" value="100"></label>
   </div>
   <div class="g2">
    <label class="f"><span>Единица</span><input type="text" id="obRU" placeholder="₽, чел, кг"></label>
    <label class="f"><span>Как меняется</span><select id="obRTy">
      <option value="current_state">📍 Есть число прямо сейчас</option>
      <option value="cumulative_period">📈 Накапливается за месяц</option>
      <option value="period_value">📊 Считается за каждый период</option></select></label>
   </div>
   <label class="f"><span>Как понять, что стало лучше</span><select id="obRR">
     <option value="higher_better">Больше — лучше</option>
     <option value="lower_better">Меньше — лучше</option>
     <option value="target_value">Прийти к значению</option>
     <option value="range">Держаться в диапазоне</option></select></label>`,
   actions:[{t:"Пропустити",c:"o",fn:()=>{ closeModal(); setTimeout(()=>onboarding(4,draft),60); }},
    {t:"Далі",fn:()=>{
     draft.result={name:val("obRN").trim()||draft.goal.name,unit:val("obRU"),
      baseline:Number(val("obRB"))||0,target:Number(val("obRT"))||0,type:val("obRTy"),successRule:val("obRR")};
     closeModal(); setTimeout(()=>onboarding(4,draft),60);}}]});
  return;
 }
 if(step===35){
  modal({title:"✅ Из каких этапов состоит цель",body:`
   <div class="sub" style="margin-bottom:16px">Проект «${esc(draft.goal.name)}» измеряется этапами. Можно добавить 1–5 сейчас или пропустить и дописать позже.</div>
   <label class="f"><span>Этапы — каждый с новой строки</span><textarea id="obMS" style="min-height:120px" placeholder="Например:&#10;Документы&#10;Билеты&#10;Жильё"></textarea></label>`,
   actions:[{t:"Пропустити",c:"o",fn:()=>{ closeModal(); setTimeout(()=>onboarding(4,draft),60); }},
    {t:"Далі",fn:()=>{ draft.milestones=val("obMS").split("\n").map(x=>x.trim()).filter(Boolean).slice(0,5);
     closeModal(); setTimeout(()=>onboarding(4,draft),60);}}]});
  return;
 }
 modal({title:"⚡ Что будешь делать",body:`
  <div class="sub" style="margin-bottom:16px">Дія, которое ты контролируешь. Например: ролики, тренировки, письма.</div>
  <label class="f"><span>Название действия</span><input type="text" id="obMN" placeholder="Например: ролики"></label>
  <div class="g3">
   <label class="f"><span>Всего за период</span><input type="number" id="obMT" value="12"></label>
   <label class="f"><span>Единица</span><input type="text" id="obMU" value="шт"></label>
   <label class="f"><span>Каждую неделю</span><input type="number" id="obMW" value="1" min="0"></label>
  </div>
  <div class="hint">Если поставить недельный ритм, действие само будет возвращаться в каждую новую неделю.</div>`,
  actions:[].concat(draft.goal&&draft.goal.type==="count"?[]:[{t:"Пропустити",c:"o",fn:()=>{ applyOnboarding(draft,false); finish(); }}],
   [{t:"Готово",fn:()=>{
    const nm=val("obMN").trim();
    if(draft.goal&&draft.goal.type==="count"&&!nm){ toast("Для цели-количества нужно назвать, что именно считаем"); return; }
    draft.metric={name:nm,total:Number(val("obMT"))||0,unit:val("obMU")||"шт",perWeek:Number(val("obMW"))||0};
    applyOnboarding(draft,false); finish();}}])});
}
function applyOnboarding(draft,skipAll){
 S.name=draft.name||"друже";
 rebuildMonths(draft.start,draft.end);
 S.week={start:mondayOf(today()),focus:"",challenge:"",mode:"normal",review:{a1:"",a2:"",a3:""},tasks:[]};
 S.lastSeenMonth=curMonthId(); S.monthQueue=[]; S.monthPending="";
 if(!skipAll&&draft.goal){
  const g={id:"g_"+uid(),emoji:draft.goal.emoji,name:draft.goal.name,sphereId:draft.goal.sphereId,type:draft.goal.type,
   priority:3,status:"active",deadline:S.period.end,results:[],metrics:[],milestones:[],
   hypothesis:"",full:"",easy:"",note:""};
  S.goals.push(g);
  if(draft.result&&draft.goal.type==="result"){
   const rm=resultMetric({name:draft.result.name,emoji:draft.goal.emoji,unit:draft.result.unit,type:draft.result.type,
    successRule:draft.result.successRule,baseline:draft.result.baseline,target:draft.result.target,primary:true});
   g.results.push(rm); rAdd(g,rm,rm.baseline,today(),"manual","точка отсчёта");
  }
  if(draft.milestones&&draft.milestones.length) g.milestones=draft.milestones.map(t=>({id:uid(),title:t,done:false}));
  if(draft.metric&&draft.metric.name){
   const m=metric(draft.metric.name,"✅",draft.metric.unit,draft.metric.total,[],
    draft.metric.perWeek>0,draft.metric.perWeek,0,"count");
   m.plan=planFor(draft.metric.total);
   g.metrics.push(m);
  }
 }
 checkPeriods(); save();
 setTimeout(()=>toast(skipAll?"Пустой планер готов — добавляй цели, когда будешь готова":"Готово! Можно собрать первую неделю"),300);
}

/* ═══════════ старт ═══════════ */
S=load();
const FIRST_RUN=!S;
if(FIRST_RUN) S=seed({empty:true});
if(!S.seenAch.length) S.seenAch=achList().filter(a=>a.on).map(a=>a.id);
checkPeriods(); save(); render(); renderCredits();
if(FIRST_RUN) setTimeout(()=>autoGithubPullFirstRun().then(ok=>{ if(!ok) startChoice(); }),150);
else if(S.migratedFrom){ const k=S.migratedFrom; delete S.migratedFrom; save();
 setTimeout(()=>toast("Данные перенесены в общее хранилище приложения"),400); }
/* если вкладка была открыта через полночь — пересчитываем календарь при возврате */
/* календарь живой: сверяем дату и текущий месяц, а не только флаги */
let __lastDay=today(), __lastMonth=curMonthId();
function refreshCalendar(){
 const day=today(), mo=curMonthId();
 const w=S.newWeekPending, m=S.monthPending, q=(S.monthQueue||[]).join(",");
 checkPeriods();
 const changed = day!==__lastDay || mo!==__lastMonth
   || w!==S.newWeekPending || m!==S.monthPending || q!==(S.monthQueue||[]).join(",");
 __lastDay=day; __lastMonth=mo;
 if(changed){ save(); render(); }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshCalendar(); });
window.addEventListener("focus",refreshCalendar);
setInterval(()=>{ if(today()!==__lastDay) refreshCalendar(); },60000);   // тихая проверка смены суток
</script>
