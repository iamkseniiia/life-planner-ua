<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Поліна Сахарова">
<meta name="creator" content="Поліна Сахарова">
<title>Мій план життя</title>
<style>
:root{
  --bg:#FBF8F4; --card:#FFFFFF; --soft:#F5F1EB;
  --ink:#22262F; --ink2:#5E6674; --ink3:#8E96A3;
  --line:#EEE8E0;
  --acc:#6D5EF3; --acc-soft:#EEEBFF;
  --ok:#2FA36B; --ok-soft:#E4F6EC;
  --warn:#C98A12; --warn-soft:#FBF1DC;
  --bad:#D4614F;
  --r:22px; --r2:16px; --r3:12px;
  --sh:0 2px 4px rgba(60,50,40,.03), 0 10px 30px rgba(60,50,40,.06);
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-t="dark"]{
  --bg:#16151A; --card:#1F1E25; --soft:#26252D;
  --ink:#F0EEF3; --ink2:#A9A6B4; --ink3:#7C7989;
  --line:#2E2C36; --acc:#9A8CFF; --acc-soft:#2A2740;
  --ok:#5CC894; --ok-soft:#1F3A2C; --warn:#E0AE4E; --warn-soft:#3A3020; --bad:#E4816F;
  --sh:0 2px 4px rgba(0,0,0,.2), 0 10px 30px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-style:normal!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 140px}

/* header */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 18px 10px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:600}
.sp{flex:1}
.rbtn{background:var(--card);border:1px solid var(--line);border-radius:14px;height:42px;min-width:42px;padding:0 13px;cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;font-size:15px}
.rbtn:hover{color:var(--ink)}
.tabs{max-width:1180px;margin:0 auto;padding:2px 18px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:transparent;border:1px solid transparent;border-radius:999px;padding:9px 15px;cursor:pointer;color:var(--ink2);white-space:nowrap;font-size:15px}
.tabs button:hover{background:var(--soft)}
.tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--sh)}
@media(max-width:760px){.tabs{display:none}}

/* bottom nav (mobile) */
.bnav{display:none}
@media(max-width:760px){
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;
   background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);
   padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav button{background:none;border:0;padding:8px 2px;cursor:pointer;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;border-radius:12px}
 .bnav button.on{color:var(--acc)}
 .bnav .e{font-size:21px;line-height:1}
 .wrap{padding-bottom:100px}
 /* нижнее меню фиксировано поверх страницы: подпись должна прокручиваться выше него */
 .cred{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
}

/* предупреждение о том, что запись на устройство не проходит: в потоке страницы, ничего не перекрывает */
.swarn:empty{display:none}
.swarn-in{max-width:1100px;margin:14px auto 0;padding:15px 18px;border-radius:var(--r2);
  background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.swarn-t{font-size:15.5px;font-weight:600;color:var(--ink)}
.swarn-s{font-size:13.5px;line-height:1.6;color:var(--ink2);margin-top:4px}
.swarn-in .btn{flex:none}
@media(max-width:760px){.swarn-in{margin:12px 14px 0}.swarn-in .btn{width:100%}}

/* подпись автора: вторичная, ненавязчивая, живёт в потоке страницы */
.cred{display:none!important;max-width:1100px;margin:26px auto 0;padding:18px 20px 28px;text-align:center;
  font-size:12.5px;line-height:1.7;color:var(--ink3);border-top:1px solid var(--line)}
.cred a{color:var(--ink3);text-decoration:none;border-bottom:1px solid var(--line)}
.cred a:hover{color:var(--ink2)}
.cred .sep{opacity:.5;padding:0 4px}

/* blocks */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.card+.card{margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.h-sec{font-size:19px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.h-page{font-size:27px;font-weight:600;letter-spacing:-.02em;margin:6px 0 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--ink2);font-size:15px}
.small{font-size:14px;color:var(--ink2)}
.num{font-size:15px;font-weight:600;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:12px}
.rowj{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wr{flex-wrap:wrap}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .4s ease}
.bar.thin{height:7px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--soft);color:var(--ink2);font-size:14px;white-space:nowrap}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;font-size:15px}
.btn:hover{filter:brightness(1.06)}
.btn.g{background:var(--soft);color:var(--ink)}
.btn.o{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.o:hover{color:var(--ink);background:var(--soft)}
.btn.red{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.s{padding:9px 14px;font-size:14.5px;border-radius:12px}
.btn.wide{width:100%;justify-content:center;display:flex;align-items:center;gap:8px}
.big{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.mid{font-size:22px;font-weight:600;letter-spacing:-.02em}
.hint{background:var(--soft);border-radius:var(--r2);padding:15px 17px;font-size:15px;line-height:1.55}
.hint.acc{background:var(--acc-soft)}
.hint.warn{background:var(--warn-soft)}
.hint.ok{background:var(--ok-soft)}
.emptyb{padding:28px;text-align:center;color:var(--ink3);background:var(--soft);border-radius:var(--r2);font-size:15px}
.divider{height:1px;background:var(--line);margin:18px 0}

/* forms */
label.f{display:block;margin-bottom:16px}
label.f>span{display:block;font-size:14.5px;color:var(--ink2);margin-bottom:7px}
input[type=text],input[type=number],input[type=date],select,textarea{
 width:100%;background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:var(--card)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.chk{appearance:none;width:26px;height:26px;min-width:26px;border:2px solid var(--line);border-radius:9px;cursor:pointer;position:relative;background:var(--card)}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.emo{display:flex;gap:8px;flex-wrap:wrap}
.emo button{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:21px;cursor:pointer}
.emo button.on{border-color:var(--acc);background:var(--acc-soft)}

/* goal cards */
.gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
@media(max-width:760px){.gwrap{grid-template-columns:1fr}}
.gcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px;display:flex;flex-direction:column;gap:16px}
.ghead{display:flex;gap:14px;align-items:flex-start}
.gemo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:25px;flex:none}
.mrow{display:flex;align-items:center;gap:12px;padding:9px 0}
.mrow .mn{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mv{font-size:15px;font-weight:600;white-space:nowrap}
.mrow .mb{width:100px;flex:none}
@media(max-width:420px){.mrow .mb{width:64px}}

/* week */
.task{background:var(--card);border-radius:var(--r2);box-shadow:var(--sh);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.task.done{background:var(--soft);box-shadow:none}
.task .tb{flex:1;min-width:0}
.task .tt{font-size:16px;line-height:1.4}
.task.done .tt{color:var(--ink3);text-decoration:line-through}
.tmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.counter{display:flex;align-items:center;gap:12px;margin-top:12px}
.cbtn{width:42px;height:42px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font-size:21px;cursor:pointer;color:var(--ink);line-height:1}
.cbtn:active{background:var(--soft)}
.cval{font-size:17px;font-weight:600;min-width:74px;text-align:center}
.ico{background:none;border:0;cursor:pointer;color:var(--ink3);font-size:17px;padding:6px 8px;border-radius:10px}
.ico:hover{background:var(--soft);color:var(--ink)}

/* path matrix */
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
.mx th{font-weight:500;color:var(--ink2);padding:12px 8px;text-align:center;font-size:14.5px;white-space:nowrap}
.mx th.l{text-align:left;padding-left:4px}
.mx td{padding:8px;text-align:center;border-top:1px solid var(--line)}
.mx td.l{text-align:left;padding-left:4px}
.cell{width:100%;min-width:56px;border:0;background:var(--soft);border-radius:12px;padding:9px 4px;cursor:pointer;font-size:15px;color:var(--ink);line-height:1.25}
.cell:hover{background:var(--acc-soft);color:var(--acc)}
.cell .fx{display:block;font-size:13.5px;color:var(--ink3)}
.cell.cur{outline:2px solid var(--acc);outline-offset:-2px}
.mxwrap{overflow-x:auto;margin:0 -6px}
.mx-mob{display:none}
.mline{border-top:1px solid var(--line);padding:14px 0}
.mstrip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none}
.mstrip::-webkit-scrollbar{display:none}
.mcell{flex:none;min-width:104px;background:var(--soft);border:0;border-radius:14px;padding:11px 12px;text-align:left;cursor:pointer;color:var(--ink)}
.mcell .mo{font-size:13px;color:var(--ink3)}
.mcell .pf{font-size:16px;font-weight:600;margin-top:4px}
.mcell.cur{outline:2px solid var(--acc)}
@media(max-width:760px){ .mx-desk{display:none} .mx-mob{display:block} }
.mcards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mon{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;cursor:pointer}
.mon.cur{outline:2px solid var(--acc)}
.mon.past{opacity:.7}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(30,25,20,.4);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto}
.mdl{background:var(--card);border-radius:26px;width:100%;max-width:620px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:up .18s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}}
.mdl>header{padding:20px 24px 14px;display:flex;align-items:center;gap:12px}
.mdl>header h3{flex:1;font-size:19px}
.mdl .bd{padding:4px 24px 20px;max-height:66vh;overflow:auto}
.mdl>footer{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.xb{background:var(--soft);border:0;border-radius:12px;width:36px;height:36px;cursor:pointer;color:var(--ink2);font-size:19px;line-height:1}
@media(max-width:620px){
 .ovl{padding:0;align-items:flex-end}
 .mdl{max-width:none;border-radius:26px 26px 0 0}
 .mdl .bd{max-height:70vh}
}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:999px;font-size:15px;z-index:200;box-shadow:0 10px 34px rgba(0,0,0,.25);animation:up .2s ease;max-width:90vw;text-align:center}
.fab{position:fixed;right:18px;bottom:84px;z-index:59;height:54px;border-radius:27px;background:var(--acc);color:#fff;border:0;font-size:16px;padding:0 22px;box-shadow:0 10px 28px rgba(109,94,243,.4);cursor:pointer;display:none}
@media(max-width:760px){.fab{display:block}}
.achg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ach{background:var(--card);border-radius:var(--r2);box-shadow:var(--sh);padding:17px;display:flex;gap:13px;align-items:center}
.ach.off{background:var(--soft);box-shadow:none;opacity:.6}
.ach .e{font-size:26px}
.hist-day{margin-bottom:22px}
.hist-item{display:flex;gap:12px;align-items:center;padding:11px 0}
details.dd{background:var(--soft);border-radius:var(--r2);padding:2px 16px;margin-bottom:12px}
details.dd>summary{padding:13px 0;cursor:pointer;list-style:none;font-size:15px;display:flex;justify-content:space-between;gap:10px;color:var(--ink2)}
details.dd>summary::-webkit-details-marker{display:none}
details.dd>div{padding-bottom:14px}
</style>
</head>
<body>
<div class="top">
 <div class="top-in">
  <div class="logo"><span>🌿</span><span>Мій план життя</span></div>
  <div class="sp"></div>
  <button class="rbtn" id="lvlBtn"><span>✨</span><span id="lvlTxt">0 / 100</span></button>
  <button class="rbtn" id="thBtn">🌙</button>
  <button class="rbtn" id="dtBtn">⚙️</button>
 </div>
 <div class="tabs" id="tabs"></div>
</div>
<div class="swarn" id="swarn"></div>
<div class="wrap"><div id="view"></div></div>
<footer class="cred" id="cred"></footer>
<button class="fab" id="fab">➕ Дія</button>
<div class="bnav" id="bnav"></div>
<div id="mroot"></div>
<div id="troot"></div>

<script>
/*
 Life Planner
 Автор: Поліна Сахарова
 Telegram: @polyanoon
 https://t.me/polyanoon
 Instagram: @polyanoon
 https://www.instagram.com/polyanoon
 YouTube: @polyayou
 https://www.youtube.com/@polyayou
*/
"use strict";
/* ═══════════ авторство ═══════════ */
/* метаданные продукта, а не данные пользователя: в S, копии, INIT и UPDATE не попадают */
const AUTHOR={
 name:"Поліна Сахарова",
 nameBy:"Поліною Сахаровою",      /* «создано …» */
 nameOf:"Поліни Сахарової",       /* «от …» */
 telegram:{label:"@polyanoon",url:"https://t.me/polyanoon"},
 instagram:{label:"@polyanoon",url:"https://www.instagram.com/polyanoon"},
 youtube:{label:"@polyayou",url:"https://www.youtube.com/@polyayou"}
};
const authorLinks=()=>[["Telegram",AUTHOR.telegram],["Instagram",AUTHOR.instagram],["YouTube",AUTHOR.youtube]]
 .filter(([,v])=>v&&v.url&&v.label);
const extLink=(url,text,cls)=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer"${cls?` class="${cls}"`:""}>${esc(text)}</a>`;
/* строка «Telegram @polyanoon · Instagram @polyanoon · YouTube @polyayou» */
const authorLinksHTML=()=>authorLinks().map(([n,v])=>extLink(v.url,n+" "+v.label)).join('<span class="sep">·</span>');
function renderCredits(){
 const el=document.getElementById("cred"); if(!el) return;
 const by=AUTHOR.nameBy||AUTHOR.name;
 const who=AUTHOR.telegram&&AUTHOR.telegram.url?extLink(AUTHOR.telegram.url,by):esc(by);
 el.innerHTML=`<div>Life Planner · создано ${who}</div>${authorLinks().length?`<div style="margin-top:4px">${authorLinksHTML()}</div>`:""}`;
}

/* ═══════════ утилиты ═══════════ */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const pctOf=(v,a,b)=>{const d=b-a;if(!d)return v>=b?100:0;return clamp(Math.round((v-a)/d*100),0,100);};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today=()=>iso(new Date());
const MGEN=["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const DOWN=["неділя","понеділок","вівторок","середа","четвер","п’ятниця","субота"];
const D=s=>new Date(String(s)+"T00:00:00");
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d);};
const mondayOf=s=>{const d=D(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d);};
const daysBetween=(a,b)=>Math.round((D(b)-D(a))/864e5);
const dowOf=s=>DOWN[D(s).getDay()];
function weekLabel(st){const en=addDays(st,6),a=st.split("-"),b=en.split("-");
 return a[1]===b[1]?`${+a[2]}–${+b[2]} ${MGEN[+b[1]-1]}`:`${+a[2]} ${MGEN[+a[1]-1]} – ${+b[2]} ${MGEN[+b[1]-1]}`;}
function vfmt(n){
 const x=Number(n);
 if(!isFinite(x)) return "—";
 const r=Math.round(x*100)/100;
 return Number.isInteger(r)?r.toLocaleString("ru-RU"):r.toLocaleString("ru-RU",{minimumFractionDigits:1,maximumFractionDigits:2});
}
const xnum=n=>{const x=Number(n); if(!isFinite(x)) return "—";
 const r=Math.round(x*100)/100; return Number.isInteger(r)?String(r):String(r).replace(".",",");};
const nfmt=n=>{n=Math.round(Number(n)||0);return n>=1000000?(n/1000000).toFixed(n%1000000?1:0).replace(".",",")+" млн":n>=10000?Math.round(n/1000)+" тыс":n.toLocaleString("ru-RU");};
const dfmt=d=>{if(!d)return "—";const p=String(d).split("-");if(p.length!==3)return d;const M=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];return `${+p[2]} ${M[+p[1]-1]}`;};
const dfull=d=>{if(!d)return "—";const p=String(d).split("-");if(p.length!==3)return d;return `${+p[2]} ${MGEN[+p[1]-1]} ${p[0]}`;};
function toast(m){const r=$("#troot");r.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(window.__tt);window.__tt=setTimeout(()=>r.innerHTML="",2600);}
function toastUndo(m,fn){const r=$("#troot");
 r.innerHTML=`<div class="toast">${esc(m)} <button class="btn s" id="undoBtn" style="margin-left:10px;padding:5px 12px">Вернуть</button></div>`;
 const b=$("#undoBtn"); if(b) b.onclick=()=>{clearTimeout(window.__tt);r.innerHTML="";fn();};
 clearTimeout(window.__tt);window.__tt=setTimeout(()=>r.innerHTML="",6000);}

/* ═══════════ данные ═══════════ */
const SPHERES=[
 {id:"money",name:"Деньги",emoji:"💰",color:"#E2A33C"},
 {id:"content",name:"Контент",emoji:"🎥",color:"#E1705B"},
 {id:"lang",name:"Языки",emoji:"🇬🇧",color:"#5B8DEF"},
 {id:"body",name:"Тело",emoji:"🏃‍♀️",color:"#3FB183"},

 if(!isObj(c.monthData)) return {ok:false,error:"повреждены данные месяцев"};

 if(!Array.isArray(c.weekArchive)||!allObj(c.weekArchive)) return {ok:false,error:"повреждён архив недель"};

 if(!isObj(c.period)||!c.period.start||!c.period.end) return {ok:false,error:"не задан период"};

  if(!Array.isArray(g.metrics)||!allObj(g.metrics)) return {ok:false,error:`повреждены метрики цели «${g.name||g.id||"без имени"}»`};

/* ——— движется ли результат в нужную сторону ———
   Возвращает {enough, moved, note}. Сравниваются только сопоставимые точки:
   для текущего состояния — окно около 3–4 недель, для накопления — темп внутри периода
   или завершённые периоды, для значения периода — последние сопоставимые периоды. */
function resultMovement(g){
 const rs=(g.results||[]).filter(r=>r.status==="active");
 if(!rs.length) return {enough:false,moved:false,note:"показатель результата не задан"};
 const r=rs.find(x=>x.primary)||rs[0];
 const e=rEntries(r.id);
 if(r.type==="current_state"){
  if(e.length<2) return {enough:false,moved:false,note:"мало точек для сравнения"};
  const lastD=e[e.length-1].date;
  const older=e.filter(x=>daysBetween(x.date,lastD)>=18);
  const base=older.length?older[older.length-1]:e[0];
  const span=daysBetween(base.date,lastD);
  if(span<18) return {enough:false,moved:false,note:"наблюдений меньше трёх недель"};
  const gain=rGain(r,Number(base.value),Number(e[e.length-1].value));
  const scale=Math.max(1,Math.abs(Number(r.target)-Number(r.baseline)));
  return {enough:true,moved:gain>scale*0.03,note:`${nfmt(base.value)} → ${nfmt(e[e.length-1].value)} за ${Math.round(span/7)} нед.`,gain,r};
 }
 if(r.type==="cumulative_period"){
  const bs=rBuckets(r), cur=bucketOf(r,today());
  const done=bs.filter(b=>b!==cur);
  if(done.length>=2){
   const a=rBucketValue(r,done[done.length-2]), b=rBucketValue(r,done[done.length-1]);
   const gain=rGain(r,a,b);
   return {enough:true,moved:gain>Math.max(1,Math.abs(a||0)*0.05),note:`${bucketLabel(r,done[done.length-2])}: ${nfmt(a)} → ${bucketLabel(r,done[done.length-1])}: ${nfmt(b)}`,gain,r};
  }
  const inB=e.filter(x=>eBucket(r,x)===cur);
  if(inB.length<2) return {enough:false,moved:false,note:"внутри периода мало проверок"};
  const m=monthMeta(); let share=1;
  if(m){ const total=daysBetween(m.start,m.end)+1, gone=Math.max(1,daysBetween(m.start,today())+1); share=gone/total; }
  const v=Number(inB[inB.length-1].value), need=(Number(r.target)||0)*share*0.6;
  return {enough:true,moved:v>=need,note:`внутри периода накоплено ${nfmt(v)} при ориентире ${nfmt(Math.round(need))}`,r};
 }
 const bs=rBuckets(r);
 if(bs.length<2) return {enough:false,moved:false,note:"мало завершённых периодов"};
 const a=rBucketValue(r,bs[bs.length-2]), b=rBucketValue(r,bs[bs.length-1]);
 const gain=rGain(r,a,b);
 return {enough:true,moved:gain>Math.max(0.0001,Math.abs(a||0)*0.03),note:`${bucketLabel(r,bs[bs.length-2])}: ${nfmt(a)} → ${bucketLabel(r,bs[bs.length-1])}: ${nfmt(b)}`,gain,r};
}
/* подсказка «дело может быть не в дисциплине» — только на реальных данных */
function needsHypothesis(g){ return hypothesisSignal(g).show; }
function hypothesisSignal(g){
 const off={show:false,thin:false,note:""};
 if(g.status!=="active"||g.type!=="result"||!g.metrics.length) return off;
 const weeks=daysBetween(g.startedAt||S.period.start,today())/7;
 if(weeks<4) return off;
 const a=actionPct(g), e=goalExpectedPct(g);
 if(a<30) return off;                        // действий сделано слишком мало, чтобы судить о стратегии
 if(a<e-10) return off;                      // темп действий отстаёт — вопрос не к стратегии
 const mv=resultMovement(g);
 if(!mv.enough) return {show:false,thin:true,note:"Пока мало данных, чтобы судить о стратегии: "+mv.note};
 if(mv.moved) return off;
 return {show:true,thin:false,note:mv.note};
}

   Источник истины — журнал: события вида "result". Текущее значение нигде не дублируется. */
const RTYPE={current_state:"📍 Есть число прямо сейчас",cumulative_period:"📈 Накапливается за период",period_value:"📊 Считается за каждый период"};

/* ровное распределение общего плана по месяцам без потери остатка */
/* объект плана по месяцам текущего состояния: metric() раскладывает массив по демо-месяцам, здесь чиним адресно */
function planFor(total,months){
 const ms=months||S.months||[], arr=spreadPlan(total,ms), o={};
 ms.forEach((m,i)=>o[m.id]=arr[i]||0);
 return o;
}
function spreadPlan(total,months){
 const n2=(months||S.months).length, t=Math.max(0,Math.round(Number(total)||0));
 if(!n2) return [];
 const base=Math.floor(t/n2), rest=t-base*n2;
 return (months||S.months).map((x,i)=>base+(i<rest?1:0));
}
/* ═══ минуты показываем по-человечески; в данных всё остаётся минутами ═══ */
const isMinUnit=u=>/^мин(\.|ута|уты|ут)?$/i.test(String(u==null?"":u).trim());
function formatMinutes(v){
 const raw=Number(v);
 if(!isFinite(raw)) return "0 мин";
 const neg=raw<0, t=Math.round(Math.abs(raw));
 const h=Math.floor(t/60), m=t%60;
 const body=h&&m?`${nfmt(h)} ч ${m} мин`:h?`${nfmt(h)} ч`:`${m} мин`;
 return (neg?"−":"")+body;
}
/* значение метрики действий: время — по-человечески, всё остальное — как раньше */
const aFmt=(v,unit)=>isMinUnit(unit)?formatMinutes(v):nfmt(v);
/* единица недельной задачи — из связанной метрики, в архиве из снимка */
function taskUnit(t){

 if(t.metricUnit) return t.metricUnit;
 const g=t.goalId?goalOf(t.goalId):null;
 const m=g&&t.metricId?(g.metrics||[]).find(x=>x.id===t.metricId):null;
 return m?(m.unit||""):"";
}
/* значение с единицей, чтобы в компактных местах не оставалось голое число */
const aFmtU=(v,unit)=>isMinUnit(unit)?formatMinutes(v):(nfmt(v)+(unit?" "+unit:""));
/* точное значение с единицей: ритм и лёгкая версия не округляются до «15 тыс» */
const uFmt=(v,unit)=>isMinUnit(unit)?formatMinutes(v):(vfmt(v)+(unit?" "+unit:""));
function resultMetric(o){
 return Object.assign({id:"rm_"+uid(),name:"Результат",emoji:"🎯",unit:"",type:"current_state",
  successRule:"higher_better",baseline:0,target:0,rangeMin:0,rangeMax:0,
  accumulationPeriod:"month",checkFrequency:"weekly",status:"active",primary:false},o||{});
}
const allResults=()=>S.goals.reduce((a,g)=>a.concat((g.results||[]).map(r=>({g,r}))),[]);
function resultOf(id){ for(const g of S.goals){ const r=(g.results||[]).find(x=>x.id===id); if(r) return {g,r}; } return null; }
/* ——— ключ периода накопления ——— */
function bucketOf(rm,date){
 date=date||today();
 if(rm.type==="current_state") return "";
 const per=rm.accumulationPeriod||"month";
 if(per==="week") return "w:"+mondayOf(date);
 if(per==="goal_period") return "p:"+S.period.start;
 const m=(S.months||[]).find(x=>date>=x.start&&date<=x.end);
 return "m:"+(m?m.id:date.slice(0,7));
}
function bucketLabel(rm,key){
 if(!key) return "";
 if(key.startsWith("w:")) return weekLabel(key.slice(2));
 if(key.startsWith("p:")) return "весь период";
 const id=key.slice(2), m=(S.months||[]).find(x=>x.id===id);
 return m?m.label:id;
}
/* ——— записи результата ——— */
const rEntriesAll=rmId=>S.journal.filter(e=>e.kind==="result"&&!e.cancelled&&e.resultId===rmId)
 .slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.seq||0)-(b.seq||0));
const rEntries=rmId=>rEntriesAll(rmId).filter(e=>e.date<=today());
const eBucket=(rm,e)=>bucketOf(rm,e.date);
function rAdd(g,rm,value,date,src,note){
 date=date||today();
 /* записали значение за месяц — пропуск именно этого месяца снимается, остальные остаются */
 const mo=S.months.find(x=>x.start<=date&&date<=x.end);
 if(mo) mUnskip(rm.id,mo.id);
 const ev=jAdd({kind:"result",date,goalId:g.id,resultId:rm.id,value:Number(value),
  unit:rm.unit||"",bucket:bucketOf(rm,date),sourceType:src||"manual",note:note||"",
  seq:S.journal.length,title:`${rm.name}: ${vfmt(value)}${rm.unit?" "+rm.unit:""}`,
  goalName:g.name,goalEmoji:g.emoji,metricName:rm.name});
 refreshAutoDone(g,false);      // само по себе значение цель не закрывает, но откатывает авто-завершение
 return ev;
}
/* показатель, по которому нельзя судить о всей цели: один удачный период — ещё не результат всего периода */
const isPeriodicResult=r=>r&&(r.type==="cumulative_period"||r.type==="period_value");
/* ЕДИНСТВЕННЫЙ источник истины о завершении цели по результату.
   allowSet===false — только откат авто-завершения, ставить «достигнута» нельзя.
   Ручное завершение (completionMode==="manual") не трогаем никогда. */
function refreshAutoDone(g,allowSet){
 if(!g||g.type==="project") return;
 const act=(g.results||[]).filter(r=>r.status==="active");
 if(!act.length) return;
 /* цель целиком закрывается только по показателям «прямо сейчас».
    Накопление за период и значение за период говорят об одном периоде, а не обо всей цели. */
 if(act.some(isPeriodicResult)){
  if(g.status==="done"&&g.completionMode==="auto"){ g.status="active"; g.completionMode=""; }
  return;
 }
 const reached=act.every(r=>rReached(r));
 if(reached){ if(allowSet!==false&&g.status==="active"){ g.status="done"; g.completionMode="auto"; } }
 else if(g.status==="done"&&g.completionMode!=="manual"){ g.status="active"; g.completionMode=""; }   // авто-завершение откатывается
}
/* текущее значение: последняя запись в актуальном ведре */
function rCurrent(rm){
 const e=rEntries(rm.id);
 if(!e.length) return null;
 if(rm.type==="current_state") return Number(e[e.length-1].value);
 const b=bucketOf(rm,today());
 const inB=e.filter(x=>eBucket(rm,x)===b);
 if(inB.length) return Number(inB[inB.length-1].value);
 return rm.type==="cumulative_period"?0:null;      // новый период накопления начинается с нуля
}
/* значение завершённого ведра */
function rBucketValue(rm,key){
 const e=rEntries(rm.id).filter(x=>eBucket(rm,x)===key);
 return e.length?Number(e[e.length-1].value):null;
}
function rBuckets(rm){
 const seen=[]; rEntries(rm.id).forEach(e=>{ const b=eBucket(rm,e); if(b&&!seen.includes(b)) seen.push(b); }); return seen;
}
/* прогресс показателя с учётом правила успеха */
function rPct(rm){
 const cur=rCurrent(rm); if(cur==null) return 0;
 const base=Number(rm.baseline)||0;
 if(rm.successRule==="range"){
  const lo=Number(rm.rangeMin)||0, hi=Number(rm.rangeMax)||0;
  if(cur>=lo&&cur<=hi) return 100;
  if(cur<lo){ const span=Math.abs(lo-base)||Math.max(1,Math.abs(hi-lo));
   return clamp(Math.round((1-Math.abs(lo-cur)/span)*100),0,99); }
  const span=Math.max(1,Math.abs(hi-lo))*2;
  return clamp(Math.round((1-(cur-hi)/span)*100),0,99);
 }
 if(rm.successRule==="target_value"){
  const t=Number(rm.target)||0, span=Math.abs(base-t)||Math.max(1,Math.abs(t)*0.1);
  const dist=Math.abs(cur-t);
  if(dist<=rTolerance(rm)) return 100;
  return clamp(Math.round((1-dist/span)*100),0,99);
 }
 return pctOf(cur,base,Number(rm.target)||0);
}
/* точный процент показателя без округления до целого */
function rPctExact(rm){
 const cur=rCurrent(rm); if(cur==null) return 0;
 const base=Number(rm.baseline)||0;
 if(rm.successRule==="range"||rm.successRule==="target_value") return rPct(rm);
 const t=Number(rm.target)||0, d=t-base;
 if(!d) return cur>=t?100:0;
 return clamp((cur-base)/d*100,0,100);
}
/* 0% · 0,1% · 7% · 100% */
function pctText(x){
 const v=Number(x)||0;
 if(v<=0) return "0%";
 if(v>=100) return "100%";
 if(v<1) return (Math.round(v*10)/10).toLocaleString("ru-RU",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
 return Math.round(v)+"%";
}
/* подпись показателя: не повторяем название цели */
function rLabel(g,r){ return (String(r.name||"").trim()===String(g.name||"").trim())?"Результат":r.name; }
/* смысл текущего значения */
function rMeaning(r){
 if(r.type==="cumulative_period") return `с начала периода «${bucketLabel(r,bucketOf(r,today()))}»`;
 if(r.type==="period_value") return `за «${bucketLabel(r,bucketOf(r,today()))}»`;

}

 return e.length?`Последняя проверка: ${dfull(e[e.length-1].date).replace(" "+e[e.length-1].date.slice(0,4),"")}`:"Результат ещё не записывался";

/* компактная дельта: число крупно, пояснение мелко */
function rDeltaBlock(r){
 const d=rDelta(r); if(!d) return "";
 const gain=rGain(r,d.from,d.to), diff=d.to-d.from;
 if(!diff) return `<div class="small" style="margin-top:6px">без изменений ${esc(d.label)}</div>`;
 const unit=(r.type==="period_value"&&(r.unit||"").trim()==="%")?"п.п.":(r.unit||"");
 return `<div style="margin-top:8px">
  <span style="font-size:16px;font-weight:600;color:${gain>0?"var(--ok)":"var(--warn)"}">${gain>0?"↗":"↘"} ${diff>0?"+":"−"}${vfmt(Math.abs(diff))}${unit?" "+esc(unit):""}</span>
  <div class="small">${esc(d.label)}</div></div>`;
}
function rTolerance(rm){
 const t=Math.abs(Number(rm.target)||0), span=Math.abs((Number(rm.baseline)||0)-(Number(rm.target)||0));
 return Math.max(t*0.02,span*0.02,0.001);
}
/* достигнут ли показатель */
function rReached(rm){
 const cur=rCurrent(rm); if(cur==null) return false;
 const t=Number(rm.target)||0;
 if(rm.successRule==="higher_better") return cur>=t;
 if(rm.successRule==="lower_better") return cur<=t;
 if(rm.successRule==="range") return cur>=(Number(rm.rangeMin)||0)&&cur<=(Number(rm.rangeMax)||0);
 return Math.abs(cur-t)<=rTolerance(rm);
}
/* изменение в желаемую сторону: положительное — «стало лучше» */
function rGain(rm,from,to){
 if(from==null||to==null) return null;
 const d=to-from;
 return rm.successRule==="lower_better"?-d:d;
}
/* дельта для показа: за последние две сопоставимые точки */
function rDelta(rm){
 if(rm.type==="current_state"){
  const e=rEntries(rm.id); if(e.length<2) return null;
  return {from:Number(e[e.length-2].value),to:Number(e[e.length-1].value),label:"с прошлой проверки"};
 }
 const bs=rBuckets(rm);
 if(rm.type==="cumulative_period"){
  const cb=bucketOf(rm,today());
  const inB=rEntries(rm.id).filter(x=>eBucket(rm,x)===cb);
  if(inB.length>=2) return {from:Number(inB[inB.length-2].value),to:Number(inB[inB.length-1].value),label:"с прошлой проверки"};
  return null;
 }
 if(bs.length<2) return null;
 return {from:rBucketValue(rm,bs[bs.length-2]),to:rBucketValue(rm,bs[bs.length-1]),
  label:"к периоду «"+bucketLabel(rm,bs[bs.length-2])+"»"};
}
/* пора ли проверять */
/* нужен ли показатель за конкретный (закрываемый) месяц */
/* пропущена ли проверка показателя именно в этом месяце */
function mSkipped(rid,monthId){
 const v=(S.skippedM||{})[rid];
 if(!v||!monthId) return false;
 return typeof v==="string"?v===monthId:!!v[monthId];
}
function mSkip(rid,monthId){
 S.skippedM=S.skippedM||{};
 const v=S.skippedM[rid];
 if(!v||typeof v==="string") S.skippedM[rid]=(typeof v==="string"&&v)?{[v]:true}:{};
 S.skippedM[rid][monthId]=true;
}
function mUnskip(rid,monthId){
 const v=(S.skippedM||{})[rid]; if(!v||!monthId) return;
 if(typeof v==="string"){ if(v===monthId) S.skippedM[rid]={}; return; }
 delete v[monthId];
}
function rDueForMonth(rm,monthId){
 if(rm.status!=="active"||rm.checkFrequency==="manual") return false;
 if(mSkipped(rm.id,monthId)) return false;
 const m=S.months.find(x=>x.id===monthId); if(!m) return false;
 return !rEntries(rm.id).some(e=>e.date>=m.start&&e.date<=m.end);
}
function rDue(rm){
 if(rm.status!=="active"||rm.checkFrequency==="manual") return false;
 if(S.skipped&&S.skipped[rm.id]===mondayOf(today())&&rm.checkFrequency==="weekly") return false;
 if(rm.checkFrequency==="monthly"&&mSkipped(rm.id,curMonthId())) return false;
 const e=rEntries(rm.id); if(!e.length) return true;
 const last=e[e.length-1].date;
 if(rm.checkFrequency==="weekly") return last<mondayOf(today());

}

/* ——— источники недельных задач: пункт месяца и этап проекта ——— */
function taskSource(t){ return t&&t.source&&t.source.kind?t.source:{kind:"manual"}; }
function closeSource(t,done){
 const src=taskSource(t);
 if(!done&&src.id&&S.week.tasks.some(x=>x.id!==t.id&&x.done&&taskSource(x).kind===src.kind&&taskSource(x).id===src.id)) return;
 if(src.kind==="monthStep"){
  const md=S.monthData[src.monthId]; if(!md) return;
  const st=md.steps.find(x=>x.id===src.id); if(!st) return;
  st.done=!!done;
 }else if(src.kind==="milestone"){
  const g=goalOf(src.goalId||t.goalId); if(!g) return;
  const ms=g.milestones.find(x=>x.id===src.id); if(!ms) return;
  ms.done=!!done;
  if(g.milestones.length&&g.milestones.every(x=>x.done)) g.status="done";
  else if(g.status==="done") g.status="active";
 }
}
/* источник уже взят в работу живой недельной задачей? */
const isDeclined=(kind,id)=>!!(S.declined&&S.declined[kind+"|"+id]);
function undecline(kind,id){ if(S.declined) delete S.declined[kind+"|"+id]; }
function sourceBusy(kind,id){ return S.week.tasks.some(t=>{const s2=taskSource(t);return s2.kind===kind&&s2.id===id&&!t.done;}); }
function sourceDone(kind,id){ return S.week.tasks.some(t=>{const s2=taskSource(t);return s2.kind===kind&&s2.id===id&&t.done;}); }

/* ——— календарь: приложение само знает дату ——— */

/* месяцы генерируются из периода: блок начинается в тот же день месяца, что и старт */
/* месяцы = настоящие календарные месяцы; первый и последний могут быть частичными */
/* «в августе», «в сентябре» — для подписи выполнения за конкретный месяц */
const MPREP=["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];
function monthIn(m){

function buildMonths(start,end){

 const out=[]; let cur=start, i=0;
 while(cur<=end&&i<120){
  const d=D(cur), y=d.getFullYear(), mo=d.getMonth();
  const monthEnd=iso(new Date(y,mo+1,0));            // последний день этого календарного месяца
  const last=monthEnd>end?end:monthEnd;
  const partial=(d.getDate()!==1)||(last!==monthEnd);
  out.push({id:"m_"+y+String(mo+1).padStart(2,"0"),
   label:partial?`${+cur.split("-")[2]}–${+last.split("-")[2]} ${MGEN[mo]} ${y}`:`${MFULL[mo]} ${y}`,
   short:MSHORT[mo],start:cur,end:last});
  cur=addDays(last,1); i++;
 }
 return out;
}
/* что произойдёт при смене периода: какие месяцы выпадают, сколько планов и фактов затронуто */
function periodImpact(newStart,newEnd){

 const lost=[]; let lostPlan=0;
 S.months.forEach(om=>{
  const keep=fresh.some(x=>om.start>=x.start&&om.start<=x.end)||fresh.some(x=>x.start>=om.start&&x.start<=om.end);
  if(keep) return;
  let pl=0; S.goals.forEach(g=>g.metrics.forEach(m=>pl+=Number(m.plan[om.id])||0));
  const steps=(S.monthData[om.id]||{steps:[]}).steps.length;
  lost.push({label:om.label,plan:pl,steps}); lostPlan+=pl;
 });
 const outside=S.journal.filter(e=>e.kind==="fact"&&!e.cancelled&&!(e.date>=newStart&&e.date<=newEnd));

}
/* перестройка месяцев с сохранением планов: план переносится в месяц, который содержит старую дату старта */
function rebuildMonths(newStart,newEnd){
 const oldMonths=S.months.slice();
 const fresh=buildMonths(newStart,newEnd);
 const map={};
 oldMonths.forEach(om=>{ const nm=fresh.find(x=>om.start>=x.start&&om.start<=x.end)||fresh.find(x=>x.start>=om.start&&x.start<=om.end); if(nm) map[om.id]=nm.id; });
 const newData={};
 fresh.forEach(m=>newData[m.id]={theme:"",outcome:"",review:"",steps:[]});
 oldMonths.forEach(om=>{ const to=map[om.id]; const od=S.monthData[om.id]; if(!to||!od) return;
  const nd=newData[to];
  nd.theme=nd.theme||od.theme; nd.outcome=nd.outcome||od.outcome; nd.review=nd.review||od.review;
  nd.steps=nd.steps.concat(od.steps||[]); });
 S.goals.forEach(g=>g.metrics.forEach(m=>{
  const np={}; fresh.forEach(x=>np[x.id]=0);
  oldMonths.forEach(om=>{ const to=map[om.id]; if(to) np[to]=(np[to]||0)+(Number(m.plan[om.id])||0); });
  m.plan=np; }));
 S.journal.forEach(e=>{ const byDate=fresh.find(x=>e.date>=x.start&&e.date<=x.end);
  e.monthId = byDate ? byDate.id : (map[e.monthId] && fresh.some(x=>x.id===map[e.monthId]) && !e.date ? map[e.monthId] : ""); }); jTouch();
 Object.keys(S.monthReviews||{}).forEach(k=>{ if(map[k]&&map[k]!==k){ S.monthReviews[map[k]]=S.monthReviews[k]; delete S.monthReviews[k]; } });
 S.months=fresh; S.monthData=newData;
 S.period={start:newStart,end:newEnd};
 jTouch();
 if(map[S.lastSeenMonth]) S.lastSeenMonth=map[S.lastSeenMonth];
 if(!S.months.some(m=>m.id===S.lastSeenMonth)) S.lastSeenMonth=curMonthId();
 S.monthQueue=(S.monthQueue||[]).map(x=>map[x]||x).filter(x=>S.months.some(m=>m.id===x));

}
function monthMeta(id){ return S.months.find(m=>m.id===(id||curMonthId())); }
function daysLeftInMonth(){ const m=monthMeta(); return Math.max(0,daysBetween(today(),m.end)+1); }
function weeksLeftInMonth(){ return Math.max(1,daysLeftInMonth()/7); }
function weeksInMonth(id){ const m=monthMeta(id); return Math.max(1,(daysBetween(m.start,m.end)+1)/7); }
/* обычный недельный темп по метрике в текущем месяце */
function weekPace(m,mid){ mid=mid||curMonthId(); return (Number(m.plan[mid])||0)/weeksInMonth(mid); }
const leftInMonth=(m,mid)=>Math.max(0,(Number(m.plan[mid])||0)-fMonth(m,mid));
/* сколько предложить на неделю: без «долга», не выше ~125% обычного темпа */
function suggestQty(m,mid,catchUp){
 mid=mid||curMonthId();
 const left=leftInMonth(m,mid);
 if(left<=0) return 0;
 const even=Math.ceil(left/weeksLeftInMonth());
 const pace=weekPace(m,mid);
 if(catchUp) return even;
 const cap=Math.max(1,Math.round(pace*1.25));
 return Math.max(1,Math.min(even,cap));
}
/* план месяца стал нереалистичным? */
function monthStrain(){
 const mid=curMonthId(); const hard=[];
 S.goals.filter(g=>g.status==="active").forEach(g=>g.metrics.forEach(m=>{
  const left=leftInMonth(m,mid);
  if(left<=0) return;
  const even=left/weeksLeftInMonth(), pace=weekPace(m,mid);
  if(pace>0&&even>pace*1.4) hard.push({g,m,even:Math.ceil(even),pace:Math.round(pace*10)/10,left});
 }));
 return hard;
}
/* сколько предложить по регулярной метрике: базовый ритм, без долга */
const metricPlanned=m=>S.months.some(x=>(Number(m.plan[x.id])||0)>0);
function regularQty(m,mid,catchUp){
 mid=mid||curMonthId();
 const base=Math.max(1,Number(m.perWeek)||1);
 const plan=Number(m.plan[mid])||0, left=leftInMonth(m,mid);
 if(plan<=0) return metricPlanned(m)?-1:base;   // −1: в этом месяце метрика не запланирована
 if(left<=0) return 0;                           // план месяца закрыт — объём не выдумываем
 let q=Math.min(base,left);                      // остаток меньше ритма — берём остаток
 if(catchUp) q=Math.max(q,Math.min(Math.ceil(left/weeksLeftInMonth()),Math.round(base*1.5)));
 return q;
}
/* предложение плана недели: регулярное + месячный план + шаги.
   Ограничения: не больше LIMITS.plan позиций из месячного плана и LIMITS.step шагов,
   чтобы автоматика не создавала перегруз. */
const LIMITS={plan:3,step:2,week:9};
function suggestWeek(catchUp,easy){
 if(periodState()!=="active") return [];
 const mid=curMonthId(), reg=[], planned=[], steps=[];
 const act=S.goals.filter(g=>g.status==="active");
 act.forEach(g=>g.metrics.forEach(m=>{
  const pl=Number(m.plan[mid])||0, left=leftInMonth(m,mid);
  const base={goalId:g.id,metricId:m.id,emoji:m.emoji||g.emoji,title:m.name,unit:m.unit||"",
   goalName:g.name,gemoji:g.emoji,left,prio:g.priority,
   kind:(m.valueType==="volume"?"volume":"count"),source:{kind:"metric",id:m.id,goalId:g.id}};
  if(m.regular){
   let q=regularQty(m,mid,catchUp);
   if(easy&&q>0&&Number(m.easyWeek)>0) q=Math.min(q,Number(m.easyWeek));
   if(q>0) reg.push({...base,group:"reg",planned:q,per:Math.max(1,Number(m.perWeek)||1),easyWeek:m.easyWeek||0});
   else if(q===0) reg.push({...base,group:"reg",planned:0,per:Math.max(1,Number(m.perWeek)||1),full:true});
  }else{
   const q=suggestQty(m,mid,catchUp);
   if(q>0) planned.push({...base,group:"plan",planned:q});
  }
 }));
 /* ближайшие этапы проектов — те, что ещё не взяты в работу */
 act.filter(g=>g.type==="project").forEach(g=>{
  g.milestones.filter(ms=>!ms.done&&!isDeclined("milestone",ms.id)&&!sourceBusy("milestone",ms.id)&&!sourceDone("milestone",ms.id)).slice(0,2)
   .forEach(ms=>steps.push({goalId:g.id,metricId:"",emoji:"✅",title:ms.title,goalName:g.name,gemoji:g.emoji,
    planned:1,kind:"binary",group:"step",prio:g.priority,imp:true,source:{kind:"milestone",id:ms.id,goalId:g.id}}));
 });
 /* невыполненные пункты плана месяца — тоже без повторов */
 (S.monthData[mid]?S.monthData[mid].steps:[]).filter(x=>!x.done&&!isDeclined("monthStep",x.id)&&!sourceBusy("monthStep",x.id)&&!sourceDone("monthStep",x.id)).forEach(x=>{
  const g=goalOf(x.goalId);
  if(g&&g.status!=="active") return;                 // цель на паузе или завершена — пункт не предлагаем
  steps.push({goalId:x.goalId,metricId:"",emoji:x.challenge?"🔥":"📝",title:x.title,goalName:g?g.name:"",gemoji:g?g.emoji:"📝",

 });
 planned.sort((a,b)=>(b.prio-a.prio)||(b.left-a.left));
 steps.sort((a,b)=>((b.challenge?1:0)-(a.challenge?1:0))||(b.prio-a.prio));
 /* отмечаем галочкой только разумный минимум */
 reg.forEach(x=>x.pick=!x.full);
 planned.forEach((x,i)=>x.pick=i<(easy?1:LIMITS.plan));

 for(let i=planned.length-1;i>=0&&picked>cap;i--){ if(planned[i].pick){planned[i].pick=false;picked--;} }
 return all;
}
/* проверка календаря при открытии */
function checkPeriods(){
 const st=periodState();

 S.monthQueue=S.monthQueue||[];
 if(!S.lastSeenMonth) S.lastSeenMonth=cm;
 else if(S.lastSeenMonth!==cm){
  const from=S.months.findIndex(m=>m.id===S.lastSeenMonth), to=S.months.findIndex(m=>m.id===cm);
  if(from>=0&&to>from){ for(let i=from;i<to;i++){ const id=S.months[i].id;
    const rv=S.monthReviews[id];
    if(rv&&(rv.status==="done"||rv.status==="skipped")) continue;
    if(!S.monthQueue.includes(id)) S.monthQueue.push(id); } }
  else if(from<0) S.lastSeenMonth=cm;
 }
 /* период закончился — последний месяц тоже нужно разобрать: он не сменится на следующий */
 if(st==="finished"&&S.months.length){
  const last=S.months[S.months.length-1].id, rv=S.monthReviews[last];
  if(!(rv&&(rv.status==="done"||rv.status==="skipped"))&&!S.monthQueue.includes(last)) S.monthQueue.push(last);
 }
 S.monthQueue=S.monthQueue.filter(id=>{ const rv=S.monthReviews[id]; return !(rv&&(rv.status==="done"||rv.status==="skipped")); });

 S.newWeekPending = (st==="active") && nowW!==myW;
 S.missedWeeks = (st==="active"&&nowW>myW) ? Math.max(0,Math.round(daysBetween(myW,nowW)/7)-1) : 0;
}

/* сколько действий человек реально довёл до конца: задача недели = одно действие, каким бы ни был объём */
function completedActionCount(){
 const ids=new Set();
 (S.week.tasks||[]).forEach(t=>{ if(t&&t.done&&t.id) ids.add(t.id); });
 (S.weekArchive||[]).forEach(w=>(w.tasks||[]).forEach(t=>{ if(t&&t.done&&t.id) ids.add(t.id); }));
 /* ручные записи «Записать сделанное» — по одному действию за запись, независимо от количества */
 const manual=new Set();
 (S.journal||[]).forEach(e=>{
  if(!e||e.cancelled) return;
  if(e.kind==="result") return;                       // измерения результата — не действия
  if(e.sourceType!=="manual") return;                 // факты задач уже посчитаны по самим задачам

 });

/* ═══════════ выполнение недели и месяца: единый расчёт ═══════════ */
/* каждая задача — отдельное обязательство; разные единицы никогда не складываются */
function taskCompletion(t){
 if(!t) return null;
 if(t.type==="binary") return t.done?100:0;
 const p=Number(t.planned)||0; if(!(p>0)) return null;
 return Math.min(100,(Number(t.completed)||0)/p*100);
}
function weekCompletion(tasks){
 const v=(tasks||[]).map(taskCompletion).filter(x=>x!=null);
 return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0;
}
function weekGoalCompletion(tasks,goalId){
 return weekCompletion((tasks||[]).filter(t=>(t.goalId||"none")===(goalId||"none")));
}
/* понятная сводка недели для записи в итоги: проценты и счёт задач, без сложения разных единиц */
function weekSummary(tasks){
 const c=weekTaskCounts(tasks);
 return {completionPct:weekCompletion(tasks),tasksTotal:c.total,tasksDone:c.full,tasksPartial:c.part};
}
/* сколько задач закрыто целиком и сколько частично */
function weekTaskCounts(tasks){
 const list=(tasks||[]).filter(t=>taskCompletion(t)!=null);
 const full=list.filter(t=>taskCompletion(t)>=100).length;
 const part=list.filter(t=>{const c=taskCompletion(t);return c>0&&c<100;}).length;
 return {full,part,total:list.length};
}
/* выполнение плана действий за конкретный месяц — среднее процентов по метрикам */
function monthActionPct(g,mid){
 const v=[];
 (g.metrics||[]).forEach(m=>{const p=Number((m.plan||{})[mid])||0; if(p>0) v.push(Math.min(100,fMonth(m,mid)/p*100));});
 return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;
}

      else { const a=before?before:inM[0], b2=inM[inM.length-1], diff=Number(b2.value)-Number(a.value), gain=rGain(r,Number(a.value),Number(b2.value));
       resLines=[`🎯 Результат: ${vfmt(a.value)} → ${vfmt(b2.value)}${r.unit?" "+esc(r.unit):""}`,

     } else {
      const v=rBucketValue(r,"m:"+sel), pv=prev?rBucketValue(r,"m:"+prev.id):null;
      if(v==null) resLines=[`🎯 ${esc(rLabel(g,r))} ${esc(mm2.short.toLowerCase())}: данных нет`];
      else { resLines=[`🎯 ${esc(rLabel(g,r))} ${esc(mm2.short.toLowerCase())}: ${vfmt(v)}${r.unit?" "+esc(r.unit):""}`];
       if(pv!=null) resLines.push(`${esc(prev.short.toLowerCase())} ${vfmt(pv)} → ${vfmt(v)} · ${rGain(r,pv,v)>0?"↗":"↘"} ${(v-pv)>0?"+":"−"}${vfmt(Math.abs(v-pv))}${r.unit==="%"?" п.п.":""}`); }
     }
    }
    return `<div style="padding:12px 0;border-top:1px solid var(--line)">
     <div style="font-size:15.5px">${g.emoji} ${esc(g.name)}</div>
     ${hasActions?`<div class="small" style="margin-top:6px">${ap==null
        ?`⚡ На этот месяц отдельный план действий не задан`
        :`⚡ Выполнение действий в ${esc(monthIn(mm2))}: ${ap}%`}</div>`:""}
     <div class="small" style="margin-top:4px">${resLines[0]}</div>
     ${resLines.slice(1).map(x=>`<div class="small" style="color:var(--ink3)">${x}</div>`).join("")}
    </div>`;
   }).join("");
   return rowsC?`<div class="card"><div class="h-sec">🔗 Действия и результат</div>
    <div class="sub">Смотрим рядом: насколько выполнялся план действий и как менялся результат. Это не значит, что одно обязательно вызвало другое.</div>${rowsC}</div>`:"";
 })()}
 ${steps.length?`<div class="card">

/* полный снимок недели: задачи со всеми полями + названия целей и метрик на момент закрытия */
function archiveWeek(){
 const st=mondayOf(S.week.start);
 const snap={start:st,end:addDays(st,6),focus:S.week.focus||"",challenge:S.week.challenge||"",
  mode:S.week.mode||"normal",status:"done",
  tasks:S.week.tasks.map(x=>{
   const g=goalOf(x.goalId), m=g&&x.metricId?g.metrics.find(y=>y.id===x.metricId):null;
   return Object.assign(JSON.parse(JSON.stringify(x)),{
    goalName:g?g.name:"", goalEmoji:g?g.emoji:"", metricName:m?m.name:"", metricUnit:m?(m.unit||""):"",
    status:x.done?"done":(x.completed>0?"partial":"open")});}),
  review:Object.assign({a1:"",a2:"",a3:""},S.week.review||{})};
 const rv=snap.review;
 snap.reviewStatus=(rv.a1||rv.a2||rv.a3)?"done":"pending";
 const i=S.weekArchive.findIndex(w=>w.start===st);
 if(i>=0) S.weekArchive[i]=Object.assign({},S.weekArchive[i],snap);   // одна запись на одну неделю
 else S.weekArchive.push(Object.assign({id:uid()},snap));
}
/* сохранённое выполненное + новый план: одна задача с одним id остаётся один раз */
function mergeWeekTasks(kept,fresh){
 const out=kept.slice(), seen={};
 out.forEach(t=>{ if(t&&t.id) seen[t.id]=1; });
 (fresh||[]).forEach(t=>{ if(!t) return; if(t.id&&seen[t.id]) return; if(t.id) seen[t.id]=1; out.push(t); });
 return out;
}
/* пропущенные недели сохраняются, а не исчезают */
function fillSkippedWeeks(fromMonday,toMonday){
 let w=addDays(fromMonday,7);

function collectWeek(sug){
 const carried=[], dropped=[];
 document.querySelectorAll(".lf").forEach(sel=>{
  const t=S.week.tasks.find(x=>x.id===sel.dataset.id); if(!t) return;
  if(sel.value==="move"){
   /* переносится только остаток: сделанное уже записано в журнал и факт метрики */
   const left=(t.type==="binary")?1:Math.max(1,(Number(t.planned)||1)-(Number(t.completed)||0));
   carried.push({...t,id:uid(),done:false,completed:0,planned:left,xpGiven:false,carried:(t.carried||0)+1});
  }
  else if(sel.value==="old") dropped.push(t);
 });
 const picked=[];
 document.querySelectorAll(".sg:checked").forEach(c=>{
  const s=sug[+c.dataset.i]; if(!s) return;
  const qEl=document.querySelector('.sq[data-i="'+c.dataset.i+'"]');
  const q=s.kind==="binary"?1:Math.max(1,Number(qEl?qEl.value:s.planned)||s.planned||1);
  picked.push({id:uid(),goalId:s.goalId,metricId:s.metricId||"",title:s.title,
   type:s.kind==="binary"?"binary":(s.kind==="volume"?"volume":"count"),
   planned:q,completed:0,done:false,imp:!!s.imp,challenge:!!s.challenge,
   easy:s.group==="reg"&&s.easyWeek?`Лёгкая версия: ${uFmt(s.easyWeek,s.unit)}`:"",day:"",note:"",carried:0,reason:"",reasons:[],
   xpGiven:false,source:s.source||{kind:"manual"}});

function aiTimeContext(){

 const st=periodState();
 const L=["ВРЕМЕННОЙ КОНТЕКСТ (данные приложения, считай их точными):",

  `Текущая календарная неделя: ${weekLabel(cw)} (начинается ${cw}).`,
  `Следующая календарная неделя: ${weekLabel(nw)} (начинается ${nw}).`];
 if(st==="before") L.push(`Период Life Planner: ${dfull(S.period.start)} — ${dfull(S.period.end)}. Период ещё НЕ начался.`);
 else if(st==="finished") L.push(`Период Life Planner: ${dfull(S.period.start)} — ${dfull(S.period.end)}. Период уже ЗАВЕРШЁН.`);
 else{
  const m=S.months.find(x=>n>=x.start&&n<=x.end);
  L.push(`Период Life Planner: ${dfull(S.period.start)} — ${dfull(S.period.end)}. Период идёт.`);
  L.push(m?`Текущий месяц плана: ${m.label} (${m.id}, ${m.start} — ${m.end}).`
          :"Текущий месяц плана определить не удалось.");
 }
 L.push(sw===cw
  ? `Неделя, открытая в Life Planner: ${weekLabel(sw)} — это и есть текущая календарная неделя.`
  : `Неделя, сохранённая в Life Planner: ${weekLabel(sw)} (начинается ${sw}). Это НЕ текущая календарная неделя — план в приложении отстал на ${Math.max(0,Math.round(daysBetween(sw,cw)/7))} нед. Текущая календарная неделя: ${weekLabel(cw)}.`);
 return L.join("\n");
}
const PRIO={3:"ключевая",2:"важная",1:"поддерживающая"};

  const r=g.type==="result"?(pr?`${pr.name}: сейчас ${pc==null?"нет данных":xnum(pc)}${pr.unit?" "+pr.unit:""}, цель ${xnum(pr.target)}${pr.unit?" "+pr.unit:""} (старт ${xnum(pr.baseline)})`:"показатель результата не задан")
   :g.type==="count"?`${g.metrics.map(m=>`${m.name}: ${xfmt(mFact(m))} из ${xfmt(m.total)}`).join("; ")}`
   :`этапов пройдено ${g.milestones.filter(x=>x.done).length} из ${g.milestones.length}`;
  return `- ${g.name} (приоритет: ${PRIO[g.priority]}; срок ${dfull(g.deadline)}): ${r}. Прогресс результата ${resultPct(g)}%, прогресс действий ${actionPct(g)}%.`;

  const rule=r.successRule==="higher_better"?"больше — лучше":r.successRule==="lower_better"?"меньше — лучше":r.successRule==="range"?`держаться в диапазоне ${xfmt(r.rangeMin)}–${xfmt(r.rangeMax)}`:"прийти к значению";

ГЛАВНЫЕ ПРАВИЛА:
— обязательны только type и version; всё остальное — по ситуации, и только то, что мы обсудили;
— НИКОГДА не создавай resultEntries на основании предположения, baseline, расчёта, прогноза, интерпретации или рекомендации. Добавляй их только тогда, когда я явно сообщила фактически измеренное значение. Если неизвестно, факт это или оценка, — не добавляй;
— baseline не является фактом и не является resultEntry. Target тоже не является фактом;
— в resultEntries дата обязательна и должна быть настоящей датой измерения. Не ставь сегодняшнюю дату старому значению только потому, что другой даты нет. Если я сказала, что значение актуально сегодня, поставь фактическую сегодняшнюю дату;
— фактический результат существующего показателя меняется ТОЛЬКО через resultEntries;
— у нового показателя реальное измерение передаётся через его initialEntries, а не через resultEntries: id ещё не существует;
— для newResultMetrics baseline и target обязательны и должны быть числами; при successRule "range" обязательны rangeMin и rangeMax;
— status "done" не используется, чтобы «нарисовать» достигнутый результат: достижение подтверждается фактическими записями. Менять active/paused можно;
— не меняй цели, показатели, метрики и гипотезы, которые мы не обсуждали;
— не создавай новую цель, метрику, показатель или гипотезу, если достаточно изменить существующую;
— не создавай дубликаты гипотез;
— не смешивай метрики действий (сколько сделано) и показатели результата (что изменилось);
— если действие относится к существующей метрике, обязательно укажи её metricId, иначе факт не обновится;
— для объёмной метрики используй type "volume", planned — реальный объём за неделю, а не количество нажатий; для счётной — "count"; для разовой — "binary" и planned 1;
— регулярные действия должны остаться в новой неделе, если их месячный план ещё не закрыт;
— в monthPlanUpdates меняется только план, факт не трогается;
— если создаёшь новую цель вместе с её действиями, передавай эти действия внутри newGoals[].metrics. Не создавай сначала пустую цель отдельным пакетом и не придумывай goalId для её метрик;
— newGoals[].metrics — это метрики действий новой цели: те же поля, что и в newMetrics (name, emoji, unit, valueType, total, regular, perWeek, easyWeek, monthPlans), но goalId в них не нужен и не допускается;
— total и monthPlans необязательны: если метрика регулярная с perWeek, но без total и monthPlans, она будет повторяться каждую неделю по этому ритму, без месячного лимита;
— newMetrics на верхнем уровне — только для добавления метрики к УЖЕ существующей цели, и там goalId обязателен и должен быть настоящим;
— goalId, metricId, resultId, monthId и id гипотез существующих объектов бери строго из блока технических идентификаторов ниже, никогда не придумывай их;
— идентификаторы создаваемых объектов не нужны вовсе: ни id новой цели в newGoals, ни goalId у newGoals[].metrics, ни id новой метрики, показателя или гипотезы — приложение создаст их само;

/* все JSON-объекты верхнего уровня из текста: учитываем вложенность, строки и экранирование */
function scanJSONObjects(text){
 const out=[], t=String(text||"");
 for(let i=0;i<t.length;i++){
  if(t[i]!=="{") continue;
  let depth=0, inStr=false, esc=false;
  for(let j=i;j<t.length;j++){
   const c=t[j];
   if(inStr){ if(esc) esc=false; else if(c==="\\") esc=true; else if(c==='"') inStr=false; continue; }
   if(c==='"'){ inStr=true; continue; }
   if(c==="{") depth++;
   else if(c==="}"){ depth--;
    if(depth===0){ const chunk=t.slice(i,j+1);
     try{ const o=JSON.parse(chunk); if(o&&typeof o==="object") out.push(o); }catch(e){}
     i=j; break; } }
  }
 }
 return out;
}
/* можно вставлять весь ответ модели: ищем нужный пакет среди всех блоков и объектов */
function extractJSON(txt,expectedType){
 if(!txt) return null;
 const t=String(txt);
 const cand=[];
 /* сначала блоки в тройных кавычках, затем весь текст целиком */
 const fences=t.match(/```[a-zA-Z]*\s*[\s\S]*?```/g)||[];
 fences.forEach(f=>{ const body=f.replace(/^```[a-zA-Z]*\s*/,"").replace(/```$/,"");
  try{ const o=JSON.parse(body.trim()); if(o&&typeof o==="object") cand.push(o); }catch(e){}
  scanJSONObjects(body).forEach(o=>cand.push(o));
 });
 scanJSONObjects(t.replace(/```[a-zA-Z]*\s*[\s\S]*?```/g,"")).forEach(o=>cand.push(o));
 if(!expectedType) return cand[0]||null;
 const hit=cand.find(o=>o&&o.type===expectedType);
 if(hit) return hit;
 const other=cand.find(o=>o&&typeof o.type==="string"&&o.type!==expectedType);

}

/* детерминированный хеш всей строки пакета: разные пакеты не получают одинаковый ключ */
function strHash(str){
 let h1=0x811c9dc5, h2=0x01000193;
 for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i);
  h1=(h1^c)>>>0; h1=(h1*0x01000193)>>>0;
  h2=(h2+c*(i%31+1))>>>0; h2=((h2<<5)|(h2>>>27))>>>0; }

}
/* строгая дата: 2026-02-31 и 2026-02-29 не проходят — календарь не нормализуем */
function isDate(s){
 if(typeof s!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
 const y=+s.slice(0,4), m=+s.slice(5,7), d=+s.slice(8,10);
 if(m<1||m>12||d<1||d>31) return false;
 const dt=new Date(Date.UTC(y,m-1,d));

}

const newMetricHasMonthlyPlan=o=>Object.keys((o&&o.plans)||{}).length>0||(Number(o&&o.total)||0)>0;
/* ЕДИНСТВЕННЫЙ алгоритм месячных планов новой метрики — им пользуются и предпросмотр, и создание.
   Состояние не меняется, возвращается новый объект {monthId: число}. */
function buildNewMetricPlans(o,months){

 const plans=(o&&o.plans)||{};
 if(Object.keys(plans).length){                       /* планы заданы явно — берём как есть, остаток не раскидываем */
  Object.keys(plans).forEach(k=>{ if(k in out) out[k]=Number(plans[k])||0; });
  return out;
 }
 const total=Math.max(0,Math.round(Number(o&&o.total)||0)), n=(months||[]).length;
 if(!total||!n) return out;                           /* объёма нет — месячных планов тоже, ничего не выдумываем */
 const base=Math.floor(total/n), rest=total-base*n;   /* сумма по месяцам в точности равна total */

/* только мутации текущего S: ни save, ни render, ни модалок — вызывается внутри транзакции */
/* одна отмеченная галочка «в текущую неделю» → одна задача. Вызывается только после того,
   как у цели и метрики появились настоящие идентификаторы. */
function addWeekTaskFor(r,addNew,key,g,m){
 if(r.week||!Array.isArray(addNew)||!addNew.includes(key)) return false;
 const offer=(r.newRegWeek||[]).find(x=>x.key===key);
 if(!offer||!(offer.planned>0)) return false;
 if(S.week.tasks.some(t=>t.metricId===m.id)) return false;
 S.week.tasks.push({id:uid(),goalId:g.id,metricId:m.id,title:m.name,
  type:m.valueType==="volume"?"volume":"count",planned:offer.planned,completed:0,done:false,
  imp:false,challenge:false,easy:m.easyWeek?`Лёгкая версия: ${uFmt(m.easyWeek,m.unit||"")}`:"",day:"",note:"",
  carried:0,reason:"",reasons:[],xpGiven:false,source:{kind:"metric",id:m.id,goalId:g.id}});
 return true;
}
function mutateUpdateState(r,addReg,addNew){
 let n=0;                       /* ключ пакета записывает транзакция, а не сама мутация */
 if(r.week){
  const tasks=r.week.tasks.slice();
  if(addReg) r.missReg.forEach(m=>{const g=goalOf(m.goalId); if(!g) return;
   const me=g.metrics.find(x=>x.id===m.metricId); if(!me) return;
   tasks.push({id:uid(),goalId:g.id,metricId:me.id,title:me.name,
    type:me.valueType==="volume"?"volume":"count",planned:m.per,completed:0,done:false,
    imp:false,challenge:false,easy:me.easyWeek?`Лёгкая версия: ${uFmt(me.easyWeek,me.unit||"")}`:"",day:"",note:"",carried:0,reason:"",reasons:[],xpGiven:false,
    source:{kind:"metric",id:me.id,goalId:g.id}});});
  const sameWeek=mondayOf(S.week.start)===r.week.start;
  if(!sameWeek){ archiveWeek(); fillSkippedWeeks(mondayOf(S.week.start),r.week.start); }                                  // дубликат недели не создаётся
  /* та же неделя: план ИИ заменяет только оставшуюся часть, выполненное остаётся */
  const kept=sameWeek?S.week.tasks.filter(t=>t.done):[];
  S.week={start:r.week.start,focus:r.week.focus||S.week.focus,challenge:r.week.challenge,
   review:sameWeek?(S.week.review||{a1:"",a2:"",a3:""}):{a1:"",a2:"",a3:""},tasks:mergeWeekTasks(kept,tasks)};
  S.newWeekPending=false; S.firstWeek=false; n++;
 }
 r.goalUpdates.forEach(o=>{const g=goalOf(o.id); if(!g) return;
  if(o.fields.name) g.name=o.fields.name;
  if(o.fields.deadline) g.deadline=o.fields.deadline;
  if(o.fields.priority) g.priority=o.fields.priority;
  if(o.fields.status) g.status=o.fields.status;
  if(o.fields.hypothesis) g.hypothesis=o.fields.hypothesis;
  if(o.fields.note) g.note=o.fields.note; n++;});
 r.metricUpdates.forEach(o=>{const g=goalOf(o.goalId); const m=g&&g.metrics.find(x=>x.id===o.metricId); if(!m) return;
  if(o.fields.name) m.name=o.fields.name;
  if(o.fields.total!=null) m.total=o.fields.total;
  if(o.fields.regular!=null) m.regular=o.fields.regular;
  if(o.fields.valueType) m.valueType=o.fields.valueType;
  if(o.fields.perWeek!=null) m.perWeek=o.fields.perWeek;
  if(o.fields.easyWeek!=null) m.easyWeek=o.fields.easyWeek;
  if(m.regular&&!m.perWeek) m.perWeek=1; n++;});
 r.newMetrics.forEach((o,idx)=>{ const g=goalOf(o.goalId); if(!g) return;
  const m=metric(o.name,o.emoji,o.unit,o.total,S.months.map(()=>0),o.regular,o.perWeek||1,o.easyWeek,o.valueType);
  m.plan=buildNewMetricPlans(o,S.months);            /* тот же алгоритм, что показал предпросмотр */
  g.metrics.push(m); n++;
  if(addWeekTaskFor(r,addNew,"nm:"+idx,g,m)) n++;
 });
 r.newResultMetrics.forEach(o=>{ const g=goalOf(o.goalId); if(!g) return;
  const rm=resultMetric({name:o.name,emoji:o.emoji,unit:o.unit,type:o.type,successRule:o.successRule,
   baseline:o.baseline,target:o.target,rangeMin:o.rangeMin,rangeMax:o.rangeMax,
   accumulationPeriod:o.accumulationPeriod,checkFrequency:o.checkFrequency,primary:o.primary});
  g.results=g.results||[]; g.results.push(rm);
  if(rm.primary) g.results.forEach(x=>{if(x!==rm)x.primary=false;});
  if(!g.results.some(x=>x.primary)) rm.primary=true;
  /* baseline — только точка отсчёта: сам по себе он в журнал не попадает */
  (o.initialEntries||[]).forEach(e=>rAdd(g,rm,e.value,e.date,"ai_update",e.note||"фактическое измерение"));
  n++; });
 r.resultMetricUpdates.forEach(o=>{ const f=resultOf(o.id); if(!f) return;
  Object.assign(f.r,o.fields);
  if(o.fields.primary) f.g.results.forEach(x=>{if(x!==f.r)x.primary=false;});
  if(!f.g.results.some(x=>x.primary)&&f.g.results.length) f.g.results[0].primary=true;
  f.r.needsReview=false; n++; });
 r.resultEntries.forEach(o=>{ const f=resultOf(o.resultId); if(!f) return;
  rAdd(f.g,f.r,o.value,o.date,"ai_update",o.note);
  refreshAutoDone(f.g,true);                       /* статус цели считает только общий помощник */
  n++; });
 r.hypothesisUpdates.forEach(o=>{const h=S.hyps.find(x=>x.id===o.id); if(!h) return;
  h.hist=h.hist||[];
  h.hist.push({date:today(),status:h.status,conclusion:h.conclusion||"",result:h.result||"",nextTest:h.nextTest||""});
  if(o.fields.status) h.status=o.fields.status;
  if(o.fields.conclusion) h.conclusion=o.fields.conclusion;
  if(o.fields.nextTest) h.nextTest=o.fields.nextTest;
  if(o.fields.result) h.result=h.result?`${h.result}\n${o.fields.result}`:o.fields.result;  // старый результат сохраняем
  n++;});
 r.monthPlanUpdates.forEach(o=>{const g=goalOf(o.goalId); const m=g&&g.metrics.find(x=>x.id===o.metricId); if(!m) return;
  m.plan[o.monthId]=o.planned; n++;});                                   // факт не трогаем
 r.newGoals.forEach((u,gi)=>{
  const g={id:"g_"+uid(),emoji:u.emoji,name:u.name,sphereId:u.sphereId,type:u.type,priority:u.priority,status:"active",
   deadline:u.deadline,result:{from:u.from,to:u.to,current:u.from,unit:u.unit},results:[],metrics:[],milestones:[],
   hypothesis:"",full:"",easy:"",note:""};
  const nested=(u.metrics||[]);
  /* метрики, присланные вместе с целью: сначала появляется настоящий id цели, потом настоящие id метрик */
  nested.forEach((o,mi)=>{
   const me=metric(o.name,o.emoji,o.unit,o.total,S.months.map(()=>0),o.regular,o.perWeek,o.easyWeek,o.valueType);
   me.plan=buildNewMetricPlans(o,S.months);       /* тот же алгоритм, что и у обычных новых метрик */
   g.metrics.push(me);
  });
  /* прежний короткий формат работает только когда своих метрик не прислали — иначе получился бы дубль */
  if(!nested.length&&u.type==="count"&&u.total>0){
   const me=metric(u.name,"✅",u.unit||"шт",u.total,[],u.regular,u.perWeek||1,0,u.valueType); me.plan=planFor(u.total); g.metrics.push(me);}
  if(u.type==="project") g.milestones=u.steps.map(t=>({id:uid(),title:t,done:false}));
  S.goals.push(g);
  nested.forEach((o,mi)=>{ if(addWeekTaskFor(r,addNew,"ng:"+gi+":"+mi,g,g.metrics[mi])) n++; });
  if(u.type==="result"){
   /* показатель создаётся сразу, но baseline фактом не становится — только реальные initialEntries */
   const rm=resultMetric({name:u.name,emoji:g.emoji||"🎯",unit:u.unit||"",type:"current_state",
    successRule:(Number(u.to)||0)<(Number(u.from)||0)?"lower_better":"higher_better",
    baseline:Number(u.from)||0,target:Number(u.to)||0,checkFrequency:"weekly",primary:true});
   g.results=[rm];
   (u.initialEntries||[]).forEach(e=>rAdd(g,rm,e.value,e.date,"ai_update",e.note||"фактическое измерение"));
  }
  n++;});
 r.newHypotheses.forEach(o=>{
  const g=goalOf(o.goalId); if(!g) return;
  S.hyps.push({id:"h_"+uid(),goalId:g.id,name:o.name,start:o.start,assume:o.assume,test:o.test,
   result:"",conclusion:"",nextTest:"",status:o.status,hist:[]});
  if(o.primary&&o.assume) g.hypothesis=o.assume;
  n++;});
 r.pauseGoals.forEach(id=>{const g=goalOf(id); if(g){g.status="paused"; n++;}});
 return n;
}
/* безопасное применение: подтверждение → копия → работа на кандидате → проверка → один финальный commit */
function applyUpdate(r,addReg,confirmed,addNew){
 if(r.alreadyApplied&&!confirmed){
  modal({title:"Этот пакет уже применялся",body:`
   <div class="sub">Повторное применение может создать дубли или повторно изменить данные.</div>
   <div class="hint warn" style="margin-top:14px">Если это тот же самый пакет из ИИ, лучше отменить.</div>`,
   actions:[{t:"Скасувати",c:"o",fn:closeModal},{t:"Применить повторно",c:"red",fn:()=>applyUpdate(r,addReg,true,addNew)}]});
  return {ok:false,pending:true};
 }
 const bk=writePreImportBackup();
 if(!bk.ok){ toast("Не удалось создать резервную копию. Изменения из ИИ не применены."); return {ok:false,error:"backup"}; }
 const keep=S, keepTab=TAB, keepSel=MSEL;
 let cand=null;
 try{ cand=JSON.parse(JSON.stringify(S)); }catch(e){ toast("Изменения из ИИ не применены. Планер остался без изменений."); return {ok:false,error:"copy"}; }
 let cnt=0;
 try{
  S=cand;
  if(r.packetKey){ S.appliedPackets=S.appliedPackets||[]; S.appliedPackets.push({key:r.packetKey,date:today()}); if(S.appliedPackets.length>40) S.appliedPackets.shift(); }
  cnt=mutateUpdateState(r,addReg,addNew);
  jTouch();
  const v=validateState(S);
  if(!v.ok) throw new Error(v.error);
  MSEL=null;
  ["home","week","goals","path","wrev","mrev","ach","hyp","hist"].forEach(t=>{TAB=t;viewFor(t)();});
 }catch(e){
  S=keep; TAB=keepTab; MSEL=keepSel; jTouch();
  toast("Изменения из ИИ не применены. Планер остался без изменений.");
  return {ok:false,error:(e&&e.message)||"apply"};
 }
 S=cand; TAB=r.week?"week":"goals"; MSEL=keepSel;
 closeModal(); commit(`✅ Изменения применены (${cnt})`);
 return {ok:true,n:cnt};
}

/* фактический результат нельзя записать будущей датой */
function futureGuard(date,onOk,onFix){
 if(date<=today()){ onOk(); return; }
 modal({title:"Дата ещё не наступила",body:`<div class="sub">${dfull(date)} — это будущее. Показатель результата фиксирует то, что уже измерено, поэтому такую запись сохранить нельзя.</div>
  <div class="hint" style="margin-top:14px">Поставь сегодняшнюю дату или дату, когда измерение действительно было.</div>`,
  actions:[{t:"Скасувати",c:"o",fn:closeModal},{t:"Изменить дату",fn:()=>{ closeModal(); if(onFix) setTimeout(onFix,60); }}]});
}
/* уменьшение накопленного внутри одного периода — почти всегда ошибка ввода */
function cumulativeGuard(g,rm,value,date,onOk){
 if(rm.type!=="cumulative_period"){ onOk(); return; }
 const b=bucketOf(rm,date);
 const inB=rEntries(rm.id).filter(x=>eBucket(rm,x)===b&&x.date<=date);
 if(!inB.length){ onOk(); return; }
 const prev=Number(inB[inB.length-1].value);
 if(value>=prev){ onOk(); return; }
 modal({title:"Значение меньше предыдущего",body:`
  <div class="sub">В периоде «${esc(bucketLabel(rm,b))}» уже записано ${vfmt(prev)}${rm.unit?" "+esc(rm.unit):""}, а сейчас введено ${vfmt(value)}${rm.unit?" "+esc(rm.unit):""}.</div>
  <div class="hint" style="margin-top:14px">Для накопительного показателя вводится общая сумма с начала периода, а не прибавка. Что это?</div>`,
  actions:[
   {t:"Скасувати",c:"o",fn:closeModal},
   {t:"Это прибавка",c:"o",fn:()=>{ closeModal(); rAdd(g,rm,prev+value,date,"manual","введена прибавка "+vfmt(value)); commit(`Записано ${vfmt(prev+value)}`); }},
   {t:"Исправить прошлую запись",c:"o",fn:()=>{ const i=S.journal.findIndex(x=>x.id===inB[inB.length-1].id);
     if(i>=0) S.journal.splice(i,1); jTouch(); closeModal(); rAdd(g,rm,value,date,"manual","исправление прошлой записи"); commit("Запись исправлена"); }},
   {t:"Да, накоплено столько",fn:()=>{ closeModal(); onOk(); }}]});
}
/* дата вне периода: спросить, а не молча принять */
function outOfPeriodGuard(date,onOk){
 if(date>=S.period.start&&date<=S.period.end){ onOk(); return; }
 modal({title:"Дата вне периода",body:`<div class="sub">${dfull(date)} находится за пределами периода ${dfull(S.period.start)} — ${dfull(S.period.end)}.</div>
  <div class="hint" style="margin-top:14px">Такая запись не попадёт ни в один месяц и не будет видна в помесячной таблице.</div>`,
  actions:[{t:"Скасувати",c:"o",fn:closeModal},
   {t:"Расширить период",c:"o",fn:()=>{
    const a=date<S.period.start?date:S.period.start, b=date>S.period.end?date:S.period.end;
    rebuildMonths(a,b); checkPeriods(); closeModal(); onOk(); toast("Период расширен");}},
   {t:"Всё равно записать",fn:()=>{ closeModal(); onOk(); }}]});
}

 modal({title:isNew?"➕ Новая метрика":"Метрика",wide:true,body:`

    <span class="small" id="kTh" style="display:block;margin-top:6px">${isMinUnit(m.unit)?"= "+formatMinutes(m.total):""}</span></label>

  <label class="f"><span>Как выполняется эта метрика?</span><select id="kR">
    <option value="1" ${m.regular?"selected":""}>🔁 Регулярно каждую неделю</option>
    <option value="0" ${!m.regular?"selected":""}>📅 По необходимости и по плану</option></select></label>
  <div class="g2" id="kRbox" style="${m.regular?"":"display:none"}">
   <label class="f"><span>Обычно в неделю</span><input type="number" id="kW" value="${m.perWeek||1}" min="1"></label>
   <label class="f"><span>🌱 Лёгкая версия в неделю</span><input type="number" id="kEz" value="${m.easyWeek||0}" min="0"></label>
  </div>
  <div class="hint" style="margin-bottom:16px">Регулярная метрика сама возвращается в план каждой новой недели. Если месячный план по ней уже закрыт, лишний объём не добавляется.</div>
  <div class="small" style="margin:6px 0 10px">План по месяцам — можно распределить неравномерно</div>

  <button class="btn o s" id="spread">Разделить поровну</button>`,
  actions:[{t:"Скасувати",c:"o",fn:back||closeModal},{t:"Зберегти",fn:()=>{
   m.name=val("kN").trim()||"Действия"; m.emoji=pickedEmo("#kE"); m.total=Number(val("kT"))||0; m.unit=val("kU");
   m.valueType=val("kV")==="volume"?"volume":"count";
   m.regular=val("kR")==="1"; m.perWeek=m.regular?Math.max(1,Number(val("kW"))||1):0; m.easyWeek=m.regular?(Number(val("kEz"))||0):0;
   S.months.forEach(x=>m.plan[x.id]=Number(val("kp_"+x.id))||0);
   const sum=mPlanSum(m);
   if(m.total&&sum!==m.total) setTimeout(()=>toast(`По месяцам распределено ${aFmt(sum,m.unit)} из ${aFmt(m.total,m.unit)}`),400);

 $("#spread").onclick=()=>{const t=Number(val("kT"))||0,n=S.months.length;

 })();
}

 modal({title:mm.label,wide:true,body:`
  <label class="f"><span>Тема месяца</span><input type="text" id="moT" value="${esc(d.theme)}"></label>

  ${rows.length?`<div class="divider"></div><div style="font-size:16px;margin-bottom:10px">📊 План и факт</div>
   ${rows.map(({g,m})=>`<div class="rowj" style="padding:7px 0"><span style="font-size:15px">${m.emoji||"✅"} ${esc(m.name)} <span class="small">${g.emoji}</span></span>
     <span class="num">${aFmt(fMonth(m,id),m.unit)} / ${aFmt(m.plan[id]||0,m.unit)}</span></div>`).join("")}`:""}

  <div class="rowj" style="margin-bottom:10px"><span style="font-size:16px">📝 Пункты плана</span><button class="btn g s" id="addStep">➕ Пункт</button></div>
  <div>${d.steps.map((s,i)=>{const g=goalOf(s.goalId);
   return `<div class="rowj" style="padding:9px 0;gap:10px">
    <label class="row" style="flex:1;min-width:0"><input type="checkbox" class="chk stx" data-id="${s.id}" ${s.done?"checked":""}>
     <span style="font-size:15px;color:${s.done?"var(--ink3)":"var(--ink)"}">${s.challenge?"🔥 ":s.imp?"⭐ ":""}${esc(s.title)}${g?` <span class="small">${g.emoji}</span>`:""}</span></label>
    <span style="flex:none">${isDeclined("monthStep",s.id)?`<button class="ico" data-st="${s.id}" data-k="r" title="Вернуть в планирование">↩︎</button>`:""}<button class="ico" data-st="${s.id}" data-k="u">↑</button><button class="ico" data-st="${s.id}" data-k="m">⇄</button>
     <button class="ico" data-st="${s.id}" data-k="e">✏️</button><button class="ico" data-st="${s.id}" data-k="d">🗑</button></span>
   </div>`;}).join("")||`<div class="small">Пунктов пока нет</div>`}</div>
  <div class="divider"></div>
  <div class="small">Выводы по месяцу пишутся в разделе «🔎 Итоги месяца» — там четыре вопроса и вся картина месяца рядом.</div>`,
  actions:[{t:"Закрити",c:"o",fn:closeModal},{t:"Зберегти",fn:()=>{
   d.theme=val("moT"); d.outcome=val("moO"); closeModal(); commit("Месяц сохранён");}}]});
 $("#addStep").onclick=()=>stepModal(id,null);
 document.querySelectorAll(".stx").forEach(c=>c.onchange=()=>{
  const s=d.steps.find(x=>x.id===c.dataset.id); s.done=c.checked;
  const wt=S.week.tasks.find(t=>{const q=taskSource(t);return q.kind==="monthStep"&&q.id===s.id;});
  if(wt){ wt.done=s.done; wt.completed=s.done?wt.planned:0; }
  if(s.done){ if(!s.xpGiven){addXP(s.xp||1);s.xpGiven=true;} hist({goalId:s.goalId,title:s.title,xp:s.xp||1,sourceType:"monthStep",sourceId:s.id}); toast(`✨ +${s.xp||1}`); }
  save(); monthModal(id);
 });
 document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{
  const i=d.steps.findIndex(x=>x.id===b.dataset.st), s=d.steps[i], k=b.dataset.k;
  if(k==="r"){ undecline("monthStep",s.id); save(); monthModal(id); okToast("Вернула в планирование"); }
  else if(k==="d"){ d.steps.splice(i,1); save(); monthModal(id); }
  else if(k==="u"){ if(i>0){[d.steps[i-1],d.steps[i]]=[d.steps[i],d.steps[i-1]];save();monthModal(id);} }
  else if(k==="e"){ stepModal(id,s); }
  else if(k==="m"){
   modal({title:"Перенести пункт",body:`<label class="f"><span>Куда</span><select id="mvT">
     ${S.months.filter(x=>x.id!==id).map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join("")}

     const to=val("mvT"); d.steps.splice(i,1);
     if(to==="__w") S.week.tasks.push({id:uid(),goalId:s.goalId,metricId:"",title:s.title,type:"binary",planned:1,completed:0,done:false,imp:s.imp,challenge:s.challenge,easy:"",day:"",note:"",carried:0,reason:"",xpGiven:false});
     else S.monthData[to].steps.push(s);
     save(); monthModal(id); okToast("Перенесено");}}]});
  }
 });
}
